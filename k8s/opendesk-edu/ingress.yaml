apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    haproxy-ingress.github.io/proxy-body-size: 100M
    haproxy-ingress.github.io/ssl-redirect: 'true'
    haproxy-ingress.github.io/timeout-client: 600s
    haproxy-ingress.github.io/timeout-server: 600s
  labels:
    app: opendesk-opencloud
    app.kubernetes.io/name: opendesk-opencloud
    app.kubernetes.io/part-of: opendesk
  name: opendesk-opencloud-ingress
  namespace: opendesk-edu
spec:
  ingressClassName: haproxy
  rules:
  - host: cloud.home.opendesk-edu.org
    http:
      paths:
      - backend:
          service:
            name: opendesk-opencloud
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - cloud.home.opendesk-edu.org
    secretName: opendesk-certificates-tls
---
