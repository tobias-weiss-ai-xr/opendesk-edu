apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    haproxy-ingress.github.io/ssl-redirect: 'true'
  generation: 2
  labels:
    app: element
    app.kubernetes.io/name: element
    app.kubernetes.io/part-of: opendesk
  name: element-ingress
  namespace: opendesk
spec:
  ingressClassName: haproxy
  rules:
  - host: chat.home.opendesk-edu.org
    http:
      paths:
      - backend:
          service:
            name: element
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - chat.home.opendesk-edu.org
    secretName: opendesk-certificates-tls
status:
  loadBalancer: {}
---
