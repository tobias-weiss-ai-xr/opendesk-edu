apiVersion: v1
data:
  homeserver.yaml: "server_name: \"matrix.home.opendesk-edu.org\"\npid_file: /data/homeserver.pid\n\
    listeners:\n  - port: 8008\n    tls: false\n    type: http\n    x_forwarded: true\n\
    \    bind_addresses: ['0.0.0.0']\n    resources:\n      - names: [client, federation]\n\
    \        compress: false\ndatabase:\n  name: sqlite3\n  args:\n    database: /data/homeserver.db\n\
    macaroon_secret_key: \"__SYNAPSE_MACAROON_SECRET__\"\noidc_config:\n  enabled: true\n  discovery_method: \"oidc\"\n  issuer: \"https://id.home.opendesk-edu.org/realms/opendesk\"\n  client_id: \"opendesk-matrix\"\n  client_secret: \"__SYNAPSE_OIDC_CLIENT_SECRET__\"\n  scopes: [\"openid\", \"profile\", \"email\"]\n  user_mapping_provider:\n    config:\n      localpart_template: \"{{ user.opendesk_useruuid }}\"\n      display_name_template: \"{{ user.preferred_username }}\"\napp_service_config_files:\n  - /config/appservice/intercom.yaml\nlog_config:\
    \ \"/data/log.config\"\nmedia_store_path: \"/data/media\"\nuploads_path: \"/data/uploads\"\
    \nsigning_key_path: \"/data/signing.key\"\ntrusted_key_servers:\n  - server_name:\
    \ \"matrix.org\"\nurl_preview_enabled: false\nenable_registration: false\nmax_upload_size:\
    \ 50M\nreport_stats: false\n"
  appservice-intercom.yaml: "id: intercom\nhs_token: \"__MATRIX_HS_TOKEN__\"\nas_token: \"__MATRIX_AS_TOKEN__\"\nsender_localpart: intercom\n# Synapse requires the url key (string or explicit null) even for\n# login-only appservices — explicit null: the ICS never receives pushes.\nurl:\nnamespaces:\n  users:\n    - exclusive: false\n      regex: \"@.*\"\n"
  log.config: "version: 1\nformatters:\n  precise:\n    format: '%(asctime)s - %(name)s\
    \ - %(levelname)s - %(request)s - %(message)s'\nhandlers:\n  console:\n    class:\
    \ logging.StreamHandler\n    formatter: precise\nloggers:\n  synapse:\n    level:\
    \ INFO\n  synapse.storage:\n    level: INFO\nroot:\n  level: INFO\ndisable_existing_loggers:\
    \ false\n"
immutable: false
