apiVersion: v1
data:
  bootstrap.sh: "#!/bin/bash\nset -e\nORDINAL=$(hostname | rev | cut -d'-' -f1 | rev)\n\
    echo \"Galera pod ordinal: $ORDINAL\"\n\nif [ \"$ORDINAL\" = \"0\" ]; then\n \
    \ # Pod 0: check if we need to bootstrap a new cluster\n  if [ ! -f /var/lib/mysql/grastate.dat\
    \ ]; then\n    # First boot: no grastate.dat, bootstrap new cluster with empty\
    \ address\n    echo \"Bootstrap: galera-0 first boot, starting new cluster (gcomm://)\"\
    \n    exec docker-entrypoint.sh mariadbd --wsrep-new-cluster --wsrep-cluster-address=gcomm://\n\
    \  elif grep -q \"safe_to_bootstrap: 1\" /var/lib/mysql/grastate.dat; then\n \
    \   # Cluster was stopped, this node is safe to bootstrap\n    echo \"Bootstrap:\
    \ galera-0 starting new cluster (safe_to_bootstrap=1)\"\n    exec docker-entrypoint.sh\
    \ mariadbd --wsrep-new-cluster --wsrep-cluster-address=gcomm://\n  else\n    #\
    \ Normal start: join existing cluster\n    echo \"Galera-0: starting normally,\
    \ joining cluster\"\n    exec docker-entrypoint.sh mariadbd\n  fi\nelse\n  # Pod\
    \ 1+: join existing cluster\n  echo \"Galera-$ORDINAL: joining cluster\"\n  exec\
    \ docker-entrypoint.sh mariadbd\nfi\n"
immutable: false
kind: ConfigMap
metadata:
  labels:
    app: galera
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: nix
    app.kubernetes.io/name: galera
    app.kubernetes.io/part-of: opendesk
  name: galera-bootstrap
  namespace: opendesk
---
apiVersion: v1
data:
  galera.cnf: '[mysqld]

    # Galera settings

    wsrep_on=ON

    wsrep_provider=/usr/lib/galera/libgalera_smm.so

    wsrep_cluster_name="opendesk-galera"

    wsrep_cluster_address="gcomm://galera-0.galera-headless.opendesk.svc.cluster.local:4567,galera-1.galera-headless.opendesk.svc.cluster.local:4567,galera-2.galera-headless.opendesk.svc.cluster.local:4567"

    wsrep_sst_method=rsync

    wsrep_sst_auth=root:__GALERA_ROOT_PW__


    # Binlog

    binlog_format=ROW

    default_storage_engine=InnoDB

    innodb_autoinc_lock_mode=2

    innodb_flush_log_at_trx_commit=0

    innodb_buffer_pool_size=512M


    # Character set

    character-set-server=utf8mb4

    collation-server=utf8mb4_unicode_ci


    # Networking

    bind-address=0.0.0.0

    port=3306


    # Galera ports

    wsrep_provider_options="gmcast.listen_addr=tcp://0.0.0.0:4567;pc.recovery=TRUE"


    # SST (receive address set automatically by Galera)

    wsrep_sst_receive_address=AUTO


    # Logging

    log_error=stderr

    slow_query_log=OFF


    # Safety

    skip-name-resolve=ON

    max_connections=200

    '
immutable: false
kind: ConfigMap
metadata:
  labels:
