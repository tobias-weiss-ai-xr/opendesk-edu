[server.listener.smtp]
bind = "0.0.0.0:25"
protocol = "smtp"

[server.listener.submission]
bind = "0.0.0.0:587"
protocol = "smtp"

[server.listener.submissions]
bind = "0.0.0.0:465"
protocol = "smtp"
tls.implicit = true

[server.listener.imap]
bind = "0.0.0.0:143"
protocol = "imap"

[server.listener.imaptls]
bind = "0.0.0.0:993"
protocol = "imap"
tls.implicit = true

[server.listener.pop3]
bind = "0.0.0.0:110"
protocol = "pop3"

[server.listener.pop3s]
bind = "0.0.0.0:995"
protocol = "pop3"
tls.implicit = true

[server.listener.sieve]
bind = "0.0.0.0:4190"
protocol = "managesieve"

[server.listener.https]
protocol = "http"
bind = "0.0.0.0:443"
tls.implicit = true

[server.listener.http]
protocol = "http"
bind = "0.0.0.0:8080"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "internal"

[store.rocksdb]
type = "rocksdb"
path = "/opt/stalwart/data"
compression = "lz4"

[directory.internal]
type = "internal"
store = "rocksdb"

[tracer.log]
type = "log"
level = "info"
path = "/opt/stalwart/logs"
prefix = "stalwart.log"
rotate = "daily"
ansi = false
enable = true

[authentication.fallback-admin]
