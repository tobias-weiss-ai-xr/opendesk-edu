# MOX Email Server Configuration
# Documentation: https://www.xmox.nl/config/

# Postgresql database configuration
Postgresql:
	Host: postgres
	Port: 5432
	TLS:
		Mode: Disable
	Database: mox_db
	User: mox_user
	Password: changeme

# Data directory - all data stored here
DataDir: /data

# Public configuration
Public:
	DNS:
		Hostname: ${EMAIL_DOMAIN}
		Domain: ${EMAIL_DOMAIN}

# Log configuration - use "info" level
Log:
	Levels:
		_: info
