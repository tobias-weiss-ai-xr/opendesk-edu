// SOGo 6 Configuration for openDesk
// Optimized for SOGo 6 with improved performance and caching
// Managed by: opendesk-nix/docker/sogo6/Dockerfile
// Environment variables can override these settings
// SPDX-License-Identifier: Apache-2.0
//
// Configuration Hierarchy:
// 1. Environment variables (highest priority)
// 2. This configuration file
// 3. SOGo defaults (lowest priority)

{
  /* ================================================================ */
  /* DATABASE CONFIGURATION                                        */
  /* Override with: SOGO_PROFILE_URL, SOGO_FOLDER_INFO_URL,         */
  /*                SOGO_SESSIONS_URL                                */
  /* ================================================================ */
  
  // PostgreSQL connection for user profiles
  SOGoProfileURL = "postgresql://sogo:sogo@postgresql.opendesk.svc:5432/sogo";
  
  // PostgreSQL connection for folder information
  OCSFolderInfoURL = "postgresql://sogo:sogo@postgresql.opendesk.svc:5432/sogo";
  
  // PostgreSQL connection for sessions
  OCSSessionsFolderURL = "postgresql://sogo:sogo@postgresql.opendesk.svc:5432/sogo";
  
  /* ================================================================ */
  /* EMAIL DOMAINS                                                 */
  /* Override with: SOGO_EMAIL_DOMAINS                              */
  /* Format: ("domain1.org", "domain2.org")                        */
  /* ================================================================ */
  OCSEMailDomains = ("opendesk.org");
  
  /* ================================================================ */
  /* AUTHENTICATION & USER SOURCES                                 */
  /* Override with: SOGO_USER_SOURCES (complete LDAP config)       */
  /* ================================================================ */
  
  // LDAP Configuration for user authentication
  SOGoUserSources = (
    {
      // LDAP server connection
      type = ldap;
      host = "ldap://ldap.opendesk.svc:389";
      port = 389;
      
      // LDAP base configuration
      baseDN = "dc=opendesk,dc=org";
      bindDN = "cn=admin,dc=opendesk,dc=org";
      
      // LDAP password - read from:
      // 1. /etc/sogo/ldap-password file (created from SOGO_LDAP_BIND_PASSWORD env)
      // 2. This field is replaced during startup
      bindPassword = "${SOGO_LDAP_BIND_PASSWORD}";
      
      // User identification
      idFieldName = uid;
      UIDFieldName = uid;
      CNFieldName = cn;
      UIDFieldNames = ("uid", "sAMAccountName");
      
      // Search configuration
      base = "ou=users";
      scope = SUB;  // SUB for subtree search
      
      // Address book configuration
      isAddressBook = YES;
      displayName = "OpenDesk LDAP Directory";
      canAuthenticate = YES;
      
      // Connection settings
      timeout = 10;  // seconds
      maxRetryCount = 3;
      connectionUseTLS = YES;  // Use TLS for LDAP connections
      
      // Group configuration
      groupBaseDN = "ou=groups,dc=opendesk,dc=org";
      groupFieldName = "cn";
      groupFilter = "(objectClass=posixGroup)";
      
      // User filters
      userFilter = "(objectClass=posixAccount)";
      userGroupsFilter = "(&(objectClass=posixAccount)(uid=%s))"
    }
  );
  
  /* ================================================================ */
  /* MAIL SERVER CONFIGURATION                                      */
  /* Override with: SOGO_IMAP_SERVER, SOGO_SMTP_SERVER,             */
  /*                SOGO_SIEVE_SERVER                                */
  /* ================================================================ */
  
  // IMAP Server
  SOGoIMAPServer = "imap.opendesk.svc";
  SOGoIMAPAuthMethod = "plain";
  
  // SMTP Server
  SOGoSMTPServer = "smtp.opendesk.svc";
  SOGoSMTPAuthMethod = "plain";
  
  // Sieve Server (for mail filtering)
  SOGoSieveServer = "sieve.opendesk.svc";
  
  /* ================================================================ */
  /* MEMCACHED CONFIGURATION (Crucial for SOGo 6 performance)       */
  /* Override with: SOGO_MEMCACHED_HOST, SOGO_MEMCACHED_PORT         */
  /* ================================================================ */
  
  // Memcached server - SOGo 6 heavily relies on caching
  SOGOMemcachedHost = "memcached.opendesk.svc";
  SOGOMemcachedPort = "11211";
  
  // Cache cleanup interval
  SOGOCacheCleanupInterval = 300;  // 5 minutes
  
  /* ================================================================ */
  /* PERFORMANCE SETTINGS (Optimized for SOGo 6)                    */
  /* Override with: SOGO_MAX_MESSAGE_SIZE, SOGO_WORKERS,           */
  /*                SOGO_MAX_THREADS                                */
  /* ================================================================ */
  
  // Message size limits
  SOGoMaximumMessageSize = 200;  // 200 MB (increased for SOGo 6)
  SOGoMaximumAttachmentsSize = 100;  // 100 MB per attachment
  
  // Worker configuration - SOGo 6 can handle more workers
  WOWorkersCount = 15;  // Number of worker processes
  WOMaxThreadsPerWorker = 200;  // Threads per worker
  
  // Connection timeouts
  WOMessageRetryCount = 3;
  WOMessageRetryInterval = 5;  // seconds
  
  // SOGo 6 specific optimizations
  SOGoMaximumPingLifetime = 600;  // 10 minutes
  SOGoMaximumIdleLifetime = 1800;  // 30 minutes
  SOGoMaximumSyncWindow = 14;  // days (2 weeks)
  
  // Database connection pooling (SOGo 6 only)
  SOGoMaximumDBConnections = 30;
  SOGoDBConnectionPoolSize = 10;
  SOGoDBConnectionMaximumLifetime = 3600;  // 1 hour
  
  /* ================================================================ */
  /* LOGGING CONFIGURATION                                          */
  /* ================================================================ */
  
  // Logging levels (can be enabled via SOGO_DEBUG=YES)
  SOGoDebugRequests = NO;
  SOGoDebugSQLQueries = NO;
  SOGoDebugSieveScripts = NO;
  
  // Log file locations
  SOGoLogFile = "/var/log/sogo/sogo.log";
  SOGoIMAPLogFile = "/var/log/sogo/imap.log";
  SOGoSMTPLogFile = "/var/log/sogo/smtp.log";
  
  // Log rotation is handled externally
  SOGoLogMaxSize = 100;  // MB
  SOGoLogMaxCount = 5;  // Number of rotated logs
  
  /* ================================================================ */
  /* SESSION SETTINGS                                              */
  /* ================================================================ */
  
  // Session lifetime (in seconds)
  SOGoSessionTimeOut = 1800;  // 30 minutes of inactivity
  SOGoMaximumSessionLength = 86400;  // 24 hours maximum session
  
  /* ================================================================ */
  /* DEFAULT SETTINGS                                              */
  /* Override with: SOGO_LANGUAGE, SOGO_TIMEZONE                   */
  /* ================================================================ */
  
  // Default calendar and address book
  SOGoDefaultCalendar = YES;
  SOGoDefaultAddressBook = YES;
  
  // Language and timezone (override with env vars)
  SOGoLanguage = "German";
  SOGoTimeZone = "Europe/Berlin";
  
  // Email settings
  SOGoMailCustomFrom = YES;
  SOGoMailFieldName = "mail";
  
  /* ================================================================ */
  /* FEATURES & CAPABILITIES                                        */
  /* ================================================================ */
  
  // Enable public access for shared resources
  SOGoEnablePublicAccess = YES;
  
  // Security: Enable XSRF validation
  SOGoXSRFValidationEnabled = YES;
  
  // Folder subscriptions
  SOGoFollowingEnabled = YES;
  SOGoSubscriptionEnabled = YES;
  
  // Calendar delegate options
  SOGoDelegateOptions = (YES, NO);
  
  /* ================================================================ */
  /* SECURITY SETTINGS                                              */
  /* ================================================================ */
  
  // Super users (can manage all users)
  SOGoSuperUsernames = ("admin");
  
  // Password policies
  SOGoPasswordChangeEnabled = YES;
  SOGoMinimumPasswordLength = 12;  // Stronger for SOGo 6
  SOGoPasswordAlgorithm = "ssha512";  // Secure hashing
  
  // Authentication method
  SOGoAuthenticationMethod = "ldap";
  
  /* ================================================================ */
  /* COMPATIBILITY & INTEGRATION                                    */
  /* ================================================================ */
  
  // Compatibility with various mail clients
  SOGoEnableEMailAlarms = YES;
  SOGoMailingMechanism = smtp;
  
  // Calendar notifications
  SOGoAppointmentSendEMailNotifications = YES;
  SOGoAppointmentSendSMSNotifications = NO;
  
  // Calendar reminders
  SOGoAppointmentSendReminders = YES;
  SOGoAppointmentReminderTime = 15;  // minutes before
  
  /* ================================================================ */
  /* ADDRESS BOOK & CONTACTS                                        */
  /* ================================================================ */
  
  // LDAP attributes for contacts
  LDAPContactInfoAttribute = "mail";
  LDAPPhoneAttribute = "telephoneNumber";
  LDAPMobileAttribute = "mobile";
  LDAPFaxAttribute = "facsimileTelephoneNumber";
  LDAPPostalAddressAttribute = "postalAddress";
  
  // Enable global address book
  SOGoEnableGlobalAddressBook = YES;
  
  /* ================================================================ */
  /* PERFORMANCE OPTIMIZATIONS FOR SOGO 6                           */
  /* ================================================================ */
  
  // Enable connection reuse
  SOGoUseMultipleDBConnections = YES;
  
  // Enable indexing for faster searches
  SOGoEnableIndexing = YES;
  SOGoIndexerLogFile = "/var/log/sogo/indexer.log";
  
  // Calendar indexing
  SOGoCalendarIndexing = YES;
  SOGoContactsIndexing = YES;
  SOGoMailIndexing = NO;  // Disabled by default for performance
  
  /* ================================================================ */
  /* CLIENT COMPATIBILITY                                          */
  /* ================================================================ */
  
  // Outlook compatibility
  SOGoOutlookCompatibility = YES;
  
  // Calendar and contacts sync
  SOGoEnableCalDAV = YES;
  SOGoEnableCardDAV = YES;
  SOGoEnableGroupDAV = YES;
  
  // ActiveSync support (SOGo 6)
  SOGoEnableActiveSync = YES;
  SOGoActiveSyncLogFile = "/var/log/sogo/activesync.log";
  
  /* ================================================================ */
  /* EXTERNAL SERVICES                                             */
  /* ================================================================ */
  
  // Gravatar support ( avatar images)
  SOGoGravatarEnabled = YES;
  
  // External authentication (can be configured)
  SOGoExternalAuthenticateURL = "";  // Disable by default
  
  /* ================================================================ */
  /* DEBUG & DEVELOPMENT                                           */
  /* These are disabled in production by default                   */
  /* ================================================================ */
  
  // Development mode
  SOGoDevelopmentMode = NO;
  
  // Debug flags (can be enabled via SOGO_DEBUG=YES)
  // SOGoDebugRequests = NO;
  // SOGoDebugSQLQueries = NO;
}
