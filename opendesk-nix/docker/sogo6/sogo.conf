// SOGo 6 Configuration for openDesk Edu
// Target: /etc/sogo/sogo.conf in container
// SPDX-License-Identifier: Apache-2.0
// Maintainer: openDesk Edu Team <team@opendesk-edu.org>
//
// ==============================================================================
// SOGo 6 SPECIFIC FEATURES:
// - Modern memcached protocol (binary)
// - Improved ActiveSync support
// - Better CardDAV/CalDAV performance
// - Enhanced WebDAV compatibility
// - New RESTful API
// - Improved mobile client support
// ==============================================================================
//
// ENVIRONMENT VARIABLE OVERRIDES:
// All settings can be overridden via environment variables:
//   SOGO_PROFILE_URL, SOGO_OCS_FOLDER_INFO_URL
//   SOGO_DATABASE_HOST, SOGO_DATABASE_USER, SOGO_DATABASE_PASSWORD
//   SOGO_USER_SOURCES (JSON string)
//   SOGO_IMAP_SERVER, SOGO_SMTP_SERVER
//   SOGO_MEMCACHED_HOST
//   SOGO_WORKERS_COUNT, SOGO_MAX_THREADS
//
// ==============================================================================

{
  /* ================================================================ */
  /* PRODUCT & VERSION INFO                                         */
  /* ================================================================ */

  productName = "openDesk Edu - SOGo 6";

  /* ================================================================ */
  /* DATABASE CONFIGURATION                                        */
  /* ================================================================ */

  // PostgreSQL Configuration
  // SOGo 6 supports PostgreSQL 12+ and MariaDB/MySQL 10.4+
  // In containerized environments, use service DNS:
  //   postgres.opendesk.svc.cluster.local
  //   mariadb.opendesk.svc.cluster.local
  
  SOGoProfileURL = "${SOGO_PROFILE_URL:-postgresql://sogo:sogo@postgresql.opendesk.svc.cluster.local:5432/sogo?sslmode=disable}";
  OCSFolderInfoURL = "${SOGO_OCS_FOLDER_INFO_URL:-postgresql://sogo:sogo@postgresql.opendesk.svc.cluster.local:5432/sogo?sslmode=disable}";
  OCSSessionsFolderURL = "${SOGO_OCS_SESSIONS_FOLDER_URL:-postgresql://sogo:sogo@postgresql.opendesk.svc.cluster.local:5432/sogo?sslmode=disable}";

  // SOGo 6 database optimizations
  // Larger connection pool for better performance
  SOGoMaximumDBConnections = ${SOGO_MAX_DB_CONNECTIONS:-100};
  SOGoDBConnectionPoolSize = ${SOGO_DB_POOL_SIZE:-20};
  SOGoUseMultipleDBConnections = YES;
  SOGoDBConnectionTimeout = 30;
  
  // Enable prepared statements for PostgreSQL
  SOGoEnablePreparedStatements = YES;

  /* ================================================================ */
  /* EMAIL DOMAINS & HOSTNAME                                       */
  /* ================================================================ */

  // Email domains
  OCSEMailDomains = (${SOGO_MAIL_DOMAINS:-"opendesk-edu.org", "opendesk.org"});

  // Service hostname
  SOGoHostName = "${SOGO_HOSTNAME:-sogo.opendesk-edu.org}";
  SOGoMailFromDomain = "${SOGO_MAIL_FROM_DOMAIN:-opendesk-edu.org}";

  /* ================================================================ */
  /* USER SOURCES & AUTHENTICATION                                  */
  /* ================================================================ */

  // User Sources
  // Multiple sources can be configured
  // LDAP is primary, SQL is fallback
  
  SOGoUserSources = (
    {
      type = ldap;
      
      // LDAP Server
      host = "${SOGO_LDAP_HOST:-ldap.opendesk.svc.cluster.local:389}";
      port = ${SOGO_LDAP_PORT:-389};
      useTLS = ${SOGO_LDAP_TLS:-YES};
      
      // Bind configuration
      baseDN = "${SOGO_LDAP_BASE_DN:-dc=opendesk,dc=org}";
      bindDN = "${SOGO_LDAP_BIND_DN:-cn=admin,dc=opendesk,dc=org}";
      bindPassword = "${SOGO_LDAP_BIND_PASSWORD}";
      
      // Attribute mapping
      idFieldName = "${SOGO_LDAP_ID_FIELD:-uid}";
      UIDFieldName = "${SOGO_LDAP_UID_FIELD:-uid}";
      CNFieldName = "${SOGO_LDAP_CN_FIELD:-cn}";
      UIDFieldNames = ("uid", "sAMAccountName", "cn", "email");
      
      // Search parameters
      base = "${SOGO_LDAP_BASE:-ou=users}";
      scope = SUB;
      
      // Display settings
      isAddressBook = YES;
      displayName = "openDesk Edu Kontakte";
      canAuthenticate = YES;
      
      // Connection settings
      timeout = 10;
      maxRetryCount = 3;
      
      // Group settings
      groupBaseDN = "${SOGO_LDAP_GROUP_BASE:-ou=groups,dc=opendesk,dc=org}";
      groupFieldName = "cn";
      group_objectClasses = ("posixGroup", "groupOfNames", "openLdapGroup");
      groupFilter = "(objectClass=posixGroup)";
      groupCanAuthenticate = YES;
      
      // User filtering
      userFilter = "(objectClass=posixAccount)";
      userGroupsFilter = "(&(objectClass=posixAccount)(uid=%s))";
      listRequiresDot = NO;
      
      // Extended attribute mapping
      MailFieldNames = ("mail", "email");
      photoFieldName = "jpegPhoto";
      
      // Contact attributes
      contactInfoAttribute = "mail";
      phoneAttribute = "telephoneNumber";
      mobileAttribute = "mobile";
      faxAttribute = "facsimileTelephoneNumber";
      
      // Search fields
      searchFields = ("cn", "sn", "givenName", "mail", "uid", "telephoneNumber");
      
      // SOGo 6: Enable photo caching
      enableContactPhotos = YES;
      cachePhotosInSession = YES;
    },
    
    // Fallback: SQL user source
    {
      type = sql;
      id = "sogo_sql";
      viewURL = "postgresql://${SOGO_DATABASE_USER:-sogo}:${SOGO_DATABASE_PASSWORD:-sogo}@${SOGO_DATABASE_HOST:-postgresql.opendesk.svc.cluster.local}:5432/${SOGO_DATABASE_NAME:-sogo}";
      userTable = "sogo_user_profile";
      userIDColumn = "c_uid";
      canAuthenticate = YES;
      isAddressBook = YES;
      displayName = "SOGo Benutzer";
      selectUserQuery = "SELECT c_uid, c_name, c_password, c_email FROM sogo_user_profile WHERE c_uid = '%%'";
      listUsersQuery = "SELECT DISTINCT c_uid, c_name, c_email FROM sogo_user_profile ORDER BY c_name";
      selectAuthenticationQuery = "SELECT c_password FROM sogo_user_profile WHERE c_uid = '%%'";
    }
  );

  /* ================================================================ */
  /* MAIL SERVER CONFIGURATION                                      */
  /* ================================================================ */

  // IMAP Configuration
  SOGoIMAPServer = "${SOGO_IMAP_SERVER:-dovecot.opendesk.svc.cluster.local:993}";
  SOGoIMAPEncryption = YES;
  SOGoIMAPAuthMethod = "${SOGO_IMAP_AUTH:-plain}";
  
  // SMTP Configuration
  SOGoSMTPServer = "${SOGO_SMTP_SERVER:-postfix.opendesk.svc.cluster.local:587}";
  SOGoSMTPEncryption = YES;
  SOGoSMTPAuthMethod = "${SOGO_SMTP_AUTH:-plain}";
  
  // Sieve Configuration (for mail filtering)
  SOGoSieveServer = "${SOGO_SIEVE_SERVER:-dovecot.opendesk.svc.cluster.local:4190}";
  SOGoSievePort = ${SOGO_SIEVE_PORT:-4190};
  SOGoSieveEncryption = YES;
  
  // Mail settings
  SOGoMailCustomFrom = YES;
  SOGoMailFieldName = "mail";
  SOGoMailingMechanism = smtp;
  SOGoMaximumMailLength = 104857600;  // 100 MB
  SOGoMaximumRecipients = 100;

  /* ================================================================ */
  /* MEMCACHED CONFIGURATION                                        */
  /* ================================================================ */

  // SOGo 6 requires memcached for optimal performance
  SOGOMemcachedHost = "${SOGO_MEMCACHED_HOST:-127.0.0.1}";
  SOGOMemcachedPort = ${SOGO_MEMCACHED_PORT:-11211};
  SOGoUseMemcached = YES;
  SOGoMemcachedTimeout = 5;
  
  // SOGo 6: Additional memcached settings
  SOGoMemcachedServers = ("127.0.0.1:11211");
  SOGoMemcachedWeight = 100;

  /* ================================================================ */
  /* PERFORMANCE & WORKER SETTINGS                                  */
  /* ================================================================ */

  // Worker Configuration - SOGo 6 optimized
  WOWorkersCount = ${SOGO_WORKERS_COUNT:-16};
  WOMaxThreadsPerWorker = ${SOGO_MAX_THREADS:-200};
  WOMessageRetryCount = ${SOGO_RETRY_COUNT:-5};
  
  // Improved connection handling for SOGo 6
  WOContextSize = 2048;
  WOWorldsPerProcess = 20;
  
  // SOGo 6 specific optimizations
  SOGoMaximumPingLifetime = ${SOGO_PING_TIMEOUT:-600};
  SOGoMaximumIdleLifetime = ${SOGO_IDLE_TIMEOUT:-3600};  // 1 hour
  SOGoMaximumSyncWindow = ${SOGO_SYNC_WINDOW:-14};       // 2 weeks
  
  // Enhanced database connection management
  SOGoDBReconnectInterval = 30;
  SOGoEnablePreparedStatements = YES;

  /* ================================================================ */
  /* LOGGING CONFIGURATION                                          */
  /* ================================================================ */

  // Log levels (disable debug in production)
  SOGoDebugRequests = ${SOGO_DEBUG_REQUESTS:-NO};
  SOGoDebugSQLQueries = ${SOGO_DEBUG_SQL:-NO};
  SOGoDebugSieveScripts = ${SOGO_DEBUG_SIEVE:-NO};
  SOGoDebugIMAP = ${SOGO_DEBUG_IMAP:-NO};
  SOGoDebugSMTP = ${SOGO_DEBUG_SMTP:-NO};
  
  // SOGo 6: Enhanced logging with JSON format
  SOGoLogFormat = json;
  
  // Log files
  SOGoLogFile = "${SOGO_LOG_FILE:-/var/log/sogo/sogo.log}";
  SOGoIMAPLogFile = "${SOGO_IMAP_LOG_FILE:-/var/log/sogo/imap.log}";
  SOGoSMTPLogFile = "${SOGO_SMTP_LOG_FILE:-/var/log/sogo/smtp.log}";
  SOGoSieveLogFile = "${SOGO_SIEVE_LOG_FILE:-/var/log/sogo/sieve.log}";
  
  // Log level: 0 (errors) to 5 (all)
  SOGoLogLevel = ${SOGO_LOG_LEVEL:-1};
  
  // Syslog configuration
  SOGoUseSyslog = YES;
  SOGoSyslogFacility = "local0";

  /* ================================================================ */
  /* SESSION & COOKIE SETTINGS                                     */
  /* ================================================================ */

  SOGoSessionTimeOut = ${SOGO_SESSION_TIMEOUT:-3600};        // 1 hour
  SOGoMaximumSessionLength = ${SOGO_MAX_SESSION:-86400};     // 24 hours
  SOGoSessionStore = memcached;
  
  // Cookie settings
  SOGoSessionKey = "${SOGO_SESSION_KEY:-SOGo6SessionID}";
  SOGoSecureSessionCookies = YES;
  SOGoHttpSessionCookies = NO;
  SOGoSessionCookieDomain = "${SOGO_COOKIE_DOMAIN:-opendesk-edu.org}";
  SOGoSessionCookiePath = "/";
  
  // SOGo 6: Enhanced session management
  SOGoSessionValidationInterval = 300;  // 5 minutes

  /* ================================================================ */
  /* DEFAULT USER SETTINGS                                         */
  /* ================================================================ */

  SOGoLanguage = "${SOGO_LANGUAGE:-German}";
  SOGoTimeZone = "${SOGO_TIMEZONE:-Europe/Berlin}";
  
  SOGoDefaultCalendar = YES;
  SOGoDefaultAddressBook = YES;
  SOGoEnablePublicAccess = YES;

  /* ================================================================ */
  /* FEATURES & CAPABILITIES - SOGo 6 ENHANCED                       */
  /* ================================================================ */

  // Core features
  SOGoEnableEMailAlarms = YES;
  SOGoEnableEMailVacation = YES;
  SOGoEnablePublicAccess = YES;
  SOGoEnableSubscription = YES;
  SOGoFollowingEnabled = YES;
  
  // Calendar features
  SOGoCalendarCategories = YES;
  SOGoEnableResourceBooking = YES;
  SOGoEnableEMailAlarms = YES;
  
  // SOGo 6: New calendar features
  SOGoEnableCalendarCategories = YES;
  SOGoEnableCalendaricent = YES;
  
  // Mail features
  SOGoMailboxSaveOnClose = YES;
  SOGoDraftsSyncEnabled = YES;
  SOGoSentSyncEnabled = YES;
  SOGoTrashSyncEnabled = YES;
  SOGoJunkSyncEnabled = YES;
  
  // SOGo 6: Enhanced mail features
  SOGoEnableQuickReply = YES;
  SOGoEnableForwardAsAttachment = YES;
  
  // Address book features
  SOGoAddressBookSyncEnabled = YES;
  
  // Contact features
  LDAPContactInfoAttribute = "mail";
  LDAPPhoneAttribute = "telephoneNumber";
  LDAPMobileAttribute = "mobile";
  
  // SOGo 6: Photo management
  SOGoEnableContactPhotos = YES;
  SOGoContactPhotosSize = 200;  // pixels
  
  // Sharing features
  SOGoPermissionsOnPublicFolders = YES;
  SOGoEnableAddressesDelimiterChange = YES;
  
  // SOGo 6: Enhanced sharing
  SOGoEnablePublicAccess = YES;
  SOGoEnableFolderSharing = YES;

  /* ================================================================ */
  /* SECURITY SETTINGS                                             */
  /* ================================================================ */

  // Super users
  SOGoSuperUsernames = ${SOGO_SUPER_USERS:-( "admin" )};
  
  // Password policies
  SOGoPasswordChangeEnabled = YES;
  SOGoMinimumPasswordLength = ${SOGO_MIN_PASSWORD_LENGTH:-12};
  SOGoPasswordAlgorithm = ${SOGO_PASSWORD_ALGO:-ssha512};
  SOGoPasswordExpiresInDays = ${SOGO_PASSWORD_EXPIRE:-180};  // 6 months
  
  // Authentication security
  SOGoMaximumFailedlogin = ${SOGO_MAX_FAILED_LOGIN:-3};
  SOGOFailedLoginBlockTime = ${SOGO_FAILED_LOGIN_BLOCK:-900};  // 15 minutes
  
  // SOGo 6: Enhanced security
  SOGoXSRFValidationEnabled = YES;
  SOGoBasicAuthenticationEnabled = NO;
  SOGoForceStrongPassword = YES;
  
  // Content Security Policy
  SOGoCSPEnable = YES;
  SOGoCSPDefaultSrc = "'self'";
  SOGoCSPScriptSrc = "'self' 'unsafe-inline' cdnjs.cloudflare.com";
  SOGoCSPStyleSrc = "'self' 'unsafe-inline' fonts.googleapis.com";
  SOGoCSPImgSrc = "'self' data: www.gravatar.com";
  SOGoCSPFontSrc = "'self' fonts.gstatic.com";
  
  // SOGo 6: Rate limiting
  SOGoRateLimitLogin = 5;          // Attempts per minute
  SOGoRateLimitAPI = 100;         // Requests per minute

  /* ================================================================ */
  /* PERFORMANCE OPTIMIZATIONS                                     */
  /* ================================================================ */

  // Indexing (SOGo 6 improved indexing)
  SOGoEnableIndexing = YES;
  SOGoIndexingInterval = 60;      // 1 minute
  SOGoIndexingBatchSize = 100;
  
  // Caching (SOGo 6 enhanced)
  SOGoCacheCleanupInterval = 600; // 10 minutes
  SOGoFolderInfoCacheSize = 2000; // Larger cache for SOGo 6
  
  // SOGo 6: Preloading
  SOGoEnablePreloading = YES;
  SOGoPreloadInterval = 300;      // 5 minutes
  
  // Database optimizations
  SOGoUseMultipleDBConnections = YES;
  SOGoEnablePreparedStatements = YES;

  /* ================================================================ */
  /* COMPATIBILITY SETTINGS                                        */
  /* ================================================================ */

  // Microsoft Outlook compatibility
  SOGoAppointmentSendEMailNotifications = YES;
  SOGoEnableEMailAlarms = YES;
  
  // SOGo 6: Enhanced Outlook compatibility
  SOGoEnableOutlookCalendarSync = YES;
  SOGoEnableOutlookContactsSync = YES;
  
  // Apple Calendar/iPhone compatibility
  SOGoEnableCalDAVSharing = YES;
  SOGoEnableCardDAVSharing = YES;
  SOGoEnableCardDAVSharing = YES;
  
  // WebDAV compatibility (SOGo 6 enhanced)
  SOGoEnableWebDAV = YES;
  
  // ActiveSync compatibility (SOGo 6 improved)
  SOGoEnableActiveSync = YES;
  SOGoActiveSyncMaximumAgeFilter = 90;   // 3 months
  SOGoActiveSyncMaxItems = 1000;        // Max items per sync
  
  // Enhanced CalDAV/CardDAV
  SOGoMaxRequestSize = 104857600;  // 100 MB
  SOGoCalDAVMaxObjects = 1000;
  SOGoCardDAVMaxObjects = 5000;

  /* ================================================================ */
  /* EXTERNAL SERVICES                                             */
  /* ================================================================ */

  // Gravatar support
  SOGoGravatarEnabled = YES;
  SOGoGravatarURL = "https://www.gravatar.com/avatar/%@?d=mp";
  
  // OpenPGP/GnuPG support
  SOGoPGPEnabled = YES;
  SOGoPGPServer = "${SOGO_PGP_SERVER:-hkps://keys.openpgp.org}";
  SOGoPGPPublicKeyRing = "/var/lib/sogo/pgp/pubring.kbx";
  SOGoPGPPrivateKeyRing = "/var/lib/sogo/pgp/secring.kbx";
  
  // S/MIME support
  SOGoSMIMEEnabled = YES;
  SOGoSMIMESignAlgorithm = "sha512";
  SOGoSMIMEEncryptAlgorithm = "aes256";

  /* ================================================================ */
  /* WEB INTERFACE SETTINGS                                        */
  /* ================================================================ */

  SOGoPageTitle = "${SOGO_PAGE_TITLE:-openDesk Edu - SOGo 6}";
  SOGoLoginPageTitle = "${SOGO_LOGIN_TITLE:-Willkommen bei openDesk Edu}";
  SOGoHelpURL = "${SOGO_HELP_URL:-https://opendesk-edu.org/docs/sogo6}";
  
  // SOGo 6: Enhanced UI
  SOGoEnableNewUI = YES;
  SOGoTheme = "opendesk";
  
  // Custom CSS (if available)
  // SOGoCustomCSS = "/var/lib/sogo/custom.css";

  /* ================================================================ */
  /* REST API & MOBILE APP                                         */
  /* ================================================================ */

  // SOGo 6: RESTful API
  SOGoEnableRESTAPI = YES;
  SOGoRESTAPIBaseURL = "/SOGo/Rest";
  
  // Mobile app settings
  SOGoEnableMobileApp = YES;
  SOGoMobileAppConfigURL = "https://opendesk-edu.org/sogo-mobile-config.json";

  /* ================================================================ */
  /* ADVANCED SETTINGS                                             */
  /* ================================================================ */

  // Enable S/MIME encryption
  SOGoSMIMEEnabled = YES;
  
  // Quota settings
  // Uncomment to enable mailbox quotas
  // SOGoMailQuota = 1073741824;  // 1GB
  // SOGoMailboxQuota = YES;

  // System permissions
  SOGoSystemPermissions = 
  {
    Public = 
    {
      Calendar = ("AllRead", "AllOverwrite");
      AddressBook = ("AllRead", "AllWrite");
    };
  };

  /* ================================================================ */
  /* SOGo 6 SPECIFIC SETTINGS                                       */
  /* ================================================================ */

  // Enhanced session management
  SOGoSessionIPValidation = YES;
  SOGoSessionUserAgentValidation = NO;
  
  // Enhanced caching
  SOGoEnableFolderCache = YES;
  SOGoFolderCacheTTL = 300;  // 5 minutes
  
  // Enhanced search
  SOGoEnableFullTextSearch = YES;
  SOGoFullTextSearchEngine = "postgresql";
  
  // Enhanced security
  SOGoEnableLoginIPRestriction = NO;
  SOGoLoginIPRange = "192.168.0.0/16";
  
  // Enhanced performance
  SOGoEnableCompression = YES;
  SOGoCompressionLevel = 6;

  /* ==============================================================================
  // END OF CONFIGURATION
  // ============================================================================== */
}
