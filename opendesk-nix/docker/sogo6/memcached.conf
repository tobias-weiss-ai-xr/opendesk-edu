# Memcached Configuration for SOGo 6 (Nightly/Stable)
# Target: /etc/memcached.conf in container
# SPDX-License-Identifier: Apache-2.0
# Maintainer: openDesk Edu Team <team@opendesk-edu.org>
#
# ==============================================================================
# OPTIMIZED FOR SOGo 6 WITH ~2000 ACTIVE USERS
#
# Memory allocation: 512MB (adjust based on available RAM)
# Threads: 8 (auto-detected from CPU cores)
# Modern mode enabled
# Multi-thread support for SOGo 6
# ==============================================================================
# DIFFERENCES FROM SOGo 5:
# - Modern mode ONLY (required for SOGo 6)
# - Larger memory allocation (512MB default)
# - More threads (8 default)
# - Improved garbage collection
# - Better connection handling
# ==============================================================================

# ==============================================================================
# SERVER CONFIGURATION
# ==============================================================================

# Listen port
-p 11211

# Bind to localhost (Docker container - SOGo connects via localhost)
-l 127.0.0.1

# Also bind to IPv6 localhost
-l ::1

# ==============================================================================
# MEMORY MANAGEMENT
# ==============================================================================

# Memory in MB - 512MB for ~2000 users
# SOGo 6 is more memory-efficient than SOGo 5
# Adjust based on:
# - 256MB: ~1000 users (light usage)
# - 512MB: ~2000 users (default)
# - 1024MB: ~5000 users
# - 2048MB: ~10000 users
-m 512

# Growth factor: Don't grow beyond initial allocation
# 1.05 = allow 5% growth
-f 1.05

# Out-of-memory behavior: Return error (recommended)
# - M: Return SEOMM error
# - C: Return old value (not recommended for SOGo)
-M

# ==============================================================================
# CONNECTION SETTINGS
# ==============================================================================

# Maximum connections
# SOGo 6 uses persistent connections more efficiently
-c 2048

# Minimum connections to keep open
-n 64

# Backlog queue size
-b 4096

# Maximum requests per event loop iteration
# Prevents starvation of other connections
-R 50

# ==============================================================================
# PERFORMANCE & THREADING
# ==============================================================================

# Thread count - MUST be >= number of CPU cores
# SOGo 6 benefits from more threads
# Auto-detected in entrypoint.sh based on /proc/cpuinfo
-t 8

# Modern mode: REQUIRED for SOGo 6
# Provides improved hash algorithm, better cache management
# and reduced memory fragmentation
-moden

# Disable CAS (Compare-And-Store)
# SOGo doesn't use CAS, saves memory and CPU
-D proxy

# Disable DNS lookups (ip addresses only, faster)
d
# Disable eviction notifications
## -E /tmp/memcached.err

# ==============================================================================
# SECURITY SETTINGS
# ==============================================================================

# Run as non-root user
# In Docker container: user sogo:998 (UID 998)
# Matches the SOGo user in the container
-u sogo

# PID file location
-P /var/run/sogo/memcached.pid

# ==============================================================================
# PROTOCOL & NETWORK
# ==============================================================================

# Protocol: auto-negotiate (binary or text)
# SOGo uses binary protocol
-B both

# ==============================================================================
# LOGGING
# ==============================================================================

# Verbosity level:
# none = errors only
# -v = basic logging
# -vv = verbose (useful for debugging)
# Production: use -v
-v

# ==============================================================================
# ITEM SIZE LIMITS
# ==============================================================================

# Maximum item size
# SOGo 6 can have larger cache entries (query results, etc.)
-I 4m

# Chunk size (default is fine)
#-C 48

# ==============================================================================
# SLAB CONFIGURATION (Auto)
# ==============================================================================
# SOGo 6 benefits from automatic slab management
# Uncomment to customize for specific workloads

# For general SOGo usage (sessions + cache entries):
#-n 64
#-n 128
#-n 256
#-n 512
#-n 1024
#-n 2048
#-n 4096
#-n 8192
#-n 16384
#-n 32768

# ==============================================================================
# ADVANCED SETTINGS
# ==============================================================================

# Lock memory pages (prevent swapping)
# Requires CAP_IPC_LOCK capability
# Enable only if memcached runs with appropriate privileges
#-k

# Fail fast on out-of-memory
# Immediately fail allocations when out of memory
# (default behavior in modern mode)

# ==============================================================================
# DATA PERSISTENCE
# ==============================================================================
# Memcached is IN-MEMORY ONLY
# Data is lost on restart - this is intentional for caching
# For persistent data, use Redis or the database

# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
