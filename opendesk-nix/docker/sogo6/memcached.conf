# Memcached Configuration for SOGo 6
# Optimized for SOGo 6 with improved caching performance
# Managed by: opendesk-nix/docker/sogo6/Dockerfile
# SPDX-License-Identifier: Apache-2.0

# ============================================
# SERVER CONFIGURATION
# ============================================

# Port to listen on
-p 11211

# Listen on specific IP (only localhost for security)
-l 127.0.0.1

# ============================================
# MEMORY CONFIGURATION
# ============================================

# Memory allocation (512 MB for SOGo 6)
# SOGo 6 benefits from more memcached memory
-m 512

# ============================================
# CONNECTION CONFIGURATION
# ============================================

# Maximum simultaneous connections
# Increased for SOGo 6 which may have more concurrent sessions
-c 2048

# Minimum connections to keep open
-n 32

# Number of threads to handle connections
# SOGo 6 can utilize more threads effectively
-t 8

# Backlog queue size (number of pending connections)
-b 2048

# ============================================
# USER & PRIVILEGES
# ============================================

# Run as specific user for security
-u sogo

# ============================================
# PERFORMANCE OPTIMIZATIONS
# ============================================

# Disable growth factor (prevents memory fragmentation)
-f 1.05

# Maximum requests per event loop iteration
# Helps with connection balancing
-r 100

# Disable CAS (Compare-And-Swap) - not needed for SOGo
-D proxy

# Disable DNS lookups (only use IP addresses)
-d

# ============================================
# PERSISTENCE & LOGGING
# ============================================

# Write pid file
-P /var/run/memcached.pid

# Lock memory pages to prevent swapping
# SOGo 6 performs better with locked memory
-k

# Modern mode for better performance (SOGo 6)
-moden

# Verbose mode (disabled in production for performance)
## -v

# Verbose mode - more details (disabled in production)
## -vv

# Error log (commented out - use Kubernetes logging instead)
## -E /var/log/memcached.log

# ============================================
# NETWORK & BUFFERING
# ============================================

# Enable large memory pages (if available)
## -L

# Maximum item size (default: 1MB, SOGo 6 typically doesn't need larger)
## -I 16m

# ============================================
# SECURITY SETTINGS
# ============================================

# Note: Memcached itself has no authentication
# Security is provided by:
# 1. Binding to localhost only (-l 127.0.0.1)
# 2. Running as non-root user (-u sogo)
# 3. Kubernetes network policies
# 4. Pod security contexts

# For additional security in production:
# - Use Kubernetes NetworkPolicy to restrict access
# - Consider using a service mesh with mTLS
# - Monitor memcached connections
