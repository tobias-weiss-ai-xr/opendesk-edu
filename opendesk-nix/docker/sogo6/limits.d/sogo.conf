# Ulimit Configuration for SOGo 6
# Target: /etc/security/limits.d/sogo.conf in container
# SPDX-License-Identifier: Apache-2.0
# Maintainer: openDesk Edu Team <team@opendesk-edu.org>
#
# ==============================================================================
# SOGo 6 has increased performance requirements:
# - More concurrent connections
# - Larger memory footprint
# - More worker threads
#
# Limits are optimized for containers with 2-8GB RAM.
# Adjust based on your deployment size.
#
# ==============================================================================

# SOGo user (default: sogo, UID 998) - different from SOGo 5
sogo soft nofile 65536
sogo hard nofile 131072

# Number of processes (SOGo 6 uses more workers)
sogo soft nproc 10240
sogo hard nproc 20480

# Memory locking
sogo soft memlock unlimited
sogo hard memlock unlimited

# Address space
sogo soft as unlimited
sogo hard as unlimited

# File size (for large attachments and database)
sogo soft fsize unlimited
sogo hard fsize unlimited

# Signal handling (SOGo 6 has more complex signal handling)
sogo soft sigpending 10240
sogo hard sigpending 20480

# Message queues (for inter-process communication)
sogo soft msgqueue 1638400
sogo hard msgqueue 3276800

# CPU time
sogo soft cpu unlimited
sogo hard cpu unlimited

# Nice priority
sogo soft nice 0
sogo hard nice 20

# Real-time priority (not typically used)
sogo soft rtprio 0
sogo hard rtprio 100

# Locked pages limit
sogo soft lockedpages unlimited
sogo hard lockedpages unlimited

# Root user
root soft nofile 131072
root hard nofile 262144

root soft nproc 20480
root hard nproc 40960

root soft memlock unlimited
root hard memlock unlimited

# Note: SOGo 6 also requires:
# - /proc/sys/fs/file-max >= 2097152 (system-wide, not per-process)
# - /proc/sys/kernel/threads-max >= 40960 (system-wide)
# - /proc/sys/kernel/pid_max >= 40960 (system-wide)
# These are typically set on the Kubernetes node.
