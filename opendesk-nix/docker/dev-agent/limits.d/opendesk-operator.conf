# Ulimit Configuration for openDesk Dev Agent Operator
# Target: /etc/security/limits.d/opendesk-operator.conf in container
# SPDX-License-Identifier: Apache-2.0
# Maintainer: openDesk Edu Team <team@opendesk-edu.org>
#
# ==============================================================================
# These limits are applied when the container starts via entrypoint.sh
# They control system resource usage for the operator process.
#
# Usage in Docker:
#   - Added as a ConfigMap or directly in the container
#   - Applied via ulimit -S (soft) and ulimit -H (hard) in entrypoint.sh
#   - Or via security limits in Kubernetes
#
# ==============================================================================
#
# RECOMMENDED LIMITS FOR PRODUCTION:
# - nofile: 65536 (Maximum open files - handles many Kubernetes objects)
# - nproc: 10240 (Maximum processes)
# - memlock: unlimited (Allow memory locking for performance)
# - as: unlimited (Address space - for large deployments)
# - fsize: unlimited (File size)
# - sigpending: 10240 (Signal queue)
# - msgqueue: 819200 (Message queue bytes)
#
# ==============================================================================

# Soft and hard limits for user 'opendesk' (UID 1000)
# Format: <domain> <type> <item> <value>
# - domain: user or group name, or * for all
# - type: soft (current limit) or hard (maximum limit)
# - item: limit type (see below)
# - value: limit value

# Operator process (user opendesk)
opendesk soft nofile 65536
opendesk hard nofile 131072

opendesk soft nproc 10240
opendesk hard nproc 20480

opendesk soft memlock unlimited
opendesk hard memlock unlimited

opendesk soft as unlimited
opendesk hard as unlimited

opendesk soft fsize unlimited
opendesk hard fsize unlimited

opendesk soft sigpending 10240
opendesk hard sigpending 20480

opendesk soft msgqueue 819200
opendesk hard msgqueue 1638400

opendesk soft cpu unlimited
opendesk hard cpu unlimited

opendesk soft rtprio unlimited
opendesk hard rtprio unlimited

opendesk soft nice 0
opendesk hard nice 40

# Root user limits (for healthcheck scripts that may need elevated privileges)
root soft nofile 65536
root hard nofile 131072

root soft nproc 10240
root hard nproc 20480

root soft memlock unlimited
root hard memlock unlimited

# ==============================================================================
# LIMIT TYPE EXPLANATIONS
# ==============================================================================
#
# nofile    - Maximum number of open files
# nproc     - Maximum number of processes
# memlock   - Maximum locked-in-memory address space (KB)
# as        - Address space limit (KB)
# fsize     - Maximum file size (KB)
# sigpending- Maximum number of pending signals
# msgqueue  - Maximum bytes in POSIX message queues
# cpu       - Maximum CPU time (MINUTES)
# rtprio    - Maximum real-time priority
# nice      - Maximum nice priority adjustment
#
# ==============================================================================

# End of file
