# Logrotate Configuration for openDesk Dev Agent Operator
# Target: /etc/logrotate.d/opendesk-dev-agent
# SPDX-License-Identifier: Apache-2.0
# Maintainer: openDesk Edu Team <team@opendesk-edu.org>
#
# ==============================================================================
# USAGE:
# This file is copied to /etc/logrotate.d/ in the container.
# Logrotate is run daily via cron or manually.
#
# In the Docker container, this is triggered by:
#   1. Daily via entrypoint.sh (if cron is disabled)
#   2. Or via a sidecar container running cron
#
# To manually trigger: logrotate -f /etc/logrotate.d/opendesk-dev-agent
# ==============================================================================

global:
    # Number of days to keep old log files
    rotate 30
    
    # Compress old log files (requires gzip in container)
    compress
    
    # Use date extension (log.2026-08-03.gz instead of log.1)
    dateext
    
    # Don't rotate if file is empty
    notifempty
    
    # Create new log file with same permissions
    create
    
    # Log rotation is run by root (UID 0) in container
    su root root
    
    # Maximum log file size before rotation (100MB)
    size 100M
    
    # Missing OK - don't error if log file doesn't exist
    missingok
    
    # How many rotated files to keep
    maxage 90
    
    # Write state to this file
    state /var/lib/logrotate/opendesk-dev-agent.state
    
    # Don't log errors - be silent
    noerror

# ==============================================================================
# OPERATOR MAIN LOG
# ==============================================================================
/var/log/opendesk/operator.log {
    # Rotate daily
    daily
    
    # Keep 30 days of logs
    rotate 30
    
    # Compress after rotation
    compress
    
    # Delay compression (wait for next rotation)
    delaycompress
    
    # Don't rotate if empty
    notifempty
    
    # Copy and truncate (don't move) - allows app to keep writing
    copytruncate
    
    # Max size: 100MB
    size 100M
    
    # Create new file with same permissions (0640)
    create 0640 opendesk opendesk
    
    # Include date in rotated filename
    dateext
    
    # Max age: 90 days
    maxage 90
    
    # Shared scripts (use one script for multiple log files)
    sharedscripts
    
    # Post-rotation script
    postrotate
        # Reload operator to use new log file
        kill -SIGHUP $(cat /var/run/opendesk/operator.pid 2>/dev/null) 2>/dev/null || true
        
        # Notify health check that rotation occurred
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Log rotated" >> /var/log/opendesk/logrotate.log
    endscript
}

# ==============================================================================
# OPERATOR HEALTH CHECK LOG
# ==============================================================================
/var/log/opendesk/health.log {
    daily
    rotate 14
    compress
    delaycompress
    notifempty
    copytruncate
    size 50M
    create 0640 opendesk opendesk
    dateext
    maxage 30
    sharedscripts
}

# ==============================================================================
# OPERATOR REPAIR LOG
# ==============================================================================
/var/log/opendesk/repair.log {
    daily
    rotate 30
    compress
    delaycompress
    notifempty
    copytruncate
    size 100M
    create 0640 opendesk opendesk
    dateext
    maxage 90
    sharedscripts
    
    Postrotate
        # Log repair statistics after rotation
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Repair log rotated" >> /var/log/opendesk/logrotate.log
    endscript
}

# ==============================================================================
# OPERATOR METRICS LOG
# ==============================================================================
/var/log/opendesk/metrics.log {
    daily
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    size 10M
    create 0640 opendesk opendesk
    dateext
    maxage 14
}

# ==============================================================================
# KUBERNETES EVENTS LOG
# ==============================================================================
/var/log/opendesk/k8s-events.log {
    daily
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    size 50M
    create 0640 opendesk opendesk
    dateext
    maxage 14
}

# ==============================================================================
# DEBUG LOGS (Rotated aggressively)
# ==============================================================================
/var/log/opendesk/debug.log {
    hourly
    rotate 24
    compress
    delaycompress
    notifempty
    copytruncate
    size 10M
    create 0640 opendesk opendesk
    dateext
    maxage 1
    sharedscripts
}

# ==============================================================================
# PANAMIC LOGS (Never rotated, but size-limited)
# ==============================================================================
/var/log/opendesk/panic-*.log {
    # Don't rotate panic logs automatically
    # These are critical for debugging crashes
    rotate 0
    notifempty
    create 0640 opendesk opendesk
    size 10M
    sharedscripts
    
    postrotate
        # Warn if panic log is being rotated
        echo "WARNING: Panic log rotated at $(date)" >> /var/log/opendesk/logrotate.log
    endscript
}

# ==============================================================================
# LOGROTATE STATE
# ==============================================================================
/var/lib/logrotate/opendesk-dev-agent.state {
    # State file - don't rotate
    rotate 0
    notifempty
    create 0640 opendesk opendesk
}

# ==============================================================================
# LOGROTATE OWN LOG
# ==============================================================================
/var/log/opendesk/logrotate.log {
    weekly
    rotate 4
    compress
    delaycompress
    notifempty
    copytruncate
    size 1M
    create 0640 opendesk opendesk
    dateext
    maxage 30
}

# ==============================================================================
# SYSTEM LOGS (if collected)
# ==============================================================================
/var/log/opendesk/system.log {
    daily
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    size 50M
    create 0644 opendesk opendesk
    dateext
    maxage 14
}

# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
