# Ulimit Configuration for SOGo 5
# Target: /etc/security/limits.d/sogo.conf in container
# SPDX-License-Identifier: Apache-2.0
# Maintainer: openDesk Edu Team <team@opendesk-edu.org>
#
# ==============================================================================
# SOGo 5 is a multi-process application:
# - Main SOGo process (GNUstep WebObjects)
# - Multiple Worker processes
# - Memcached process
#
# Each process needs sufficient limits for handling connections.
#
# ==============================================================================

# SOGo user (default: sogo, UID 999)
sogo soft nofile 32768
sogo hard nofile 65536

# Number of processes (workers + main process)
sogo soft nproc 5120
sogo hard nproc 10240

# Memory locking (for performance)
sogo soft memlock unlimited
sogo hard memlock unlimited

# Address space (important for large databases)
sogo soft as unlimited
sogo hard as unlimited

# File size (for large mail attachments)
sogo soft fsize unlimited
sogo hard fsize unlimited

# Signal handling
sogo soft sigpending 5120
sogo hard sigpending 10240

# Message queues
sogo soft msgqueue 819200
sogo hard msgqueue 1638400

# CPU time (unlimited for long-running processes)
sogo soft cpu unlimited
sogo hard cpu unlimited

# Nice priority
sogo soft nice 0
sogo hard nice 20

# Root user (for init and healthcheck)
root soft nofile 65536
root hard nofile 131072

root soft nproc 10240
root hard nproc 20480

root soft memlock unlimited
root hard memlock unlimited

# Memcached user (if separate, UID 998)
memcache soft nofile 16384
memcache hard nofile 32768

memcache soft nproc 256
memcache hard nproc 512

memcache soft memlock unlimited
memcache hard memlock unlimited
