# Memcached Configuration for SOGo 5
# Managed by: opendesk-nix/docker/sogo5/Dockerfile
# SPDX-License-Identifier: Apache-2.0

# Server settings
-p 11211
-l 127.0.0.1

# Memory settings (256 MB)
-m 256

# Maximum connections
-c 1024

# Connection settings
-n 16      # Minimum connections
-b 1024    # Backlog queue size

# User to run as
-u sogo

# Thread count (auto-detected by default)
-t 4

# Verbose logging
-v

# Disable growth
-f 1.05

# Flush threshold
-M

# Disable CAS (not needed for SOGo)
-D proxy

# Disable DNS lookups
-d

# Pid file
-P /var/run/memcached.pid

# Lock memory pages
-k

# Disable eviction notifications
## -E /tmp/memcached.err

# Modern mode for better performance
-moden
