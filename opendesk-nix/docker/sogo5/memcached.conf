# Memcached Configuration for SOGo 5 (OpenGroupware SOGo)
# Target: /etc/memcached.conf in container
# SPDX-License-Identifier: Apache-2.0
# Maintainer: openDesk Edu Team <team@opendesk-edu.org>
#
# ==============================================================================
# OPTIMIZED FOR SOGo 5 WITH ~1000 ACTIVE USERS
#
# Memory allocation: 256MB (adjust based on available RAM)
# Threads: 4 (auto-detected from CPU cores)
# Connections: 1024 max, 16 min
# 
# Usage in Docker:
#   COPY memcached.conf /etc/memcached.conf
#   CMD ["memcached", "-u", "sogo", "-c", "1024", "-m", "256"]
#
# ==============================================================================

# ==============================================================================
# SERVERSETTINGS
# ==============================================================================

# Listen port (default: 11211)
-p 11211

# Listen IP address (bind to localhost for security)
# In Docker, only SOGo needs to access memcached
-l 127.0.0.1

# Also listen on IPv6 localhost (best practice)
-l ::1

# ==============================================================================
# MEMORY MANAGEMENT
# ==============================================================================

# Maximum memory in MB (256MB for ~1000 users)
# Formula: ~250KB per active Session x expected concurrent users
# Adjust based on your user base:
# - 512MB for 2000 users
# - 1GB for 5000 users
# - 2GB for 10000 users
-m 256

# Disable growth (don't allow memcached to grow beyond -m)
# This prevents OOM kills
-f 1.05

# Memory eviction behavior:
# - M: Return error on out-of-memory (default)
# - C: Return old value on out-of-memory (not recommended)
-M

# ==============================================================================
# CONNECTION SETTINGS
# ==============================================================================

# Maximum simultaneous connections
# SOGo typically uses 1-2 connections per request
# 1024 is sufficient for most deployments
-c 1024

# Minimum connections to keep open (-n)
# Prevents connection churn
-n 32

# Backlog queue size (pendings connections)
# Should be at least equal to max connections
-b 2048

# Maximum requests per event loop iteration
# Prevents one request from starving others
-R 20

# ==============================================================================
# PERFORMANCE TUNING
# ==============================================================================

# Thread count: Match CPU cores in container
# Default: 4 (overridden by Docker CMD if needed)
# AUTO-DETECTED from /proc/cpuinfo in entrypoint.sh
-t 4

# Disable DNS lookups (faster, but IP-based connections only)
# SOGo connects from localhost, so this is safe
d

# Disable CAS (Compare-And-Store)
# SOGo doesn't use CAS, saving memory and CPU
-D proxy

# Modern mode: Enhanced hash algorithm and other improvements
# Available since memcached 1.6.0+ (we use latest)
-moden

# Lock memory pages to prevent swapping (requires mlockall)
# Only enable if memcached has CAP_IPC_LOCK capability
# Uncomment if running as root or with elevated privileges
#-k

# ==============================================================================
# SECURITY SETTINGS
# ==============================================================================

# Run as user ( must exist in container)
# In our Dockerfile: user sogo:999 (UID 999)
-u sogo

# Pid file location
-P /var/run/sogo/memcached.pid

# ==============================================================================
# LOGGING & DEBUGGING
# ==============================================================================

# Verbosity level:
# - None: No logging unless errors occur
# - -v: Basic logging
# - -vv: Verbose logging (useful for debugging)
# Production: Use -v for minimal logging
-v

# Disable error logging to file (use syslog instead)
## -E /var/log/memcached.err

# ==============================================================================
# EXTENDED OPTIONS
# ==============================================================================

# Item size max (default: 1MB, SOGo needs up to 2MB for large queries)
-I 2m

# Failover settings (disabled - SOGo connects directly)
# -L: Try to use large memory pages (not needed in container)
# -A: Disable all storage (not applicable)

# Slab automation:
# - Further automates memory management
# Recommended for production
-s /home/sogo/memcached.sock

# ==============================================================================
# SLAB CONFIGURATION (Advanced)
# ==============================================================================
# Uncomment to customize slab sizes (default is fine for SOGo)
# SOGo mainly stores session data and cache entries:
# - Session data: ~1-2KB
# - Cache entries: ~100-500 bytes
# - Query results: ~1-10KB
#
# -n 64    # Minimum item size
# -n 128
# -n 256
# -n 512
# -n 1024
# -n 2048
# -n 4096
# -n 8192
# -n 16384
# -n 32768

# ==============================================================================
# DATA PERSISTENCE (Disabled)
# ==============================================================================
# Memcached is IN-MEMORY ONLY - data is lost on restart
# This is intentional for SOGo cache, not persistent data
#
# For persistent data, use:
# - Redis (is what SOGo recommends)
# - Database
#
# Never enable persistence for memcached inSOGo deployments
# as it defeats the purpose of fast, temporary caching

# ==============================================================================
# NETWORK & TIMEOUT SETTINGS
# ==============================================================================

# Connection timeout in seconds (default: unbounded)
# -r: Reconnect to server on connection loss
# -t: Timeout for socket I/O operations (not applicable to daemon mode)

# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
