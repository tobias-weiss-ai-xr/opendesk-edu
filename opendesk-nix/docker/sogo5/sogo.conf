// SOGo 5 Configuration for openDesk
// Managed by: opendesk-nix/docker/sogo5/Dockerfile
// Environment variables can override these settings
// SPDX-License-Identifier: Apache-2.0

{
  /* ================================================================ */
  /* DATABASE CONFIGURATION                                        */
  /* ================================================================ */
  
  // Default PostgreSQL configuration
  // Can be overridden by SOGO_PROFILE_URL environment variable
  SOGoProfileURL = "postgresql://sogo:sogo@postgresql.opendesk.svc:5432/sogo";
  OCSFolderInfoURL = "postgresql://sogo:sogo@postgresql.opendesk.svc:5432/sogo";
  OCSSessionsFolderURL = "postgresql://sogo:sogo@postgresql.opendesk.svc:5432/sogo";
  
  /* ================================================================ */
  /* EMAIL DOMAINS                                                 */
  /* ================================================================ */
  OCSEMailDomains = ("opendesk.org");
  
  /* ================================================================ */
  /* AUTHENTICATION & USER SOURCES                                 */
  /* ================================================================ */
  
  // Default LDAP configuration
  // Can be completely overridden by SOGO_USER_SOURCES environment variable
  SOGoUserSources = (
    {
      type = ldap;
      // Use Kubernetes service DNS for LDAP
      host = "ldap://ldap.opendesk.svc:389";
      baseDN = "dc=opendesk,dc=org";
      bindDN = "cn=admin,dc=opendesk,dc=org";
      
      // Password will be read from:
      // 1. SOGO_LDAP_BIND_PASSWORD environment variable, OR
      // 2. /etc/sogo/ldap-password file
      bindPassword = "${SOGO_LDAP_BIND_PASSWORD}";
      
      idFieldName = uid;
      UIDFieldName = uid;
      CNFieldName = cn;
      UIDFieldNames = ("uid", "sAMAccountName");
      base = "ou=users";
      scope = SUB;
      isAddressBook = YES;
      displayName = "OpenDesk LDAP";
      canAuthenticate = YES;
      
      // Additional LDAP settings
      timeout = 10;  // seconds
      maxRetryCount = 3;
      connectionUseTLS = YES;
      
      // Group handling
      groupBaseDN = "ou=groups,dc=opendesk,dc=org";
      groupFieldName = "cn";
      groupFilter = "(objectClass=posixGroup)";
      
      // User handling
      userFilter = "(objectClass=posixAccount)";
      userGroupsFilter = "(&(objectClass=posixAccount)(uid=%s))"
    }
  );
  
  /* ================================================================ */
  /* MAIL SERVER CONFIGURATION                                      */
  /* ================================================================ */
  
  // Can be overridden by SOGO_IMAP_SERVER and SOGO_SMTP_SERVER
  SOGoIMAPServer = "imap.opendesk.svc";
  SOGoSMTPServer = "smtp.opendesk.svc";
  SOGoSieveServer = "sieve.opendesk.svc";
  
  // IMAP/SMTP Authentication
  SOGoIMAPAuthMethod = "plain";
  SOGoSMTPAuthMethod = "plain";
  
  // Mail settings
  SOGoMailCustomFrom = YES;
  SOGoMailFieldName = "mail";
  
  /* ================================================================ */
  /* MEMCACHED CONFIGURATION                                        */
  /* ================================================================ */
  
  // Can be overridden by SOGO_MEMCACHED_HOST
  SOGOMemcachedHost = "memcached.opendesk.svc";
  
  /* ================================================================ */
  /* PERFORMANCE SETTINGS                                          */
  /* ================================================================ */
  
  // Message size limits
  SOGoMaximumMessageSize = 100;  // 100 MB
  SOGoMaximumAttachmentsSize = 50;  // 50 MB per attachment
  
  // Worker configuration
  WOWorkersCount = 10;
  WOMaxThreadsPerWorker = 100;
  WOMessageRetryCount = 3;
  
  // SOGo specific performance
  SOGoMaximumPingLifetime = 600;  // 10 minutes
  SOGoMaximumIdleLifetime = 1800;  // 30 minutes
  SOGoMaximumSyncWindow = 7;  // days
  
  // Database connection pooling
  SOGoMaximumDBConnections = 20;
  SOGoDBConnectionPoolSize = 5;
  
  /* ================================================================ */
  /* LOGGING CONFIGURATION                                          */
  /* ================================================================ */
  
  // Logging levels
  SOGoDebugRequests = NO;
  SOGoDebugSQLQueries = NO;
  SOGoDebugSieveScripts = NO;
  
  // Log files
  SOGoLogFile = "/var/log/sogo/sogo.log";
  SOGoIMAPLogFile = "/var/log/sogo/imap.log";
  SOGoSMTPLogFile = "/var/log/sogo/smtp.log";
  
  // Log rotation will be handled by logrotate
  
  /* ================================================================ */
  /* DEFAULT SETTINGS                                              */
  /* ================================================================ */
  
  // Default calendar and address book
  SOGoDefaultCalendar = YES;
  SOGoDefaultAddressBook = YES;
  
  // Language and timezone
  SOGoLanguage = "German";
  SOGoTimeZone = "Europe/Berlin";
  
  // Features
  SOGoEnablePublicAccess = YES;
  SOGoXSRFValidationEnabled = YES;
  
  // Folder subscriptions
  SOGoFollowingEnabled = YES;
  SOGoSubscriptionEnabled = YES;
  
  /* ================================================================ */
  /* SESSION SETTINGS                                              */
  /* ================================================================ */
  
  // Session lifetime
  SOGoSessionTimeOut = 1800;  // 30 minutes in seconds
  SOGoMaximumSessionLength = 86400;  // 24 hours
  
  /* ================================================================ */
  /* CACHING SETTINGS                                              */
  /* ================================================================ */
  
  // Folder cache
  SOGoCacheCleanupInterval = 300;  // 5 minutes
  
  /* ================================================================ */
  /* ADDRESS BOOK & CONTACTS                                       */
  /* ================================================================ */
  
  // LDAP address book for contacts
  LDAPContactInfoAttribute = "mail";
  LDAPPhoneAttribute = "telephoneNumber";
  LDAPMobileAttribute = "mobile";
  
  /* ================================================================ */
  /* SECURITY SETTINGS                                             */
  /* ================================================================ */
  
  // Authentication
  SOGoSuperUsernames = ("admin");
  
  // Password policies
  SOGoPasswordChangeEnabled = YES;
  SOGoMinimumPasswordLength = 8;
  SOGoPasswordAlgorithm = "ssha512";
  
  // SSL/TLS settings
  // Note: SSL is handled at the ingress level in Kubernetes
  
  /* ================================================================ */
  /* PERFORMANCE OPTIMIZATIONS                                     */
  /* ================================================================ */
  
  // Database query optimization
  SOGoUseMultipleDBConnections = YES;
  
  // Indexing
  SOGoEnableIndexing = YES;
  
  /* ================================================================ */
  /* COMPATIBILITY SETTINGS                                        */
  /* ================================================================ */
  
  // Compatibility with various mail clients
  SOGoEnableEMailAlarms = YES;
  SOGoMailingMechanism = smtp;
  
  // For compatibility with Outlook
  SOGoAppointmentSendEMailNotifications = YES;
  
  /* ================================================================ */
  /* EXTERNAL SERVICES                                             */
  /* ================================================================ */
  
  // Gravatar support
  SOGoGravatarEnabled = YES;
}
