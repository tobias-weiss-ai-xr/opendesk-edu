// SOGo 5 Configuration for openDesk Edu
// Target: /etc/sogo/sogo.conf in container
// SPDX-License-Identifier: Apache-2.0
// Maintainer: openDesk Edu Team <team@opendesk-edu.org>
//
// ==============================================================================
// ENVIRONMENT VARIABLE OVERRIDES (Processed by entrypoint.sh)
// ==============================================================================
// The following environment variables can override these settings:
//
// Database:
//   SOGO_PROFILE_URL, SOGO_OCS_FOLDER_INFO_URL, SOGO_OCS_SESSIONS_FOLDER_URL
//   SOGO_DATABASE_HOST, SOGO_DATABASE_PORT, SOGO_DATABASE_NAME
//   SOGO_DATABASE_USER, SOGO_DATABASE_PASSWORD
//
// LDAP:
//   SOGO_LDAP_HOST, SOGO_LDAP_PORT, SOGO_LDAP_BASE_DN
//   SOGO_LDAP_BIND_DN, SOGO_LDAP_BIND_PASSWORD
//   SOGO_LDAP_ID_FIELD, SOGO_LDAP_UID_FIELD, SOGO_LDAP_CN_FIELD
//
// User Sources:
//   SOGO_USER_SOURCES (JSON array - fully replaces userSources section)
//
// Performance:
//   SOGO_WORKERS_COUNT, SOGO_MAX_THREADS
//   SOGO_MAX_DB_CONNECTIONS, SOGO_DB_POOL_SIZE
//
// Mail:
//   SOGO_IMAP_SERVER, SOGO_SMTP_SERVER, SOGO_SIEVE_SERVER
//   SOGO_IMAP_AUTH, SOGO_SMTP_AUTH
//
// Memcached:
//   SOGO_MEMCACHED_HOST, SOGO_MEMCACHED_PORT
//
// General:
//   SOGO_TIMEZONE, SOGO_LANGUAGE
//   SOGO_MAIL_DOMAINS (comma-separated)
//
// ==============================================================================

{
  /* ================================================================ */
  /* PRODUCT INFORMATION                                           */
  /* ================================================================ */

  // Product name (internal)
  productName = "openDesk Edu - SOGo 5";

  /* ================================================================ */
  /* DATABASE CONFIGURATION                                        */
  /* ================================================================ */
  
  // PostgreSQL Configuration (Primary)
  // These are the DEFAULT values. They can be overridden via environment
  // variables. In containerized deployments, use:
  //   SOGO_PROFILE_URL="postgresql://${DB_USER}:${DB_PASS}@postgresql:5432/sogo"
  //
  // Note: In Kubernetes, use the service DNS name:
  //   postgres.opendesk.svc.cluster.local
  //   mariadb.opendesk.svc.cluster.local
  
  SOGoProfileURL = "${SOGO_PROFILE_URL:-postgresql://sogo:sogo@postgresql.opendesk.svc.cluster.local:5432/sogo}";
  OCSFolderInfoURL = "${SOGO_OCS_FOLDER_INFO_URL:-postgresql://sogo:sogo@postgresql.opendesk.svc.cluster.local:5432/sogo}";
  OCSSessionsFolderURL = "${SOGO_OCS_SESSIONS_FOLDER_URL:-postgresql://sogo:sogo@postgresql.opendesk.svc.cluster.local:5432/sogo}";

  // Database connection pool settings
  SOGoMaximumDBConnections = ${SOGO_MAX_DB_CONNECTIONS:-50};
  SOGoDBConnectionPoolSize = ${SOGO_DB_POOL_SIZE:-10};
  
  // Enable connection pooling (improves performance)
  SOGoUseMultipleDBConnections = YES;
  
  // Database connection timeout (seconds)
  SOGoDBConnectionTimeout = 30;

  /* ================================================================ */
  /* EMAIL DOMAINS AND HOSTNAME                                     */
  /* ================================================================ */

  // Email domains (comma-separated)
  // These are the virtual domains that SOGo will handle
  // Override via: SOGO_MAIL_DOMAINS="opendesk.org,edu.opendesk.org"
  OCSEMailDomains = (${SOGO_MAIL_DOMAINS:-"opendesk-edu.org", "opendesk.org"});

  // Hostname for the SOGo service
  // Used in email headers and web interface
  SOGoHostName = "${SOGO_HOSTNAME:-sogo.opendesk-edu.org}";

  // Mail from domain (for system emails)
  SOGoMailFromDomain = "${SOGO_MAIL_FROM_DOMAIN:-opendesk-edu.org}";

  /* ================================================================ */
  /* AUTHENTICATION & USER SOURCES                                 */
  /* ================================================================ */

  // User Sources Configuration
  // Either use SOGO_USER_SOURCES env var (JSON array string) OR
  // uncomment and customize the userSources section below
  
  // Example env override:
  //   SOGO_USER_SOURCES='[{"type":"ldap","host":"ldap.opendesk.svc:389","baseDN":"dc=opendesk,dc=org","canAuthenticate":true}]'
  
  
  SOGoUserSources = (
    {
      type = ldap;
      
      // LDAP Server Configuration
      // Override via SOGO_LDAP_HOST, SOGO_LDAP_PORT
      host = "${SOGO_LDAP_HOST:-ldap.opendesk.svc.cluster.local:389}";
      port = ${SOGO_LDAP_PORT:-389};
      
      baseDN = "${SOGO_LDAP_BASE_DN:-dc=opendesk,dc=org}";
      bindDN = "${SOGO_LDAP_BIND_DN:-cn=admin,dc=opendesk,dc=org}";
      
      // Bind password can be:
      // 1. Injected via SOGO_LDAP_BIND_PASSWORD env var
      // 2. Read from /etc/sogo/ldap-password file (created by entrypoint.sh)
      // 3. Set directly here (NOT RECOMMENDED for production)
      bindPassword = "${SOGO_LDAP_BIND_PASSWORD}";
      
      // Search parameters
      idFieldName = "${SOGO_LDAP_ID_FIELD:-uid}";
      UIDFieldName = "${SOGO_LDAP_UID_FIELD:-uid}";
      CNFieldName = "${SOGO_LDAP_CN_FIELD:-cn}";
      UIDFieldNames = ("uid", "sAMAccountName", "cn");
      
      // Search base and scope
      base = "${SOGO_LDAP_BASE:-ou=users}";
      scope = SUB;
      
      // Address book settings
      isAddressBook = YES;
      displayName = "openDesk Edu Kontakte";
      canAuthenticate = YES;
      
      // Group settings
      groupBaseDN = "${SOGO_LDAP_GROUP_BASE:-ou=groups,dc=opendesk,dc=org}";
      groupFieldName = "cn";
      group_objectClasses = ("posixGroup", "groupOfNames", "openLdapGroup");
      groupFilter = "(objectClass=posixGroup)";
      groupCanAuthenticate = YES;
      
      // User filtering
      userFilter = "(objectClass=posixAccount)";
      userGroupsFilter = "(&(objectClass=posixAccount)(uid=%s))";
      listRequiresDot = NO;
      
      // Connection settings
      timeout = 10;              // seconds
      maxRetryCount = 3;
      connectionUseTLS = ${SOGO_LDAP_TLS:-YES};
      connectionDN = "${SOGO_LDAP_BIND_DN}";
      
      // Attribute mapping for contacts
      CNFieldName = "cn";
      UIDFieldName = "uid";
      IMFieldName = "mail";
      ImagesFieldName = "jpegPhoto";
      
      // Primary email field
      MailFieldNames = ("mail", "email");
      
      // Contact info attributes
      contactInfoAttribute = "mail";
      phoneAttribute = "telephoneNumber";
      mobileAttribute = "mobile";
      faxAttribute = "facsimileTelephoneNumber";
      addressFields = ("postalAddress", "street", "l", "st", "postalCode", "co");
      
      // Search fields
      searchFields = ("cn", "sn", "givenName", "mail", "telephoneNumber");
      
      // Enable contact photos
      enableContactPhotos = YES;
    },
    
    // Fallback: SQL user source (if LDAP is not available)
    {
      type = sql;
      id = "sogo";
      
      // Use the same database as SOGo
      viewURL = "postgresql://${SOGO_DATABASE_USER:-sogo}:${SOGO_DATABASE_PASSWORD:-sogo}@${SOGO_DATABASE_HOST:-postgresql.opendesk.svc.cluster.local}:5432/${SOGO_DATABASE_NAME:-sogo}";
      
      // User table
      userTable = "sogo_user_profile";
      userIDColumn = "c_uid";
      
      // Authentication
      canAuthenticate = YES;
      isAddressBook = YES;
      displayName = "SOGoBenutzer";
      
      // Query for fetching user info
      selectUserQuery = "SELECT c_uid, c_name, c_password, c_email FROM sogo_user_profile WHERE c_uid = '%%'";
      
      // Query for listing users
      listUsersQuery = "SELECT DISTINCT c_uid, c_name, c_email FROM sogo_user_profile ORDER BY c_name";
      
      // Query for authentication
      selectAuthenticationQuery = "SELECT c_password FROM sogo_user_profile WHERE c_uid = '%%'";
    }
  );

  /* ================================================================ */
  /* MAIL SERVER CONFIGURATION                                      */
  /* ================================================================ */

  // IMAP Server Configuration
  // Override via: SOGO_IMAP_SERVER, SOGO_IMAP_PORT
  SOGoIMAPServer = "${SOGO_IMAP_SERVER:-dovecot.opendesk.svc.cluster.local:993}";
  SOGoIMAPPort = ${SOGO_IMAP_PORT:-993};
  SOGoIMAPEncryption = YES;  // Use TLS
  SOGoIMAPAuthMethod = "${SOGO_IMAP_AUTH:-plain}";
  
  // SMTP Server Configuration
  SOGoSMTPServer = "${SOGO_SMTP_SERVER:-postfix.opendesk.svc.cluster.local:587}";
  SOGoSMTPPort = ${SOGO_SMTP_PORT:-587};
  SOGoSMTPEncryption = YES;  // Use STARTTLS
  SOGoSMTPAuthMethod = "${SOGO_SMTP_AUTH:-plain}";
  
  // Sieve Server Configuration (for mail filtering)
  SOGoSieveServer = "${SOGO_SIEVE_SERVER:-dovecot.opendesk.svc.cluster.local:4190}";
  SOGoSievePort = ${SOGO_SIEVE_PORT:-4190};
  SOGoSieveEncryption = YES;
  
  // Mail settings
  SOGoMailCustomFrom = YES;  // Allow users to set custom From: address
  SOGoMailFieldName = "mail";  // Default email field
  
  // Send mail via SMTP (not via sendmail)
  SOGoMailingMechanism = smtp;
  
  // Maximum number of recipients per message
  SOGoMaximumMailLength = 104857600;  // 100 MB
  SOGoMaximumRecipients = 100;

  /* ================================================================ */
  /* MEMCACHED CONFIGURATION                                        */
  /* ================================================================ */

  // Memcached Server
  // Used for caching user sessions and frequently accessed data
  // Override via: SOGO_MEMCACHED_HOST, SOGO_MEMCACHED_PORT
  
  SOGOMemcachedHost = "${SOGO_MEMCACHED_HOST:-127.0.0.1}";
  SOGOMemcachedPort = ${SOGO_MEMCACHED_PORT:-11211};
  
  // Memcached usage
  SOGoUseMemcached = YES;
  SOGoMemcachedTimeout = 5;  // seconds

  /* ================================================================ */
  /* PERFORMANCE & WORKER SETTINGS                                  */
  /* ================================================================ */

  // Worker Configuration
  // These control the SOGo web server (WOKit) behavior
  // Override via: SOGO_WORKERS_COUNT, SOGO_MAX_THREADS
  
  WOWorkersCount = ${SOGO_WORKERS_COUNT:-10};
  WOMaxThreadsPerWorker = ${SOGO_MAX_THREADS:-100};
  WOMessageRetryCount = ${SOGO_RETRY_COUNT:-3};
  
  // Connection handling
  WOContextಿಸಿ = 1024;  // Maximum number of file descriptors
  WOWorldsPerProcess = 10;
  
  // SOGo specific performance settings
  SOGoMaximumPingLifetime = ${SOGO_PING_TIMEOUT:-600};    // 10 minutes
  SOGoMaximumIdleLifetime = ${SOGO_IDLE_TIMEOUT:-1800};  // 30 minutes
  SOGoMaximumSyncWindow = ${SOGO_SYNC_WINDOW:-7};        // days
  
  // Memory caching
  SOGoCacheCleanupInterval = ${SOGO_CACHE_CLEANUP:-300};  // 5 minutes
  SOGoFolderInfoCacheSize = 1000;  // Number of folders to cache

  /* ================================================================ */
  /* LOGGING CONFIGURATION                                          */
  /* ================================================================ */

  // Logging levels
  // Enable only when debugging (performance impact)
  SOGoDebugRequests = ${SOGO_DEBUG_REQUESTS:-NO};
  SOGoDebugSQLQueries = ${SOGO_DEBUG_SQL:-NO};
  SOGoDebugSieveScripts = ${SOGO_DEBUG_SIEVE:-NO};
  SOGoDebugIMAP = ${SOGO_DEBUG_IMAP:-NO};
  SOGoDebugSMTP = ${SOGO_DEBUG_SMTP:-NO};
  
  // Log files
  // Note: In containerized environment, logs should go to stdout
  // These settings are kept for backwards compatibility
  SOGoLogFile = "${SOGO_LOG_FILE:-/var/log/sogo/sogo.log}";
  SOGoIMAPLogFile = "${SOGO_IMAP_LOG_FILE:-/var/log/sogo/imap.log}";
  SOGoSMTPLogFile = "${SOGO_SMTP_LOG_FILE:-/var/log/sogo/smtp.log}";
  SOGoSieveLogFile = "${SOGO_SIEVE_LOG_FILE:-/var/log/sogo/sieve.log}";
  
  // Log level (0-5, 0=errors only, 5=all)
  SOGoLogLevel = ${SOGO_LOG_LEVEL:-1};
  
  // Enable syslog logging (useful in containers)
  SOGoUseSyslog = YES;
  SOGoSyslogFacility = "local0";

  /* ================================================================ */
  /* SESSION & COOKIE SETTINGS                                     */
  /* ================================================================ */

  // Session Configuration
  SOGoSessionTimeOut = ${SOGO_SESSION_TIMEOUT:-1800};         // 30 minutes (seconds)
  SOGoMaximumSessionLength = ${SOGO_MAX_SESSION:-86400};     // 24 hours (seconds)
  SOGoSessionStore = memcached;  // Use memcached for sessions
  
  // Cookie settings
  SOGoSessionKey = "${SOGO_SESSION_KEY:-SOGoSessionID}";
  SOGoSecureSessionCookies = ${SOGO_SECURE_COOKIES:-YES};     // HTTPS only
  SOGoHttpSessionCookies = NO;  // Don't send over HTTP
  SOGoSessionCookieDomain = "${SOGO_COOKIE_DOMAIN:-opendesk-edu.org}";
  SOGoSessionCookiePath = "/";
  
  // Cross-site request forgery protection
  SOGoXSRFValidationEnabled = YES;

  /* ================================================================ */
  /* DEFAULT USER SETTINGS                                         */
  /* ================================================================ */

  // Default language and timezone
  // Override via: SOGO_LANGUAGE, SOGO_TIMEZONE
  SOGoLanguage = "${SOGO_LANGUAGE:-German}";
  SOGoTimeZone = "${SOGO_TIMEZONE:-Europe/Berlin}";
  
  // Default calendar and address book
  SOGoDefaultCalendar = YES;
  SOGoDefaultAddressBook = YES;
  
  // Enable public access (for shared calendars)
  SOGoEnablePublicAccess = YES;

  /* ================================================================ */
  /* FEATURES & CAPABILITIES                                        */
  /* ================================================================ */

  // Feature toggles
  SOGoEnableEMailAlarms = YES;
  SOGoEnableEMailVacation = YES;
  SOGoEnablePublicAccess = YES;
  SOGoEnableSubscription = YES;
  SOGoFollowingEnabled = YES;
  
  // Calendar features
  SOGoCalendarCategories = YES;
  SOGoEnableResourceBooking = YES;
  SOGoEnableEMailAlarms = YES;
  
  // Mail features
  SOGoMailboxSaveOnClose = YES;
  SOGoDraftsSyncEnabled = YES;
  SOGoSentSyncEnabled = YES;
  SOGoTrashSyncEnabled = YES;
  SOGoJunkSyncEnabled = YES;
  
  // Sharing features
  SOGoPermissionsOnPublicFolders = YES;
  SOGoEnable addressesDelimiter Change = YES;

  /* ================================================================ */
  /* ADDRESS BOOK SYNCHRONIZATION                                   */
  /* ================================================================ */

  // Address book folder subscriptions
  SOGoAddressBookSyncEnabled = YES;
  
  // LDAP address book integration
  LDAPContactInfoAttribute = "mail";
  LDAPPhoneAttribute = "telephoneNumber";
  LDAPMobileAttribute = "mobile";
  LDAPFaxAttribute = "facsimileTelephoneNumber";

  /* ================================================================ */
  /* SECURITY SETTINGS                                             */
  /* ================================================================ */

  // Super users (can access all accounts - use sparingly)
  SOGoSuperUsernames = ${SOGO_SUPER_USERS:-( "admin" )};
  
  // Password policies
  SOGoPasswordChangeEnabled = YES;
  SOGoMinimumPasswordLength = ${SOGO_MIN_PASSWORD_LENGTH:-8};
  SOGoPasswordAlgorithm = ${SOGO_PASSWORD_ALGO:-ssha512};
  SOGoPasswordExpiresInDays = ${SOGO_PASSWORD_EXPIRE:-365};
  
  // Authentication restrictions
  SOGoMaximumFailedlogin = ${SOGO_MAX_FAILED_LOGIN:-5};
  SOGoFailedLoginBlockTime = ${SOGO_FAILED_LOGIN_BLOCK:-300};  // 5 minutes
  
  // SSL/TLS settings
  // Note: SSL termination is typically handled at the ingress level
  // SOGo itself can also handle SSL if configured
  
  // SOGoと言うSSL certificate and key
  // If using SOGo's built-in HTTPS:
  //   SOGoSSLCertificateFile = "/etc/ssl/certs/sogo.pem";
  //   SOGoSSLKeyFile = "/etc/ssl/private/sogo.key";
  
  // Disable weak authentication methods
  SOGoXSRFValidationEnabled = YES;
  SOGoBasicAuthenticationEnabled = ${SOGO_BASIC_AUTH:-NO};
  
  // Content Security Policy (CSP)
  // Enable strict CSP for web interface
  SOGoCSPEnable = YES;
  SOGoCSPDefaultSrc = "'self'";
  SOGoCSPScriptSrc = "'self' 'unsafe-inline' 'unsafe-eval' cdnjs.cloudflare.com";
  SOGoCSPStyleSrc = "'self' 'unsafe-inline' fonts.googleapis.com";
  SOGoCSPImgSrc = "'self' data: www.gravatar.com";
  SOGoCSPFontSrc = "'self' fonts.gstatic.com";
  SOGoCSPConnectSrc = "'self'";

  /* ================================================================ */
  /* PERFORMANCE OPTIMIZATIONS                                     */
  /* ================================================================ */

  // Enable indexing for faster searches
  SOGoEnableIndexing = YES;
  SOGoIndexingInterval = 300;  // 5 minutes
  
  // Database optimizations
  SOGoUseMultipleDBConnections = YES;
  SOGoDBReconnectInterval = 60;  // Retry connection every 60 seconds
  
  // Caching
  SOGoCacheCleanupInterval = 300;
  SOGoFolderInfoCacheSize = 1000;
  
  // Prefer cached results
  SOGoContactsCacheEnabled = YES;
  SOGoCalendarCacheEnabled = YES;
  SOGoMailCacheEnabled = YES;

  /* ================================================================ */
  /* COMPATIBILITY SETTINGS                                        */
  /* ================================================================ */

  // Microsoft Outlook compatibility
  SOGoAppointmentSendEMailNotifications = YES;
  SOGoEnableEMailAlarms = YES;
  
  // Apple Calendar/iPhone compatibility
  SOGoEnableCalDAVSharing = YES;
  SOGoEnableCardDAVSharing = YES;
  
  // WebDAV compatibility
  SOGoEnableWebDAV = YES;
  
  // ActiveSync compatibility (for mobile clients)
  SOGoEnableActiveSync = YES;
  SOGoActiveSyncMaximumAgeFilter = 30;  // days
  
  // CalDAV/CardDAV compatibility
  SOGoMaxRequestSize = 104857600;  // 100 MB

  /* ================================================================ */
  /* EXTERNAL SERVICES & INTEGRATIONS                              */
  /* ================================================================ */

  // Gravatar support
  SOGoGravatarEnabled = YES;
  SOGoGravatarURL = "https://www.gravatar.com/avatar/%@";
  
  // OpenPGP/GnuPG support for encrypted emails
  SOGoPGPEnabled = YES;
  SOGoPGPServer = "${SOGO_PGP_SERVER:-hkps://keys.openpgp.org}";
  
  // S/MIME support
  SOGoSMIMEEnabled = YES;
  
  // External authentication (for SSO)
  // SOGo can integrate with external authentication providers
  // Currently disabled by default
  SOGoExternalAuthenticationType = "none";

  /* ================================================================ */
  /* WEB INTERFACE SETTINGS                                        */
  /* ================================================================ */

  // Web interface configuration
  SOGoPageTitle = "${SOGO_PAGE_TITLE:-openDesk Edu - SOGo 5}";
  SOGoLoginPageTitle = "${SOGO_LOGIN_TITLE:-Willkommen bei openDesk Edu}";
  
  // Custom logo URL
  // SOGoUserLogoURL = "https://opendesk-edu.org/logo.png";
  
  // Custom styles
  // SOGoCustomCSS = "/var/lib/sogo/custom.css";
  
  // Help URL
  SOGoHelpURL = "${SOGO_HELP_URL:-https://opendesk-edu.org/docs/sogo}";
  
  // Disable modules if not needed
  // SOGoModulesLevel = 
  //   {
  //     Mailer = Mailer;
  //     Calendar = Calendar;
  //     Contacts = Contacts;
  //   };

  /* ================================================================ */
  /* ADVANCED SETTINGS                                             */
  /* ================================================================ */

  // Enable SMyME
  SOGoSMIMEEnabled = YES;
  SOGoSMIMESignAlgorithm = "sha256";
  SOGoSMIMEEncryptAlgorithm = "aes256";

  // Quota settings
  // SOGoMailQuota = 1000000000;  // 1GB
  // SOGoMailboxQuota = YES;

  // syste
  SOGoSystemPermissions = 
  {
    // Public permissions
    Public = 
    {
      Calendar = ("AllRead", "AllOverwrite");
      AddressBook = ("AllRead", "AllWrite");
    };
  };

  /* ==============================================================================
  // DEPRECATED SETTINGS (kept for backwards compatibility)
  // ==============================================================================
  
  // These settings are deprecated and may be removed in future versions
  // They are kept here for backwards compatibility with existing configurations
  
  // SOGoIMAP’ancient = NO;  // Use modern IMAP
  // SOGoEntrepriseContacts = NO;  // Deprecated
  // SOGoGCSMode = NO;  // Deprecated
  
  /* ==============================================================================
  // END OF CONFIGURATION
  // ============================================================================== */
}
