"""
MariaDB Secrets File (PLAINTEXT - ENCRYPT BEFORE USE!)
This file contains sensitive database credentials.
ENCRYPT with sops: sops --encrypt --age age1... secrets.yaml > secrets.enc.yaml
"""

mariadb:
  # Root user password (can be set via MYSQL_ROOT_PASSWORD env var)
  root-password: "CHANGE_ME_ROOT_PASSWORD"
  
  # Application user passwords
  opendesk-password: "CHANGE_ME_OPENDESK_PASSWORD"
  moodle-password: "CHANGE_ME_MOODLE_PASSWORD"
  ilias-password: "CHANGE_ME_ILIAS_PASSWORD"
  nextcloud-password: "CHANGE_ME_NEXTCLOUD_PASSWORD"
  collabora-password: "CHANGE_ME_COLLABORA_PASSWORD"
  keycloak-password: "CHANGE_ME_KEYCLOAK_PASSWORD"
  openproject-password: "CHANGE_ME_OPENPROJECT_PASSWORD"
  rocketchat-password: "CHANGE_ME_ROCKETCHAT_PASSWORD"
  bookstack-password: "CHANGE_ME_BOOKSTACK_PASSWORD"
  planka-password: "CHANGE_ME_PLANKA_PASSWORD"
  
  # Replication user (for future HA setup)
  replication-user: "repl"
  replication-password: "CHANGE_ME_REPLICATION_PASSWORD"
  
  # Exporter password for monitoring
  exporter-password: "CHANGE_ME_EXPORTER_PASSWORD"
