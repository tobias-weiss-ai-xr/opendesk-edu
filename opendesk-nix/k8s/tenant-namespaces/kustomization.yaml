apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tenant namespaces for openDesk Edu multi-tenancy
# Creates opendesk-staff and opendesk-students namespaces with:
# - ResourceQuotas
# - NetworkPolicies (default-deny, allow-same-namespace, allow-haproxy-ingress, allow-egress-to-opendesk)
# - Ceph-CSI storage classes (ceph-rbd-staff, ceph-rbd-students with Retain policy)
resources:
  - namespaces.yaml
  - storage-classes.yaml
  - allow-tenant-ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: opendesk-edu
  app.kubernetes.io/managed-by: kustomize
