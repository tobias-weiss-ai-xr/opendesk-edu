---
# Ceph-CSI Storage Classes for Tenant Isolation
# SCS-K3s Cluster — actual Ceph configuration
#
# Cluster ID: 74d6f792-b66e-4dff-a94a-59ef3e6f5f81
# RBD pool: kubernetes-rbd (existing)
# CephFS pool: cephfs (existing)
# Secret: csi-rbd-secret / csi-cephfs-secret (kube-system)
#
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 openDesk Edu Contributors

# ── Ceph-CSI RBD for Staff Tenant (Retain policy — tenant data) ──
# Uses existing kubernetes-rbd pool. Physical pool isolation can be
# added later by creating a separate staff-rbd pool in Ceph.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd-staff
  labels:
    app.kubernetes.io/part-of: opendesk-edu
    opendesk.ai/tenant: staff
provisioner: rbd.csi.ceph.com
parameters:
  clusterID: 74d6f792-b66e-4dff-a94a-59ef3e6f5f81
  pool: kubernetes-rbd
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/fstype: ext4
  csi.storage.k8s.io/provisioner-secret-name: csi-rbd-secret
  csi.storage.k8s.io/provisioner-secret-namespace: kube-system
  csi.storage.k8s.io/node-stage-secret-name: csi-rbd-secret
  csi.storage.k8s.io/node-stage-secret-namespace: kube-system
  csi.storage.k8s.io/controller-expand-secret-name: csi-rbd-secret
  csi.storage.k8s.io/controller-expand-secret-namespace: kube-system
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - discard

---
