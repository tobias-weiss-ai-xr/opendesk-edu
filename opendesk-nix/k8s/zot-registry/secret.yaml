---
# Zot Registry Secrets
# Sensitive configuration - must be encrypted for production!

apiVersion: v1
kind: Secret
metadata:
  name: zot-registry-secrets
  namespace: opendesk
  labels:
    app: zot-registry
    app.kubernetes.io/name: zot-registry
    opendesk.org/secret-type: registry-credentials
  
  # For sealed secrets:
  # sealedsecrets.bitnami.com/sealed-secrets-name: zot-registry-secrets
  # sealedsecrets.bitnami.com/sealed-secrets-namespace: opendesk

type: Opaque

# ============================================
# IMPORTANT: These values are placeholders!
# In production, use:
# 1. kubeseal to encrypt: kubeseal --format yaml < secret.yaml > sealed-secret.yaml
# 2. Or use external secret manager (Vault, AWS Secrets Manager)
# 3. Or populate via CI/CD pipeline
# ============================================

stringData:
  # Internal cache user
  cache-password: "CHANGE_ME"
  
  # GitHub Container Registry credentials
  ghcr-username: "CHANGE_ME"
  ghcr-password: "CHANGE_ME_GITHUB_PAT"
  
  # GitLab opencode.de credentials
  gitlab-username: "weiss"
  gitlab-password: "CHANGE_ME_GITLAB_PAT"
  
  # HTPasswd content (for web UI access)
  # Generate with: htpasswd -Bbn username password
  htpasswd: |
    # cache-user:$2y$05$hashedpassword...
    # admin:$2y$05$anotherhashedpassword...

---
# Pull secret for accessing GitLab registry from within cluster
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry-opencode
  namespace: opendesk
  labels:
    app: zot-registry
    opendesk.org/secret-type: image-pull-secret

type: kubernetes.io/dockerconfigjson
data:
  # This must be base64 encoded docker config
  # Generate with: kubectl create secret docker-registry ... --dry-run=client -o yaml
  .dockerconfigjson: CHANGE_ME_BASE64_ENCODED_DOCKER_CONFIG
