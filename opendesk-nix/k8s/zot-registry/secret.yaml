# Zot Registry Secrets
# SPDX-License-Identifier: Apache-2.0
# Purpose: Sensitive credentials for Zot Registry
# Security Level: SENSITIVE - DO NOT COMMIT TO GIT
#
# IMPORTANT: This file contains SECRET references.
# In production, use `kubectl create secret` or:
#   kubectl apply -f secret.yaml
#
# All values should be base64 encoded!
#
# To create this secret properly:
#   echo -n "your-password" | base64
#   echo -n "your-username" | base64
#
# For GitHub Container Registry (GHCR):
#   Just use a GitHub Personal Access Token as password
#
# For GitLab Container Registry:
#   Use GitLab CI Job Token or Personal Access Token
#
# WARNING: NEVER commit plain text credentials to version control!
#
apiVersion: v1
kind: Secret
metadata:
  name: zot-secrets
  namespace: zot-registry
  labels:
    app: zot-registry
    component: secrets
    managed-by: opendesk-edu
    opendesk.org/component: registry
    opendesk.org.purpose: caching
  annotations:
    kubernetes.io/service-account.name: zot-registry
    description: "Sensitive credentials for Zot Registry - Base64 encoded"
    opendesk.org/security-level: "high"
    opendesk.org.contains-credentials: "true"
# This is a TEMPLATE - replace all values with actual base64 encoded credentials!
# NEVER commit this with real credentials to git!
type: Opaque
stringData:
  # ===========================================================================
  # ZOT REGISTRY AUTHENTICATION
  # ===========================================================================
  # Admin user password (bcrypt hashed, but we use htpasswd file)
  ZOT_ADMIN_PASSWORD: "changeme-admin"
  
  # Cache user password
  ZOT_CACHE_PASSWORD: "changeme-cache"
  
  # CI/CD robot password
  ZOT_CI_PASSWORD: "changeme-ci"

  # ===========================================================================
  # UPSTREAM REGISTRY CREDENTIALS
  # ===========================================================================
  
  # GitHub Container Registry (GHCR)
  # Username: can be your GitHub username or "_webhook" for token auth
  GHCR_USERNAME: ""
  # Password: GitHub Personal Access Token (classic) with read:packages scope
  GHCR_PASSWORD: ""
  
  # GitLab Container Registry (registry.gitlab.opencode.de)
  # Username: can be your GitLab username or "gitlab-ci-token" for CI jobs
  GITLAB_USERNAME: ""
  # Password: GitLab Personal Access Token with read_registry scope
  # OR for CI: ${CI_JOB_TOKEN} (automatically available in GitLab CI)
  GITLAB_PASSWORD: ""
  
  # Docker Hub (if enabled)
  DOCKERHUB_USERNAME: ""
  DOCKERHUB_PASSWORD: ""

  # ===========================================================================
  # TLS CERTIFICATES (Optional - for direct HTTPS)
  # ===========================================================================
  # If enabling TLS in config.yml, provide certificates here
  # tls.crt: |-
  #   -----BEGIN CERTIFICATE-----
  #   [BASE64 ENCODED CERTIFICATE]
  #   -----END CERTIFICATE-----
  # tls.key: |-
  #   -----BEGIN PRIVATE KEY-----
  #   [BASE64 ENCODED PRIVATE KEY]
  #   -----END PRIVATE KEY-----

---
# HTPasswd file Secret
# This is the actual htpasswd file mounted at /etc/zot/passwd
apiVersion: v1
kind: Secret
metadata:
  name: zot-htpasswd
  namespace: zot-registry
  labels:
    app: zot-registry
    component: htpasswd
    managed-by: opendesk-edu
    opendesk.org/component: registry
    opendesk.org.purpose: caching
  annotations:
    description: "HTPasswd file for Zot Registry authentication"
    opendesk.org.security-level: "high"
type: Opaque
stringData:
  # IMPORTANT: If you use htpasswd file, provide the CONTENTS here
  # NOT the htpasswd file itself - just the text content
  #
  # The file will be mounted at /etc/zot/passwd
  #
  # To generate proper bcrypt hashes:
  #   docker run --rm httpd:alpine htpasswd -B -c /tmp/passwd admin
  #   docker run --rm -v $(pwd):/tmp httpd:alpine cat /tmp/passwd
  #
  # Example format (replace with your own):
  # admin:$2a$10$xJwL5v5z3b3J9JxJ3e3z5uQjR1lBn9pLq7z2Z3j5K8m1N2oP4q6R7
  # cache-user:$2a$10$yJwL5v5z3b3J9JxJ3e3z5uQjR1lBn9pLq7z2Z3j5K8m1N2oP4q6R8
  # ci-bot:$2a$10$zJwL5v5z3b3J9JxJ3e3z5uQjR1lBn9pLq7z2Z3j5K8m1N2oP4q6R9
  passwd: |
    # TEMPLATE: Replace with actual htpasswd content
    # admin:$2a$10$xJwL5v5z3b3J9JxJ3e3z5uQjR1lBn9pLq7z2Z3j5K8m1N2oP4q6R7
    # cache-user:$2a$10$yJwL5v5z3b3J9JxJ3e3z5uQjR1lBn9pLq7z2Z3j5K8m1N2oP4q6R8
    # ci-bot:$2a$10$zJwL5v5z3b3J9JxJ3e3z5uQjR1lBn9pLq7z2Z3j5K8m1N2oP4q6R9

---
# Service Account Token Secret (for pulling from this registry)
apiVersion: v1
kind: Secret
metadata:
  name: zot-registry-credentials
  namespace: zot-registry
  labels:
    app: zot-registry
    component: credentials
    managed-by: opendesk-edu
    opendesk.org/component: registry
    opendesk.org.purpose: caching
  annotations:
    kubernetes.io/service-account.name: default
    description: "Credentials for pulling from Zot Registry"
    opendesk.org/usage: "imagePullSecrets"
type: kubernetes.io/dockerconfigjson
data:
  # This is a template - in production, create with:
  #   kubectl create secret docker-registry zot-registry-credentials \
  #     --docker-server=zot-registry.zot-registry.svc:8080 \
  #     --docker-username=cache-user \
  #     --docker-password=changeme-cache \
  #     --docker-email=admin@opendesk-edu.org \
  #     -n zot-registry
  .dockerconfigjson: "ew0KICAgICAgICAgICAgICAgICAgImlhdCI6IDB9"
