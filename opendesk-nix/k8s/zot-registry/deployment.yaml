---
# Zot Registry - Hardened Container Image Registry for Caching
# Purpose: Local caching of container images on K3s cluster
# Image: registry.gitlab.opencode.de/umr/zot-registry:latest
# SPDX-License-Identifier: Apache-2.0

apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot-registry
  namespace: opendesk
  labels:
    app: zot-registry
    app.kubernetes.io/name: zot-registry
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: opendesk
    opendesk.org/container-registry: gitlab.opencode.de
    opendesk.org/hardened: "true"
    opendesk.org/purpose: caching

spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: zot-registry
  template:
    metadata:
      labels:
        app: zot-registry
        app.kubernetes.io/name: zot-registry
        app.kubernetes.io/version: "2.0.0"
      annotations:
        checksum/config: {{ include "opendesk-nix/k8s/zot-registry/configmap.yaml" | sha256sum }}
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      # --- SECURITY CONTEXT ---
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        
      # --- SERVICE ACCOUNT ---
      serviceAccountName: zot-registry
      
      # --- AFFINITY ---
      # Prefer to run on control plane nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: In
                    values: ["true"]
                  - key: node-role.kubernetes.io/master
                    operator: In
                    values: ["true"]
        
        # Anti-affinity: only one registry pod per node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["zot-registry"]
              topologyKey: "kubernetes.io/hostname"
      
      # --- CONTAINERS ---
      containers:
        - name: zot
          image: registry.gitlab.opencode.de/umr/zot-registry:latest
          imagePullPolicy: Always
          
          # --- SECURITY ---
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          
          # --- PORTS ---
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
          
          # --- ENVIRONMENT ---
          env:
            - name: ZOT_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zot-registry-secrets
                  key: cache-password
                  optional: true
            - name: GHCR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: zot-registry-secrets
                  key: ghcr-username
                  optional: true
            - name: GHCR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zot-registry-secrets
                  key: ghcr-password
                  optional: true
            - name: GITLAB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: zot-registry-secrets
                  key: gitlab-username
                  optional: true
            - name: GITLAB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zot-registry-secrets
                  key: gitlab-password
                  optional: true
            - name: TZ
              value: "Europe/Berlin"
          
          # --- RESOURCES ---
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 10Gi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 50Gi
          
          # --- LIVENESS & READINESS PROBES ---
          livenessProbe:
            httpGet:
              path: /v2/
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /v2/
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          
          # --- VOLUME MOUNTS ---
          volumeMounts:
            - name: storage
              mountPath: /var/lib/zot/storage
            - name: cache
              mountPath: /var/lib/zot/cache
            - name: logs
              mountPath: /var/log/zot
            - name: config
              mountPath: /etc/zot/config.yml
              subPath: config.yml
            - name: passwd
              mountPath: /etc/zot/passwd
              subPath: passwd
          
          # --- STARTUP PROBE ---
          startupProbe:
            httpGet:
              path: /v2/
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
      
      # --- VOLUMES ---
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: zot-registry-storage
        - name: cache
          persistentVolumeClaim:
            claimName: zot-registry-cache
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: zot-registry-config
        - name: passwd
          secret:
            secretName: zot-registry-secrets
            items:
              - key: htpasswd
                path: passwd
      
      # --- IMAGE PULL SECRETS ---
      imagePullSecrets:
        - name: gitlab-registry-opencode
      
      # --- TOLERATIONS ---
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      
      # --- PRIORITY CLASS (if available) ---
      priorityClassName: system-cluster-critical
