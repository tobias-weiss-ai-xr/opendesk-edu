---
# Image Pull Secret for registry.gitlab.opencode.de
#
# Create with:
#   kubectl create secret docker-registry gitlab-registry-opencode \
#     --docker-server=registry.gitlab.opencode.de \
#     --docker-username=weiss \
#     --docker-password="$OPENCODE_TOKEN" \
#     --docker-email=tobias.weiss@hrz.uni-marburg.de \
#     -n opendesk
#
# Or apply this manifest (replace the base64-encoded .dockerconfigjson):
#   echo -n '{"auths":{"registry.gitlab.opencode.de":{"username":"weiss","password":"YOUR_TOKEN","email":"tobias.weiss@hrz.uni-marburg.de","auth":"BASE64_ENCODED"}}}' | base64

apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry-opencode
  namespace: opendesk
  labels:
    app.kubernetes.io/name: opendesk-edu
    opendesk.org/secret-type: image-pull-secret
type: kubernetes.io/dockerconfigjson
data:
  # Replace with: echo -n '{"auths":{"registry.gitlab.opencode.de":{"username":"weiss","password":"YOUR_TOKEN","email":"tobias.weiss@hrz.uni-marburg.de","auth":"$(echo -n 'weiss:YOUR_TOKEN' | base64)"}}}' | base64
  .dockerconfigjson: CHANGE_ME_BASE64_ENCODED_DOCKER_CONFIG
---
# ServiceAccount patch to use the pull secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: opendesk
  labels:
    app.kubernetes.io/name: opendesk-edu
imagePullSecrets:
  - name: gitlab-registry-opencode
