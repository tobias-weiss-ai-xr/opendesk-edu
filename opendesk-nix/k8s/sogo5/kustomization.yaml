---
# Kustomize configuration for SOGo 5
# Usage: kubectl apply -k opendesk-nix/k8s/sogo5

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sogo5
  namespace: opendesk
  labels:
    app: sogo5
    opendesk.org/container-registry: gitlab.opencode.de
    opendesk.org/nix-maintained: "true"

namespace: opendesk

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - pvc.yaml

# Uncomment to include sealed secrets
# - sealed-secret.yaml

configMapGenerator:
  - name: sogo5-config
    files:
      - configmap.yaml

# For production, use:
# generatorOptions:
#   disableNameSuffixHash: true
#   labels:
#     opendesk.org/managed-by: kustomize

# Use with:
# kubectl apply -k opendesk-nix/k8s/sogo5
