---
# SOGo 5 Secrets
# Sensitive configuration for SOGo 5

apiVersion: v1
kind: Secret
metadata:
  name: sogo5-secrets
  namespace: opendesk
  labels:
    app: sogo5
    app.kubernetes.io/name: sogo5
    opendesk.org/container-registry: gitlab.opencode.de
  annotations:
    kubernetes.io/grup: opendesk
    kubernetes.io/service: sogo5

type: Opaque

# Encrypt these values using kubeseal or similar
# Example: kubeseal --format yaml --cert supabase-clusters.pub < secret.yaml > sealed-secret.yaml

stringData:
  # LDAP bind password
  SOGO_LDAP_BIND_PASSWORD: "CHANGE_ME"
  
  # Database passwords
  SOGO_DB_PASSWORD: "CHANGE_ME"
  
  # SMTP configuration (if used)
  SOGO_SMTP_PASSWORD: "CHANGE_ME"
  
  # Encryption key for SOGo
  SOGO_DEFAULT_ENCRYPTION_KEY: "CHANGE_ME_32_BYTES_LONG_KEY"

---