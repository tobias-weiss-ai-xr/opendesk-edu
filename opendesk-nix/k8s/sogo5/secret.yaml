# SOGo 5 Secrets Template
# SPDX-License-Identifier: Apache-2.0
#
# IMPORTANT: This is a TEMPLATE file.
# DO NOT commit actual secrets to version control!
#
# To create the actual secret:
#   kubectl create secret generic sogo5-secrets \
#     --from-literal=db-password=${DB_PASSWORD} \
#     --from-literal=ldap-bind-password=${LDAP_PASSWORD} \
#     --from-literal=sogo-sieve-password=${SIEVE_PASSWORD} \
#     -n sogo5
#
# Or use sealed-secrets, Helm secrets, or external secret managers.
#
---
apiVersion: v1
kind: Secret
metadata:
  name: sogo5-secrets
  namespace: sogo5
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo5
    app.kubernetes.io/version: "5.8.0"
    app.kubernetes.io/component: mail
    app.kubernetes.io/part-of: opendesk
    app.kubernetes.io/managed-by: kustomize
    
    opendesk.org/secret-type: database-ldap
    opendesk.org/component: mail-calendar-contacts
    
    de.zki.it-grundschutz.module: SY.3.4Mail
    de.zki.it-grundschutz.classification: confidential
    de.container.gov.component: sogo5
    de.container.gov.secret: "true"

type: Opaque

# Placeholder values - MUST be replaced with actual values
# These are intentionally dummy values to prevent accidental use
stringData:
  # Database credentials
  db-password: "CHANGE_ME"
  db-user: "sogo"
  db-host: "postgresql.opendesk.svc.cluster.local"
  db-port: "5432"
  db-name: "sogo"
  
  # LDAP credentials
  ldap-bind-password: "CHANGE_ME"
  ldap-bind-dn: "cn=admin,dc=opendesk,dc=org"
  ldap-host: "ldap.opendesk.svc.cluster.local"
  ldap-port: "389"
  ldap-base-dn: "dc=opendesk,dc=org"
  
  # Mail server credentials
  imap-host: "dovecot.opendesk.svc.cluster.local"
  imap-port: "993"
  smtp-host: "postfix.opendesk.svc.cluster.local"
  smtp-port: "587"
  
  # Sieve server credentials (for mail filtering)
  sieve-host: "dovecot.opendesk.svc.cluster.local"
  sieve-port: "4190"
  sieve-password: "CHANGE_ME"
  
  # SOGo admin password (for superuser access)
  sogo-admin-password: "CHANGE_ME"
  
  # Session encryption key
  sogo-session-key: "CHANGE_ME_GENERATE_WITH_pwgen_32"

---
# PostgreSQL Connection Secret
apiVersion: v1
kind: Secret
metadata:
  name: sogo5-db-secret
  namespace: sogo5
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo5
    app.kubernetes.io/component: database
    
    opendesk.org/secret-type: database

type: Opaque
stringData:
  # PostgreSQL primary credentials
  POSTGRES_USER: "sogo"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "sogo"
  
  # Connection string
  CONNECTION_STRING: "postgresql://sogo:CHANGE_ME@postgresql.opendesk.svc.cluster.local:5432/sogo"

data:
  # Base64-encoded values (optional)
  POSTGRES_PASSWORD_B64: "Q0hBTkdFX01F"

---
# LDAP Connection Secret
apiVersion: v1
kind: Secret
metadata:
  name: sogo5-ldap-secret
  namespace: sogo5
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo5
    app.kubernetes.io/component: ldap
    
    opendesk.org/secret-type: ldap

type: Opaque
stringData:
  LDAP_BIND_DN: "cn=admin,dc=opendesk,dc=org"
  LDAP_BIND_PASSWORD: "CHANGE_ME"
  LDAP_BASE_DN: "dc=opendesk,dc=org"

data:
  LDAP_BIND_PASSWORD_B64: "Q0hBTkdFX01F"

---
# TLS Certificates for SOGo 5 (if using built-in HTTPS)
apiVersion: v1
kind: Secret
metadata:
  name: sogo5-tls-secret
  namespace: sogo5
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo5
    app.kubernetes.io/component: tls
    
    opendesk.org/secret-type: tls

type: kubernetes.io/tls
stringData:
  # TLS certificate and key
  # Generate with:
  #   openssl req -x509 -nodes -days 365 -newkey rsa:4096 \
  #     -keyout tls.key -out tls.crt \
  #     -subj "/CN=sogo5.opendesk-edu.org/O=openDesk Edu/C=DE"
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIIF... (base64-encoded certificate)
    -----END CERTIFICATE-----
    -----BEGIN CERTIFICATE-----
    (Intermediate CA certificate if used)
    -----END CERTIFICATE-----
  
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    MIIJ... (base64-encoded private key)
    -----END PRIVATE KEY-----

---
# Image Pull Secret for opencode.de GitLab Registry
apiVersion: v1
kind: Secret
metadata:
  name: sogo5-pull-secret
  namespace: sogo5
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo5
    app.kubernetes.io/component: containers
    
    opendesk.org/registry: "registry.gitlab.opencode.de"

type: kubernetes.io/dockerconfigjson
stringData:
  # Create with:
  #   kubectl create secret docker-registry sogo5-pull-secret \
  #     --docker-server=registry.gitlab.opencode.de \
  #     --docker-username=oauth2 \
  #     --docker-password=<PAT> \
  #     --docker-email=user@example.com \
  #     -n sogo5
  .dockerconfigjson: ""
