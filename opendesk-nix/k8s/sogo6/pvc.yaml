# SOGo 6 Persistent Volume Claims
# SPDX-License-Identifier: Apache-2.0
---
# PVC for SOGo user data (RWO)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sogo6-data
  namespace: sogo6
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo6
    app.kubernetes.io/version: "6.0.0"
    opendesk.org/pvc-type: data
    opendesk.org/backup: "k8up-daily"
    de.container.gov.component: sogo6

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: ceph-rbd-ssd

