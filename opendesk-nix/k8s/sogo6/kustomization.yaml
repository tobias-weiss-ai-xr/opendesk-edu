---
# Kustomize configuration for SOGo 6
# Usage: kubectl apply -k opendesk-nix/k8s/sogo6

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sogo6
  namespace: opendesk
  labels:
    app: sogo6
    opendesk.org/container-registry: gitlab.opencode.de
    opendesk.org/nix-maintained: "true"

namespace: opendesk

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - pvc.yaml

configMapGenerator:
  - name: sogo6-config
    files:
      - configmap.yaml

# Use with:
# kubectl apply -k opendesk-nix/k8s/sogo6
