# SOGo 6 Namespace Configuration
# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: Namespace
metadata:
  name: sogo6
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo6
    app.kubernetes.io/version: "6.0.0"
    app.kubernetes.io/component: mail
    app.kubernetes.io/part-of: opendesk
    app.kubernetes.io/managed-by: kustomize
    
    # openDesk specific
    opendesk.org/component: mail-calendar-contacts
    opendesk.org/version: "6.0.0"
    opendesk.org/tier: backend
    
    # ZKI IT-Grundschutz
    de.zki.it-grundschutz.module: SY.3.4Mail
    de.zki.it-grundschutz.layer: Application
    de.zki.it-grundschutz.classification: internal
    
    # container.gov.de
    de.container.gov.component: sogo6
    de.container.gov.component-type: mail-server
    de.container.gov.security-level: enhanced
