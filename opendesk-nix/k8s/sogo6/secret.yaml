# SOGo 6 Secrets Template
# SPDX-License-Identifier: Apache-2.0
#
# IMPORTANT: This is a TEMPLATE only!
# DO NOT commit actual secrets!
#
# Create actual secrets with:
# kubectl create secret generic sogo6-secrets -n sogo6 \
#   --from-literal=db-password=PASSWORD \
#   --from-literal=ldap-bind-password=PASSWORD
#
---
apiVersion: v1
kind: Secret
metadata:
  name: sogo6-secrets
  namespace: sogo6
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo6
    app.kubernetes.io/version: "6.0.0"
    app.kubernetes.io/component: mail
    app.kubernetes.io/part-of: opendesk
    
    opendesk.org/secret-type: database-ldap
    de.container.gov.component: sogo6
    de.container.gov.secret: "true"

type: Opaque
stringData:
  # Database
  db-password: "CHANGE_ME"
  db-user: "sogo"
  db-host: "postgresql.opendesk.svc.cluster.local"
  db-port: "5432"
  db-name: "sogo"
  
  # LDAP
  ldap-bind-password: "CHANGE_ME"
  ldap-bind-dn: "cn=admin,dc=opendesk,dc=org"
  ldap-host: "ldap.opendesk.svc.cluster.local"
  ldap-port: "389"
  ldap-base-dn: "dc=opendesk,dc=org"
  
  # Mail Servers
  imap-host: "dovecot.opendesk.svc.cluster.local"
  imap-port: "993"
  smtp-host: "postfix.opendesk.svc.cluster.local"
  smtp-port: "587"
  sieve-host: "dovecot.opendesk.svc.cluster.local"
  sieve-port: "4190"
  
  # Admin
  sogo-admin-password: "CHANGE_ME"
  sogo-session-key: "CHANGE_ME_GENERATE_32_BYTES"

---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: sogo6-db-secret
  namespace: sogo6
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo6
type: Opaque
stringData:
  POSTGRES_USER: "sogo"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "sogo"

---
# Image Pull Secret
apiVersion: v1
kind: Secret
metadata:
  name: sogo6-pull-secret
  namespace: sogo6
  labels:
    app.kubernetes.io/name: sogo
    opendesk.org/registry: gitlab.opencode.de

type: kubernetes.io/dockerconfigjson
stringData:
  # kubectl create secret docker-registry sogo6-pull-secret \
  #   --docker-server=registry.gitlab.opencode.de \
  #   --docker-username=oauth2 \
  #   --docker-password=<PAT> \
  #   --docker-email=user@example.com \
  #   -n sogo6
  .dockerconfigjson: ""
