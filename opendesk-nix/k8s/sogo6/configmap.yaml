# SOGo 6 Configuration ConfigMap
# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: sogo6-config
  namespace: sogo6
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo6
    app.kubernetes.io/version: "6.0.0"
    app.kubernetes.io/component: mail
    app.kubernetes.io/part-of: opendesk
    app.kubernetes.io/managed-by: kustomize
    
    opendesk.org/config-type: sogo
    opendesk.org/component: mail-calendar-contacts
    
    de.zki.it-grundschutz.module: SY.3.4Mail
    de.container.gov.component: sogo6

data:
  # Main SOGo configuration
  sogo.conf: |
    {
      /* SOGo 6 Configuration */
      productName = "openDesk Edu - SOGo 6";
      
      /* Database */
      SOGoProfileURL = "postgresql://sogo:${DB_PASSWORD}@${DB_HOST}:5432/sogo";
      OCSFolderInfoURL = "postgresql://sogo:${DB_PASSWORD}@${DB_HOST}:5432/sogo";
      OCSSessionsFolderURL = "postgresql://sogo:${DB_PASSWORD}@${DB_HOST}:5432/sogo";
      
      SOGoMaximumDBConnections = 100;
      SOGoDBConnectionPoolSize = 20;
      SOGoUseMultipleDBConnections = YES;
      SOGoEnablePreparedStatements = YES;
      
      /* Email */
      OCSEMailDomains = ("opendesk-edu.org", "opendesk.org");
      SOGoHostName = "sogo6.opendesk-edu.org";
      
      /* User Sources */
      SOGoUserSources = (
        {
          type = ldap;
          host = "ldap://${LDAP_HOST}:389";
          baseDN = "${LDAP_BASE_DN}";
          bindDN = "${LDAP_BIND_DN}";
          bindPassword = "${LDAP_BIND_PASSWORD}";
          idFieldName = "uid";
          UIDFieldName = "uid";
          CNFieldName = "cn";
          UIDFieldNames = ("uid", "sAMAccountName");
          base = "${LDAP_BASE:-ou=users}";
          scope = SUB;
          isAddressBook = YES;
          displayName = "openDesk LDAP";
          canAuthenticate = YES;
          timeout = 10;
          maxRetryCount = 3;
          connectionUseTLS = YES;
        }
      );
      
      /* Mail Servers */
      SOGoIMAPServer = "imap://${IMAP_HOST}:993";
      SOGoSMTPServer = "smtp://${SMTP_HOST}:587";
      SOGoSieveServer = "sieve://${IMAP_HOST}:4190";
      SOGoIMAPEncryption = YES;
      SOGoSMTPEncryption = YES;
      SOGoMailingMechanism = smtp;
      
      /* Memcached */
      SOGOMemcachedHost = "127.0.0.1";
      SOGOMemcachedPort = 11211;
      SOGoUseMemcached = YES;
      
      /* Performance - SOGo 6 Optimized */
      WOWorkersCount = 16;
      WOMaxThreadsPerWorker = 200;
      
      /* Session */
      SOGoSessionTimeOut = 3600;
      SOGoMaximumSessionLength = 86400;
      SOGoSessionStore = memcached;
      
      /* Security */
      SOGoSuperUsernames = ("admin");
      SOGoPasswordChangeEnabled = YES;
      SOGoXSRFValidationEnabled = YES;
      SOGoSecureSessionCookies = YES;
      SOGoMinimumPasswordLength = 12;
      
      /* Features - SOGo 6 */
      SOGoDefaultCalendar = YES;
      SOGoDefaultAddressBook = YES;
      SOGoEnablePublicAccess = YES;
      SOGoEnableEMailAlarms = YES;
      SOGoEnableEMailVacation = YES;
      SOGoEnableCalDAVSharing = YES;
      SOGoEnableCardDAVSharing = YES;
      SOGoEnableActiveSync = YES;
      SOGoEnableRESTAPI = YES;
      SOGoEnableWebDAV = YES;
      SOGoEnableContactPhotos = YES;
      
      /* Language */
      SOGoLanguage = "German";
      SOGoTimeZone = "Europe/Berlin";
      
      /* Logging */
      SOGoLogFile = "/var/log/sogo/sogo.log";
      SOGoLogLevel = 1;
      SOGoDebugRequests = NO;
      SOGoUseSyslog = YES;
      
      /* SOGo 6 Specific */
      SOGoEnableNewUI = YES;
      SOGoEnableResourceBooking = YES;
      SOGo_enableContactPhotos = YES;
      SOGoCacheCleanupInterval = 600;
      SOGoIndexingInterval = 60;
      SOGoEnableIndexing = YES;
    }

  # GNUstep configuration
  GNUstep.conf: |
    {
      NSGlobalDomain = {
        GSFileSystemRepresentation = unix;
        GSDebugResourceLoading = NO;
        GSPrintPageRange = NO;
        GSAllowTextSmoothing = YES;
        GSFastEnumerationExtendsBeyondCount = YES;
      };
    }

  # Memcached configuration (SOGo 6 uses modern mode)
  memcached.conf: |
    -p 11211
    -l 127.0.0.1
    -m 512
    -c 2048
    -t 8
    -u sogo
    -P /var/run/sogo/memcached.pid
    -v
    -moden
    -D proxy
    -d
    -f 1.05
    -M
    -I 4m

  # Health check script
  healthcheck.sh: |
    #!/bin/bash
    SOGO_PID=$(cat /var/run/sogo/sogo.pid 2>/dev/null)
    MEMCACHED_PID=$(cat /var/run/sogo/memcached.pid 2>/dev/null)
    exit_code=0
    
    if [ -z "$SOGO_PID" ] || ! kill -0 "$SOGO_PID" 2>/dev/null; then
        echo "ERROR: SOGo process not running"
        exit_code=1
    fi
    
    if [ -z "$MEMCACHED_PID" ] || ! kill -0 "$MEMCACHED_PID" 2>/dev/null; then
        echo "ERROR: Memcached process not running"
        exit_code=1
    fi
    
    if ! nc -z 127.0.0.1 20000 2>/dev/null; then
        echo "ERROR: SOGo HTTP port not responding"
        exit_code=1
    fi
    
    if [ $exit_code -eq 0 ]; then
        echo "OK: SOGo 6 is healthy"
    fi
    exit $exit_code

  # Startup probe
  startup-probe.sh: |
    #!/bin/bash
    timeout=60
    interval=5
    attempt=0
    max_attempts=$((timeout / interval))
    
    while [ $attempt -lt $max_attempts ]; do
        attempt=$((attempt + 1))
        if curl -s -f -o /dev/null "http://127.0.0.1:20000/SOGo" 2>/dev/null; then
            echo "OK: SOGo 6 is ready after ${attempt} attempts"
            exit 0
        fi
        sleep $interval
    done
    echo "ERROR: SOGo 6 did not start within ${timeout} seconds"
    exit 1

  # Logrotate
  logrotate.conf: |
    /var/log/sogo/sogo.log {
        daily
        rotate 30
        compress
        delaycompress
        notifempty
        copytruncate
        size 100M
        create 0640 sogo sogo
        dateext
        maxage 90
    }
