---
# Traefik Ingress Controller Configuration for SCS-K3s
# Custom Traefik with TLS passthrough and HAProxy-compatible features
#
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 openDesk Edu Contributors

# Traefik is installed via Helm (replacing K3s built-in Traefik)
# Install:
#   helm repo add traefik https://traefik.github.io/charts
#   helm install traefik traefik/traefik \
#     --namespace traefik \
#     --create-namespace \
#     --values traefik-config.yaml

# ── Traefik Helm values ──
deployment:
  kind: Deployment
  replicas: 3

ingressClass:
  enabled: true
  isDefaultClass: true

ingressRoute:
  dashboard:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"

# TLS configuration
tls:
  enabled: true
  options:
    default:
      sniStrict: true
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
        - TLS_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# SSL passthrough (for services that handle TLS themselves)
sslPassthrough:
  enabled: true

# Entry points
ports:
  web:
    port: 80
    redirectTo: websecure
  websecure:
    port: 443
    tls:
      enabled: true
  # SSH passthrough for Git services
  ssh:
    port: 2222
    exposedPort: 22
    protocol: TCP

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Node affinity (run on all nodes)
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - "true"

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Logging
logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json
    fields:
      defaultmode: keep
      headers:
        defaultmode: drop
        names:
          Authorization: drop
          Cookie: drop
          Set-Cookie: drop
          X-Real-IP: keep
          X-Forwarded-For: keep
