---
# K3s Server Configuration — HA Mode (Embedded etcd)
# SCS-K3s Cluster: 3× Huawei RH2288E V2 (clrz14-06, clrz14-07, clrz14-08)
#
# This is a reference manifest. The cluster is already running K3s v1.36.3+k3s1.
# This file documents the actual configuration.
#
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 openDesk Edu Contributors

cluster:
  type: k3s
  version: v1.36.3+k3s1
  ha: true
  embeddedEtcd: true
  nodes: 3
  nodeNames:
    - clrz14-06  # control-plane
    - clrz14-07  # worker
    - clrz14-08  # worker

# K3s server configuration
server:
  clusterInit: true
  disable:
    - traefik      # HAProxy used instead
    - servicelb    # MetalLB used instead
    - local-storage  # Ceph-CSI used instead
  flannelBackend: vxlan
  containerRuntime: containerd

# Node labels
nodeLabels:
  node-role.kubernetes.io/control-plane: "true"  # clrz14-06
  node-role.kubernetes.io/worker: "true"          # clrz14-07, clrz14-08

# Pod Security Admission
podSecurity:
  enabled: true
  enforce: baseline
  audit: restricted
  warn: restricted

# Network policies
networkPolicies:
  enabled: true
  defaultDenyIngress: true
  allowEgress: true

# Existing infrastructure (already deployed)
existingComponents:
  ingress: haproxy          # v3.2.12, Helm, kube-system
  loadBalancer: metallb      # rz03-fip-pool, 172.25.3.181-196
  storage:
    - ceph-rbd              # RWO, rbd.csi.ceph.com
    - ceph-cephfs           # RWX, cephfs.csi.ceph.com
    - local-path            # default, rancher.io/local-path
  gitops: argocd            # ArgoCD, manages opendesk + opendesk-edu
  backup: k8up              # K8up backup operator, SeaweedFS
  monitoring: prometheus    # Prometheus + Grafana
