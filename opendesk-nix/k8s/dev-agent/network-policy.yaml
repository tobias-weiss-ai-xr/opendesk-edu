    de.container.gov.scope: "namespace"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  # Allow dev-agent-operator to monitor all pods
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: opendesk-operator
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: dev-agent-operator
          app.kubernetes.io/instance: dev-agent-operator
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 9443
---
