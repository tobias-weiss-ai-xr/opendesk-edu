# openDesk Dev Agent Operator Service Account
# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opendesk-dev-agent
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/instance: opendesk-dev-agent-operator
    app.kubernetes.io/version: "2.1.0"
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: opendesk
    app.kubernetes.io/managed-by: kustomize
    
    # openDesk specific
    opendesk.org/component: operator
    opendesk.org/purpose: self-healing
    opendesk.org/version: "2.1.0"
    
    # ZKI IT-Grundschutz
    de.zki.it-grundschutz.module: SY.3.4Kub
    de.zki.it-grundschutz.layer: Management
    
    # container.gov.de
    de.container.gov.component: opendesk-dev-agent-operator
---
# Image Pull Secrets for private registries
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-pull-secret
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/instance: opendesk-dev-agent-operator
    app.kubernetes.io/version: "2.1.0"
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: opendesk
  annotations:
    # Reference to the registry
    de.container.gov.registry: registry.gitlab.opencode.de
    opendesk.org.registry: registry.gitlab.opencode.de/umr
    opendesk.org.pull-secret: opencode-de-pat
    # Note: Create this secret manually with:
    # kubectl create secret docker-registry opendesk-dev-agent-pull-secret \
    #   --docker-server=registry.gitlab.opencode.de \
    #   --docker-username=oauth2 \
    #   --docker-password=<PAT> \
    #   --docker-email=user@example.com \
    #   -n opendesk-dev-agent
    kubernetes.io/description: "Docker registry credentials for opencode.de GitLab"
type: kubernetes.io/dockerconfigjson
data:
  # INTENTIONALLY LEFT EMPTY - will be created via kubectl or sealed-secrets
  # This is a security requirement - NEVER commit actual credentials
  # Use: kubectl create secret docker-registry ... (see annotation above)
  .dockerconfigjson: ""
