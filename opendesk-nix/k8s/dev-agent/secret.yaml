# openDesk Dev Agent Operator Secrets (Template)
# SPDX-License-Identifier: Apache-2.0
#
# ==============================================================================
# IMPORTANT: This file is a TEMPLATE only!
# 
# DO NOT commit secrets with actual sensitive data to version control!
# 
# To create the actual secret:
#   kubectl create secret generic opendesk-dev-agent-secrets \
#     --from-file=./secrets/opencode-de-pat \
#     --from-file=./secrets/pi-memory-credentials \
#     --from-literal=alert-slack-webhook=https://hooks.slack.com/... \
#     -n opendesk-dev-agent
#
# Or use sealed-secrets:
#   kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
# ==============================================================================
#
# This file contains placeholders for all possible secrets.
# Remove or comment out sections you don't need.
# ==============================================================================

---
# Main operator secrets
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-secrets
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/instance: opendesk-dev-agent-operator
    app.kubernetes.io/version: "2.1.0"
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: opendesk
    
    opendesk.org/secret-type: operator
    opendesk.org/component: operator
    
    de.zki.it-grundschutz.module: SY.3.4Kub
    de.container.gov.component: opendesk-dev-agent-operator
    de.container.gov.secret: "true"

type: Opaque

# STRING DATA (non-sensitive or base64-encoded placeholders)
stringData:
  # Operator configuration overrides
  operator-config: |
    # Override settings from config.yaml
    # Example:
    logging:
      level: "debug"
    rate_limiting:
      global:
        requests_per_second: 500

  # Alert configuration
  alert-config: |
    providers:
      - type: "email"
        smtp:
          host: "smtp.opendesk.svc"
          port: 587
          username: "operator@opendesk-edu.org"
        from: "operator@opendesk-edu.org"
        to: ["alerts@opendesk-edu.org"]
        severity: "warning"

---
# Container Registry Credentials for opencode.de
# Required for pulling images from GitLab Container Registry
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-pull-secret
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/instance: opendesk-dev-agent-operator
    app.kubernetes.io/component: operator
    
    opendesk.org/registry: "registry.gitlab.opencode.de"
    opendesk.org/secret-type: "docker-registry"
    
    de.container.gov.registry: "registry.gitlab.opencode.de"
    de.container.gov.secret: "container-registry"

# This secret MUST be created manually:
#
# Method 1: kubectl create secret docker-registry
#   kubectl create secret docker-registry opendesk-dev-agent-pull-secret \
#     --docker-server=registry.gitlab.opencode.de \
#     --docker-username=oauth2 \
#     --docker-password=<PERSONAL_ACCESS_TOKEN> \
#     --docker-email=user@example.com \
#     -n opendesk-dev-agent
#
# Method 2: kubectl apply with pre-encoded dockerconfigjson
#   echo '{"auths": {"registry.gitlab.opencode.de": {"auth": "$(echo -n 'oauth2:ABC123...' | base64 -w0)"}}}' | base64 -w0
type: kubernetes.io/dockerconfigjson
data:
  # INTENTIONALLY EMPTY - must be created manually
  # This is a security requirement
  .dockerconfigjson: ""

---
# PI Memory integration credentials
# Only needed if PI Memory is enabled
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-pi-memory-creds
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/instance: opendesk-dev-agent-operator
    app.kubernetes.io/component: operator
    
    opendesk.org/integration: "pi-memory"
    opendesk.org/secret-type: "credentials"
    
    de.zki.it-grundschutz.module: AI.4KI
    de.container.gov.component: opendesk-dev-agent-operator

type: Opaque
stringData:
  # Neo4j credentials for PI Memory knowledge base
  neo4j-username: "neo4j"
  neo4j-password: "CHANGE_ME"
  neo4j-uri: "bolt://pi-memory-neo4j.opendesk-dev-agent.svc:7687"
  neo4j-database: "neo4j"
  
  # PI Memory service endpoint
  pi-memory-endpoint: "http://pi-memory-service.opendesk-dev-agent.svc:8082"

data:
  # Base64-encoded credentials (optional)
  # Use: echo -n "value" | base64
  neo4j-password-b64: "Q0hBTkdFX01F"

---
# Kubeconfig for external cluster access (optional)
# Only needed if operator needs to access other clusters
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-external-kubeconfig
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/instance: opendesk-dev-agent-operator
    
    opendesk.org/secret-type: "kubeconfig"
    opendesk.org/purpose: "external-cluster-access"

type: Opaque
stringData:
  # External kubeconfig
  # External clusters can be defined here for multi-cluster management
  external-kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: external-cluster-1
        cluster:
          server: "https://external-api.example.com:6443"
          certificate-authority-data: "<CA_CERTIFICATE_BASE64>"
    users:
      - name: external-user-1
        user:
          token: "<BEARER_TOKEN>"
    contexts:
      - name: external-context-1
        context:
          cluster: external-cluster-1
          user: external-user-1
    current-context: external-context-1

---
# Alert provider credentials
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-alert-secrets
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/component: alerting
    
    opendesk.org/alert-system: "true"

type: Opaque
stringData:
  # Slack webhook URL (if using Slack alerts)
  slack-webhook-url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
  
  # Email configuration (if using email alerts)
  email-smtp-host: "smtp.opendesk.svc"
  email-smtp-port: "587"
  email-smtp-username: "operator@opendesk-edu.org"
  email-smtp-password: "CHANGE_ME"
  email-from: "operator@opendesk-edu.org"
  email-to: "alerts@opendesk-edu.org"
  
  # PagerDuty integration (optional)
  pagerduty-integration-key: "CHANGE_ME"
  
  # Opsgenie integration (optional)
  opsgenie-api-key: "CHANGE_ME"

data:
  # Base64-encoded sensitive fields (optional, for extra security)
  email-smtp-password-b64: "Q0hBTkdFX01F"
  slack-webhook-url-b64: ""
  pagerduty-integration-key-b64: ""

---
# TLS certificates for operator HTTPS (optional)
# Only needed if operator.enableTLS=true in config
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-tls-secret
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/component: tls
    
    opendesk.org/secret-type: "tls"

type: kubernetes.io/tls
stringData:
  # TLS certificate and key
  # Generate with:
  #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
  #     -keyout tls.key -out tls.crt -subj "/CN=opendesk-dev-agent.opendesk-dev-agent.svc"
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIIC... (base64-encoded certificate)
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    MIIE... (base64-encoded private key)
    -----END PRIVATE KEY-----

---
# Health check credentials for services (if auth is required)
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-health-check-creds
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/component: health-checks
    
    opendesk.org/secret-type: "health-checks"

type: Opaque
stringData:
  # Credentials for services that require authentication for health checks
  # Example: Basic auth for HTTP health checks
 # Format: username:password (not base64 encoded in stringData)
  
  keycloak-health-auth: "monitor:CHANGE_ME"
  nextcloud-health-auth: "healthcheck:CHANGE_ME"
  
  # Bearer tokens for API health checks
  keycloak-health-token: "CHANGE_ME"
  nextcloud-health-token: "CHANGE_ME"

data:
  # Base64-encoded if preferred
  keycloak-health-auth-b64: "bW9uaXRvcjpDSEFOR0VfMEU="

---
# External knowledge source credentials (for future PI Memory features)
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-knowledge-sources
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/component: knowledge
    
    opendesk.org/ai: "knowledge-sources"

type: Opaque
stringData:
  # External documentation sources
  docs-github-token: "ghp_CHANGE_ME"
  docs-gitlab-token: "glpat-CHANGE_ME"
  
  # External API documentation
  api-docs-url: "https://api.opendesk-edu.org/docs"
  api-docs-token: "CHANGE_ME"
  
  # Knowledge graph access
  knowledge-graph-endpoint: "https://knowledge.opendesk-edu.org/graphql"
  knowledge-graph-token: "CHANGE_ME"

---
# Security audit secret (optional)
apiVersion: v1
kind: Secret
metadata:
  name: opendesk-dev-agent-audit-secrets
  namespace: opendesk-dev-agent
  labels:
    app.kubernetes.io/name: opendesk-dev-agent
    app.kubernetes.io/component: security
    
    opendesk.org/audit: "true"

type: Opaque
stringData:
  # Audit webhook for security events
  audit-webhook-url: "https://audit.opendesk-edu.org/api/v1/events"
  audit-webhook-token: "CHANGE_ME"
  
  # Compliance reporting
  compliance-api-url: "https://compliance.opendesk-edu.org/api/v1"
  compliance-api-token: "CHANGE_ME"
