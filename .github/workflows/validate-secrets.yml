name: Validate Secrets

on:
  pull_request:
    paths:
      - "helmfile/environments/**/secrets.yaml"
      - "helmfile/environments/**/secrets.enc.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sops
        run: |
          curl -Lo sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x sops && sudo mv sops /usr/local/bin/

      - name: Verify secrets.enc.yaml is decryptable
        run: |
          echo "Verifying secrets.enc.yaml..."
          sops decrypt helmfile/environments/edu/secrets.enc.yaml > /dev/null 2>&1 && echo "✅ decryptable" || echo "❌ CORRUPTED"

      - name: Check secrets.yaml matches secrets.enc.yaml
        run: |
          DECRYPTED=$(sops decrypt helmfile/environments/edu/secrets.enc.yaml 2>/dev/null)
          PLAINTEXT=$(cat helmfile/environments/edu/secrets.yaml)
          if [ "$DECRYPTED" = "$PLAINTEXT" ]; then
            echo "✅ secrets.yaml matches secrets.enc.yaml"
          else
            echo "⚠️  secrets.yaml differs from secrets.enc.yaml"
            echo "   Run: sops encrypt helmfile/environments/edu/secrets.yaml > helmfile/environments/edu/secrets.enc.yaml"
          fi
