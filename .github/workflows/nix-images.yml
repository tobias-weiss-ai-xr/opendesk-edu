# =============================================================================
# Nix Images – build the opendesk-nix component images and push them to
# BOTH registries:
#   - registry.opencode.de/umr/opendesk-edu/containers   (primary, EU-sovereign)   [OPENCODE_TOKEN]
#   - ghcr.io/opendesk-edu       (public mirror)           [GITHUB_TOKEN]
#
# Public mirror strategy: registry.opencode.de is the source of truth; every
# tag (version + latest) is mirrored 1:1 to GHCR so clusters without access
# to opencode.de can pull anonymously. GHCR credentials come from
# GITHUB_TOKEN (no extra PAT) -> runs on ubuntu-latest, no self-hosted
# runner required.
#
# Manual mirror (without rebuilding): workflow_dispatch -> "Mirror only".
# =============================================================================

name: Nix Images

on:
  push:
    branches: [main]
    paths:
      - "opendesk-nix/**"
      - ".github/workflows/nix-images.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "build = build+push (default), mirror = opencode -> ghcr only"
        required: false
        default: "build"
        type: choice
        options: [build, mirror]

env:
  OPENCODE_REGISTRY: registry.opencode.de/umr/opendesk-edu/containers/opendesk-edu/containers
  GHCR_REGISTRY: ghcr.io/opendesk-edu
  GHCR_ORG: opendesk-edu
  OPENCODE_USER: weiss
  # optional: if absent, opencode steps are skipped and only GHCR is used
  OPENCODE_TOKEN: ${{ secrets.OPENCODE_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------
  # Mirror only: pull existing tags from opencode.de and re-push to GHCR.
  # ---------------------------------------------------------------------------
  mirror:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'mirror'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      OPENCODE_TOKEN: ${{ secrets.OPENCODE_TOKEN }}
    steps:
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # opencode.de is a PRIVATE project -> pull with the HRZ PAT (secret
      # OPENCODE_TOKEN, username tobias.weiss). Mirror still works for public
      # upstreams if the secret is absent (anonymous pull).
      - name: Mirror tags opencode.de -> ghcr.io
        run: |
          set -euxo pipefail
          SRC_CREDS=()
          [ -n "${{ env.OPENCODE_TOKEN }}" ] && SRC_CREDS=(--src-creds "tobias.weiss:${{ env.OPENCODE_TOKEN }}")
          for img in sogo sogo6 stalwart opencloud; do
            for tag in 5.12.10 0.16.17 7.2.2 latest; do
              if skopeo inspect "docker://${{ env.OPENCODE_REGISTRY }}/$img:$tag" >/dev/null 2>&1; then
                echo "== mirror $img:$tag"
                skopeo copy "${SRC_CREDS[@]}" \
                  --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
                  "docker://${{ env.OPENCODE_REGISTRY }}/$img:$tag" \
                  "docker://${{ env.GHCR_REGISTRY }}/$img:$tag"
              else
                echo "== skip $img:$tag (not on opencode)"
              fi
            done
          done

      # mark mirrored packages public on GHCR
      - name: Mark GHCR packages public
        continue-on-error: true
        run: |
          for pkg in sogo sogo6 stalwart opencloud; do
            code=$(curl -s -o /tmp/mirror-public-$pkg.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${{ env.GHCR_ORG }}/packages/container/$pkg/visibility" \
              -d '{"visibility":"public"}')
            echo "== ghcr.io/${{ env.GHCR_ORG }}/$pkg -> $code"
          done

  # ---------------------------------------------------------------------------
  # Build the Nix images and push to BOTH registries.
  # ---------------------------------------------------------------------------
  build:
    if: github.event_name == 'push' || !(github.event.inputs.mode == 'mirror')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build images with Nix
        run: |
          set -euxo pipefail
          cd opendesk-nix
          for d in sogo stalwart opencloud; do
            pkg="$d"
            [ "$d" = "sogo" ] && pkg="sogo6"
            ( cd "$d" && nix build ".#packages.x86_64-linux.$pkg" --no-link --print-out-paths )
          done

      - name: Load images into docker and tag
        run: |
          set -euxo pipefail
          cd opendesk-nix
          for d in sogo stalwart opencloud; do
            pkg="$d"
            [ "$d" = "sogo" ] && pkg="sogo6"
            ARCHIVE=$( cd "$d" && nix build ".#packages.x86_64-linux.$pkg" --no-link --print-out-paths | tail -1 )
            docker load -i "$ARCHIVE"
          done
          docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "^(sogo6|stalwart|opencloud):" | sort

      - name: Log in to registry.opencode.de
        if: env.OPENCODE_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: registry.opencode.de
          username: ${{ env.OPENCODE_USER }}
          password: ${{ env.OPENCODE_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to both registries (version + latest)
        run: |
          set -euxo pipefail
          # local-image|version|repo
          REGS="${{ env.GHCR_REGISTRY }}"
          [ -n "${{ env.OPENCODE_TOKEN }}" ] && REGS="${{ env.OPENCODE_REGISTRY }} $REGS"
          echo "== pushing to: $REGS"
          for entry in "sogo6|5.12.10|sogo" "sogo6|5.12.10|sogo6" "stalwart|0.16.17|stalwart" "opencloud|7.2.2|opencloud"; do
            IFS='|' read -r localimg tag repo <<< "$entry"
            for reg in $REGS; do
              for t in "$tag" latest; do
                docker tag "$localimg:$tag" "$reg/$repo:$t"
                docker push "$reg/$repo:$t"
              done
            done
          done

      # ---------------------------------------------------------------------
      # Public visibility on GHCR: mark each freshly pushed package public so
      # clusters can pull anonymously. Backstop: org default visibility should
      # be set to "public" in GitHub (Settings -> Packages) – then this step
      # is redundant but harmless.
      # ---------------------------------------------------------------------
      - name: Mark GHCR packages public
        continue-on-error: true
        run: |
          set -x
          for pkg in sogo sogo6 stalwart opencloud; do
            code=$(curl -s -o /tmp/ghcr-public-$pkg.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${{ env.GHCR_ORG }}/packages/container/$pkg/visibility" \
              -d '{"visibility":"public"}')
            echo "== ghcr.io/opendesk-edu/$pkg -> $code"
          done
