name: Validate Helmfile

on:
  push:
    branches: [main]
    paths:
      - "helmfile/**"
      - ".github/workflows/validate-helmfile.yml"
  pull_request:
    branches: [main]
    paths:
      - "helmfile/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          echo "=== Validating YAML ==="
          find helmfile/environments -name "*.yaml" -o -name "*.gotmpl" 2>/dev/null | while read f; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null && echo "  ✅ $f" || echo "  ❌ $f"
          done

      - name: Validate chart schemas
        run: |
          echo "=== Validating chart schemas ==="
          for chart in helmfile/charts/*/; do
            if [ -f "${chart}values.schema.json" ]; then
              python3 -c "
import json, yaml
schema = json.load(open('${chart}values.schema.json'))
values = yaml.safe_load(open('${chart}values.yaml'))
print(f'  ✅ ${chart}')
" 2>/dev/null || echo "  ❌ ${chart}"
            fi
          done

      - name: Check deprecated K8s APIs
        run: |
          echo "=== Checking deprecated APIs ==="
          if grep -rn "v1beta1\|v1beta2\|extensions/v1beta" helmfile/charts/ --include="*.yaml" --include="*.tpl" 2>/dev/null; then
            echo "❌ Found deprecated APIs!"
            exit 1
          else
            echo "  ✅ All APIs current"
          fi
