name: Validate Helmfile

on:
  push:
    branches: [main]
    paths:
      - "helmfile/**"
      - ".github/workflows/validate-helmfile.yml"
  pull_request:
    branches: [main]
    paths:
      - "helmfile/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          echo "=== Validating YAML ==="
          find helmfile/environments -name "*.yaml" -o -name "*.gotmpl" | while read f; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "OK: $f" || echo "FAIL: $f"
          done

      - name: Validate chart schemas
        run: |
          echo "=== Validating schemas ==="
          for chart in helmfile/charts/*/; do
            schema="${chart}values.schema.json"
            values="${chart}values.yaml"
            if [ -f "$schema" ] && [ -f "$values" ]; then
              python3 -c "import json,yaml; json.load(open('$schema')); yaml.safe_load(open('$values'))" && echo "OK: $chart" || echo "FAIL: $chart"
            fi
          done

      - name: Check deprecated K8s APIs
        run: |
          echo "=== Checking deprecated APIs ==="
          # Exclude: capability checks (_helpers.tpl), vendor charts, known false positives
          FILES=$(grep -rln "v1beta1\|v1beta2\|extensions/v1beta" helmfile/charts/ --include="*.yaml" --include="*.tpl" 2>/dev/null | grep -v "_helpers.tpl" | grep -v "vendor/" || true)
          if [ -n "$FILES" ]; then
            echo "❌ Found deprecated APIs in:"
            echo "$FILES"
            exit 1
          fi
          echo "  ✅ All APIs current"
