# =============================================================================
# Image Source Toggle for OpenDesk EDU
#
# This file lets you toggle all container image sources between:
#   1. ghcr.io (GitHub Container Registry - default, upstream)
#   2. registry.gitlab.opencode.de/umr (opencode.de GitLab CR - mirror)
#   3. zot-registry.opendesk.svc:5000 (local Zot cache - pull-through)
#
# Usage with helmfile:
#   helmfile --environment edu apply --set imageSource=opencode
#   helmfile --environment edu apply --set imageSource=ghcr
#   helmfile --environment edu apply --set imageSource=zot
#
# Or with ArgoCD:
#   kubectl apply -f image-source-toggle.yaml
#
# Or override per-deployment:
#   Set image.registry and image.repository in values
# =============================================================================

# =============================================================================
# Option 1: GHCR (GitHub Container Registry) — DEFAULT
# =============================================================================
# All images pulled directly from ghcr.io/opendesk-edu/*
# Requires: DNS resolution for ghcr.io, internet access
# Best for: development, CI/CD, when GHCR is accessible

imageSource: ghcr

images:
  # --- Core Services ---
  postgresql:
    registry: ghcr.io
    repository: opendesk-edu/postgresql
    tag: latest

  memcached:
    registry: ghcr.io
    repository: opendesk-edu/memcached
    tag: latest

  keycloak:
    registry: ghcr.io
    repository: opendesk-edu/supplier/univention/keycloak
    tag: "26.7.0"

  # --- OpenDesk EDU Core Apps ---
  sogo:
    registry: ghcr.io
    repository: opendesk-edu/sogo
    tag: latest

  stalwart:
    registry: ghcr.io
    repository: opendesk-edu/stalwart
    tag: latest

  opencloud:
    registry: ghcr.io
    repository: opendesk-edu/opencloud
    tag: "4.0.3"

  # --- Additional EDU Apps ---
  bookstack:
    registry: ghcr.io
    repository: opendesk-edu/bookstack
    tag: latest

  drawio:
    registry: ghcr.io
    repository: opendesk-edu/drawio
    tag: latest

  excalidraw:
    registry: ghcr.io
    repository: opendesk-edu/excalidraw
    tag: latest

  planka:
    registry: ghcr.io
    repository: opendesk-edu/planka
    tag: latest

  self-service-password:
    registry: ghcr.io
    repository: opendesk-edu/self-service-password
    tag: latest

  user-import:
    registry: ghcr.io
    repository: opendesk-edu/user-import
    tag: latest

  opendesk-dev-agent-operator:
    registry: ghcr.io
    repository: opendesk-edu/opendesk-dev-agent-operator
    tag: latest

  moodle-shib:
    registry: ghcr.io
    repository: opendesk-edu/moodle-shib
    tag: latest

  ilias-shibboleth:
    registry: ghcr.io
    repository: opendesk-edu/ilias-shibboleth
    tag: latest

  ilias:
    registry: ghcr.io
    repository: opendesk-edu/ilias
    tag: latest

  moodle:
    registry: ghcr.io
    repository: opendesk-edu/moodle
    tag: latest

  collabora:
    registry: ghcr.io
    repository: opendesk-edu/collabora
    tag: latest

  clamav:
    registry: ghcr.io
    repository: opendesk-edu/clamav
    tag: latest

  etherpad:
    registry: ghcr.io
    repository: opendesk-edu/etherpad
    tag: "1.9.9"

  element:
    registry: ghcr.io
    repository: opendesk-edu/element
    tag: latest

  mariadb:
    registry: ghcr.io
    repository: opendesk-edu/mariadb
    tag: latest

  redis:
    registry: ghcr.io
    repository: opendesk-edu/redis
    tag: latest

  snipr:
    registry: ghcr.io
    repository: tobias-weiss-ai-xr/snipr
    tag: latest

  # --- Infrastructure ---
  zot:
    registry: ghcr.io
    repository: project-zot/zot
    tag: "v2.1.0"

