# =============================================================================
# Image Source Toggle for OpenDesk EDU
#
# This file lets you toggle all container image sources between:
#   1. registry.opencode.de/umr (opencode.de container registry - DEFAULT)
#   2. ghcr.io (GitHub Container Registry - mirror, fallback)
#   3. zot-registry.opendesk.svc:5000 (local Zot cache - pull-through)
#
# Usage with helmfile:
#   helmfile --environment edu apply --set imageSource=opencode
#   helmfile --environment edu apply --set imageSource=ghcr
#   helmfile --environment edu apply --set imageSource=zot
#
# Or with ArgoCD:
#   kubectl apply -f image-source-toggle.yaml
#
# Or override per-deployment:
#   Set image.registry and image.repository in values
#
# NOTE (2026-08-22): openDesk Edu images are now built with Nix and pushed
# to registry.opencode.de/umr (see opendesk-nix/ for the image flakes).
# registry.opencode.de is therefore the DEFAULT source.
# =============================================================================

# =============================================================================
# Option 1: registry.opencode.de (opencode.de container registry) — DEFAULT
# =============================================================================
# All images pulled from registry.opencode.de/umr/*
# Images are Nix-built (opendesk-nix/**) and pushed via push-to-opencode.sh
# Requires: OPENCODE_TOKEN / registry pull secret
# Best for: production, air-gapped, sovereign operation

imageSource: opencode

images:
  # --- Core Services ---
  postgresql:
    registry: registry.opencode.de
    repository: umr/postgresql
    tag: latest

  memcached:
    registry: registry.opencode.de
    repository: umr/memcached
    tag: latest

  keycloak:
    registry: registry.opencode.de
    repository: umr/keycloak
    tag: "26.7.0"

  # --- OpenDesk EDU Core Apps ---
  sogo:
    registry: registry.opencode.de
    repository: umr/sogo
    tag: latest

  stalwart:
    registry: registry.opencode.de
    repository: umr/stalwart
    tag: latest

  opencloud:
    registry: registry.opencode.de
    repository: umr/opencloud
    tag: "4.0.3"

  # --- Additional EDU Apps ---
  bookstack:
    registry: registry.opencode.de
    repository: umr/bookstack
    tag: latest

  drawio:
    registry: registry.opencode.de
    repository: umr/drawio
    tag: latest

  excalidraw:
    registry: registry.opencode.de
    repository: umr/excalidraw
    tag: latest

  planka:
    registry: registry.opencode.de
    repository: umr/planka
    tag: latest

  self-service-password:
    registry: registry.opencode.de
    repository: umr/self-service-password
    tag: latest

  user-import:
    registry: registry.opencode.de
    repository: umr/user-import
    tag: latest

  opendesk-dev-agent-operator:
    registry: registry.opencode.de
    # published from github.com/tobias-weiss-ai-xr/opendesk-dev-agent-operator
    # Tag convention (upstream + umr): branch tag, not latest
    repository: umr/opendesk-dev-agent-operator
    tag: main

  moodle-shib:
    registry: registry.opencode.de
    repository: umr/moodle-shib
    tag: latest

  ilias-shibboleth:
    registry: registry.opencode.de
    repository: umr/ilias-shibboleth
    tag: latest

  ilias:
    registry: registry.opencode.de
    repository: umr/ilias
    tag: latest

  moodle:
    registry: registry.opencode.de
    repository: umr/moodle
    tag: latest

  collabora:
    registry: registry.opencode.de
    repository: umr/collabora
    tag: latest

  clamav:
    registry: registry.opencode.de
    repository: umr/clamav
    tag: latest

  etherpad:
    registry: registry.opencode.de
    repository: umr/etherpad
    tag: "1.9.9"

  element:
    registry: registry.opencode.de
    repository: umr/element
    tag: latest

  mariadb:
    registry: registry.opencode.de
    repository: umr/mariadb
    tag: latest

  redis:
    registry: registry.opencode.de
    repository: umr/redis
    tag: latest

  snipr:
    registry: registry.opencode.de
    repository: umr/snipr
    tag: latest

  # --- Infrastructure ---
  zot:
    registry: registry.opencode.de
    repository: umr/zot-registry
    tag: latest

