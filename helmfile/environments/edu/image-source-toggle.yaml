# =============================================================================
# Option 3: Local Zot Registry — PULL-THROUGH CACHE
# =============================================================================
# All images pulled from zot-registry.opendesk.svc:5000
# Requires: Zot registry deployed with pull-through cache configured
# Best for: air-gapped clusters, when no external registry is accessible
#
# To use this option, uncomment the block below and comment out the opencode block above:
#
# imageSource: zot
#
# images:
#   postgresql:
#     registry: zot-registry.opendesk.svc:5000
#     repository: umr/postgresql
#     tag: latest
#
#   memcached:
#     registry: zot-registry.opendesk.svc:5000
#     repository: umr/memcached
#     tag: latest
#
#   keycloak:
#     registry: zot-registry.opendesk.svc:5000
#     repository: umr/keycloak
#     tag: "26.7.0"
