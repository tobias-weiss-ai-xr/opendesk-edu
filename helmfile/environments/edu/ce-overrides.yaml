            saml.authnstatement: "true"
            saml_name_id_format: "persistent"
            frontchannel.logout.url: "https://moodle.opendesk.hrz.uni-marburg.de/Shibboleth.sso/Logout"
          protocolMappers:
            - name: "email"
              protocol: "saml"
