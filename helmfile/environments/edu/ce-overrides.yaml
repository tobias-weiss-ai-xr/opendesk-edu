# =============================================================================
# RESOURCE OVERRIDES
# Fix insane default CPU limits in upstream Nubus chart (288 CPU per container).
# The Nubus chart uses YAML anchors (&nubusDevelopmentResources) that set
# limits.cpu: 288 for ALL components by default. These overrides ensure
# sensible resource limits are applied instead.
# =============================================================================
resources:
  # === UMS / Nubus Core ===
  umsKeycloak:
    limits:
      cpu: 2
      memory: "2Gi"
    requests:
      cpu: 0.1
      memory: "512Mi"
  umsKeycloakBootstrap:
    limits:
      cpu: 2
      memory: "512Mi"
    requests:
      cpu: 0.1
      memory: "256Mi"
  umsKeycloakExtensionHandler:
