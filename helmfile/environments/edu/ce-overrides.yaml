# Helmfile state values that override CE defaults
# These are injected via --values when running CE's helmfile
# They override CE's default environment values

apps:
  # Disable CE apps that edu replaces or conflicts with
  oxAppSuite:
    enabled: false              # edu uses SOGo instead of OX
  nextcloud:
    enabled: false              # edu uses OpenCloud instead
  seaweedfs:
    enabled: false              # edu has its own seaweedfs deployment
  dovecot:
    enabled: false              # Stalwart replaces Dovecot
  # SMTP relay selection: "stalwart" or "postfix"
  # Stalwart handles inbound mail. For outbound (service notifications),
  # either Stalwart or Postfix can relay. Stalwart is recommended.
  smtpRelay: stalwart
  postfix:
    enabled: "false"
    # Postfix stays as SMTP relay for services
  # Keep nubus (UMS + Keycloak) but disable its embedded intercom-service
  # edu deploys its own intercom-service (forked chart with edu-specific fixes)
  nubus:
    intercomServiceEnabled: false
  # Enable SOGo (edu replaces OX with SOGo)
  sogo:
    enabled: true
  opencloud:
    enabled: true               # OpenCloud replaces Nextcloud
  # Edu-specific apps
  bigbluebutton:
    enabled: false
  intercom:
    enabled: true
  grommunio:
    enabled: true               # Alternative groupware, not first-class
  semesterProvisioning:
    enabled: true
  stalwart:
    enabled: true
  bookstack:
    enabled: false
  codeServer:
    enabled: false
  collabDashboard:
    enabled: false
  dask:
    enabled: false
  drawio:
    enabled: false
  etherpad:
    enabled: false
  excalidraw:
    enabled: false
  f13:
    enabled: false
  ilias:
    enabled: true
  jupyterhub:
    enabled: false
  kasmvnc:
    enabled: false
  limesurvey:
    enabled: false
  mariadb:
    enabled: false
  ollama:
    enabled: false
  openWebui:
    enabled: false
  overleaf:
    enabled: false
  planka:
    enabled: true
  rstudio:
    enabled: false
  selfServicePassword:
    enabled: false
  slidev:
    enabled: false
  snipr:
    enabled: false
  ttyd:
    enabled: false
  typo3:
    enabled: false
  zammad:
    enabled: false


# Edu-specific global config

# Chart versions for components that need explicit versioning
charts:
  codeServer:
    version: "4.99.2"
  dask:
    version: "2024.12.0"
  jupyterhub:
    version: "3.3.8"

# App-specific overrides (merged per app)
ilias: {}
mariadb: {}


global:
  domain: opendesk.hrz.uni-marburg.de
  mail_domain: uni-marburg.de
  hosts:
    keycloak: portal
    opencloud: files
    stalwart: mail
    sogo: contacts
  
platform:
  realm: opendesk

# CE Keycloak bootstrap — inject edu OIDC + SAML clients via CE's custom clients mechanism
# CE reads functional.authentication.oidc.clients and injects into config.custom.clients
functional:
  authentication:
    oidc:
      clientScopes:
        opendesk-opencloud-scope:
          name: "opendesk-opencloud-scope"
          protocol: "openid-connect"
          protocolMappers:
            - name: "opendesk-opencloud-uuid"
              protocol: "openid-connect"
              protocolMapper: "oidc-usermodel-attribute-mapper"
              consentRequired: false
              config:
                user.attribute: "uid"
                claim.name: "opendesk_useruuid"
                claim.value: "uid"
                id.token.claim: "true"
                access.token.claim: "true"
                userinfo.token.claim: "true"
            - name: "opendesk-opencloud-username"
              protocol: "openid-connect"
              protocolMapper: "oidc-usermodel-attribute-mapper"
              consentRequired: false
              config:
                user.attribute: "uid"
                claim.name: "preferred_username"
                claim.value: "uid"
                id.token.claim: "true"
                access.token.claim: "true"
                userinfo.token.claim: "true"
            - name: "opendesk-opencloud-email"
              protocol: "openid-connect"
              protocolMapper: "oidc-usermodel-attribute-mapper"
              consentRequired: false
              config:
                user.attribute: "mail"
                claim.name: "email"
                claim.value: "mail"
                id.token.claim: "true"
                access.token.claim: "true"
                userinfo.token.claim: "true"
      clients:
        - name: "opendesk-opencloud"
          clientId: "opendesk-opencloud"
          protocol: "openid-connect"
          clientAuthenticatorType: "client-secret"
          secret: "2dc8959a6956838c7d50f19c3e17989f2343098fa87f82381d15ffa89b08e577"
          redirectUris:
            - "https://files.opendesk.hrz.uni-marburg.de/*"
            - "https://portal.opendesk.hrz.uni-marburg.de/*"
          consentRequired: false
          frontchannelLogout: true
          publicClient: false
          authorizationServicesEnabled: false
          attributes:
            backchannel.logout.session.required: true
            backchannel.logout.url: "https://files.opendesk.hrz.uni-marburg.de/backchannel_logout"
            post.logout.redirect.uris: "https://files.opendesk.hrz.uni-marburg.de/*##https://portal.opendesk.hrz.uni-marburg.de/*"
          defaultClientScopes:
            - "opendesk-opencloud-scope"
        - name: "stalwart"
          clientId: "stalwart"
          protocol: "openid-connect"
          clientAuthenticatorType: "client-secret"
          secret: "4a312df6bfb2c74cd73e895a09818ca2e58f51a1c1b5db906224780542c97b85"
          redirectUris:
            - "https://mail.opendesk.hrz.uni-marburg.de/*"
            - "https://portal.opendesk.hrz.uni-marburg.de/*"
          consentRequired: false
          frontchannelLogout: true
          publicClient: false
          authorizationServicesEnabled: false
          attributes:
            backchannel.logout.session.required: true
            post.logout.redirect.uris: "https://mail.opendesk.hrz.uni-marburg.de/*##https://portal.opendesk.hrz.uni-marburg.de/*"
          defaultClientScopes:
            - "openid"
            - "profile"
            - "email"
        - name: "ilias-saml"
          clientId: "ilias-saml"
          protocol: "saml"
          clientAuthenticatorType: "client-secret"
          secret: "2dc8959a6956838c7d50f19c3e17989f2343098fa87f82381d15ffa89b08e577"
          redirectUris:
            - "https://lms.opendesk.hrz.uni-marburg.de/*"
          rootUrl: "https://lms.opendesk.hrz.uni-marburg.de"
          adminUrl: "https://lms.opendesk.hrz.uni-marburg.de"
          consentRequired: false
          frontchannelLogout: true
          publicClient: false
          authorizationServicesEnabled: false
          attributes:
            saml.assertion.signature: "false"
            saml.force.post.binding: "true"
            saml.multivalued.roles: "false"
            saml.encrypt: "false"
            saml.server.signature: "true"
            saml.server.signature.keyinfo.ext: "false"
            saml.client.signature: "false"
            saml.authnstatement: "true"
            saml_name_id_format: "persistent"
            frontchannel.logout.url: "https://lms.opendesk.hrz.uni-marburg.de/Shibboleth.sso/Logout"
          protocolMappers:
            - name: "email"
              protocol: "saml"
