{{- if .Values.networkPolicies.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mayan-edms.fullname" . }}-ingress
  labels:
    {{- include "mayan-edms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mayan-edms.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.networkPolicies.ingress }}
    - from:
        {{- toYaml .from | nindent 10 }}
      ports:
        {{- toYaml .ports | nindent 10 }}
    {{- end -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mayan-edms.fullname" . }}-egress
  labels:
    {{- include "mayan-edms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mayan-edms.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow outbound to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    # Allow outbound to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    # Allow outbound to SeaweedFS
    - to:
        - podSelector:
            matchLabels:
              app: seaweedfs
      ports:
        - port: 8333
          protocol: TCP
    # Allow outbound to Stalwart (SMTP)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stalwart
      ports:
        - port: 587
          protocol: TCP
    # Allow outbound to DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end -}}
