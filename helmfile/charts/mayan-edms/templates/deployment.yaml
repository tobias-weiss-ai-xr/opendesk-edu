apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mayan-edms.fullname" . }}
  labels:
    {{- include "mayan-edms.labels" . | nindent 4 }}
  annotations:
    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mayan-edms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mayan-edms.selectorLabels" . | nindent 8 }}
        deployStage: "050-components"
        component: "mayan-edms"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mayan-edms.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- toYaml .Values.hostAliases | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MAYAN_DATABASE_ENGINE
              value: "django.db.backends.postgresql"
            - name: MAYAN_DATABASE_NAME
              value: {{ .Values.mayan.database.name | quote }}
            - name: MAYAN_DATABASE_USER
              value: {{ .Values.mayan.database.user | quote }}
            - name: MAYAN_DATABASE_HOST
              value: {{ .Values.mayan.database.host | quote }}
            - name: MAYAN_DATABASE_PORT
              value: {{ .Values.mayan.database.port | toString | quote }}
            - name: MAYAN_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mayan-edms.databaseSecret" . }}
                  key: {{ .Values.mayan.database.existingSecretPasswordKey | default "postgresql-password" }}
            - name: MAYAN_REDIS_URL
              value: "redis://:$(MAYAN_REDIS_PASSWORD)@{{ .Values.mayan.redis.host }}:{{ .Values.mayan.redis.port }}/0"
            - name: MAYAN_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mayan-edms.redisSecret" . }}
                  key: {{ .Values.mayan.redis.existingSecretPasswordKey | default "redis-password" }}
            - name: MAYAN_CACHE_BACKEND
              value: "django_redis.cache.RedisCache"
            - name: MAYAN_CACHE_REDIS_URL
              value: "redis://:$(MAYAN_REDIS_PASSWORD)@{{ .Values.mayan.redis.host }}:{{ .Values.mayan.redis.port }}/1"
            - name: MAYAN_CELAERY_BROKER_URL
              value: "redis://:$(MAYAN_REDIS_PASSWORD)@{{ .Values.mayan.redis.host }}:{{ .Values.mayan.redis.port }}/2"
            - name: MAYAN_CELAERY_RESULT_BACKEND
              value: "redis://:$(MAYAN_REDIS_PASSWORD)@{{ .Values.mayan.redis.host }}:{{ .Values.mayan.redis.port }}/3"
            - name: MAYAN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mayan-edms.oidcSecret" . }}
                  key: "secret-key"
            {{- if .Values.mayan.oidc.enabled }}
            - name: MAYAN_AUTHENTICATION_BACKENDS
              value: "mayan.apps.authentication.backends.openidconnect.OpenIDConnect;mayan.apps.authentication.backends.model_backend.ModelBackend"
            - name: SOCIAL_AUTH_OPENIDCONNECT_KEY
              value: {{ .Values.mayan.oidc.clientId | quote }}
            - name: SOCIAL_AUTH_OPENIDCONNECT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mayan-edms.oidcSecret" . }}
                  key: {{ .Values.mayan.oidc.existingSecretClientSecretKey | default "client-secret" }}
            - name: SOCIAL_AUTH_OPENIDCONNECT_OIDC_ENDPOINT
              value: {{ printf "%s/.well-known/openid-configuration" .Values.mayan.oidc.issuer | quote }}
            - name: SOCIAL_AUTH_OPENIDCONNECT_STORAGE_CLASS
              value: "DjangoStorage"
            - name: MAYAN_OIDC_ENABLED
              value: "True"
            {{- end }}
            {{- if .Values.mayan.email.enabled }}
            - name: MAYAN_EMAIL_BACKEND
              value: "django.core.mail.backends.smtp.EmailBackend"
            - name: MAYAN_EMAIL_HOST
              value: {{ .Values.mayan.email.host | quote }}
            - name: MAYAN_EMAIL_PORT
              value: {{ .Values.mayan.email.port | toString | quote }}
            - name: MAYAN_EMAIL_USE_TLS
              value: {{ .Values.mayan.email.useTls | toString | quote }}
            - name: MAYAN_EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mayan-edms.emailSecret" . }}
                  key: "username"
            - name: MAYAN_EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mayan-edms.emailSecret" . }}
                  key: "password"
            - name: MAYAN_EMAIL_DEFAULT_FROM
              value: {{ .Values.mayan.email.defaultFrom | quote }}
            {{- end }}
            {{- if .Values.mayan.ocr.enabled }}
            - name: MAYAN_OCR_AUTOMATIC_UPLOAD
              value: "True"
            - name: MAYAN_OCR_PAGE_AUTOROTATE
              value: {{ .Values.mayan.ocr.autoRotatePages | toString | quote }}
            {{- end }}
            {{- if .Values.mayan.tesseract.enabled }}
            - name: MAYAN_OCR_BACKEND
              value: "tesseract"
            - name: MAYAN_OCR_LANGUAGE
              value: {{ .Values.mayan.ocr.language | quote }}
            {{- end }}
            - name: MAYAN_TESSERACT_ENABLED
              value: {{ .Values.mayan.tesseract.enabled | toString | quote }}
            - name: MAYAN_TESSERACT_LANGUAGES
              value: {{ .Values.mayan.tesseract.languages | quote }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "mayan-edms.fullname" . }}-config
          volumeMounts:
            - name: data
              mountPath: /var/lib/mayan
            - name: media
              mountPath: /var/lib/mayan/media
            - name: index
              mountPath: /var/lib/mayan/index
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mayan-edms.fullname" . }}-data
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "mayan-edms.fullname" . }}-media
        - name: index
          persistentVolumeClaim:
            claimName: {{ include "mayan-edms.fullname" . }}-index
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
