apiVersion: v2
name: mayan-edms
description: A Helm chart for Mayan EDMS - Free Open Source Document Management System
type: application
version: 1.0.0
appVersion: "4.5.0"
annotations:
  artifacthub.io/changes: |
    - Initial Mayan EDMS Helm chart for openDesk Edu
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/mayan-edms/mayan-edms
    - name: Documentation
      url: https://docs.mayan-edms.com
  artifacthub.io/recommendations: |
    - url: https://github.com/paperless-ngx/paperless-ngx
      name: Paperless-ngx (complementary document archiving)
dependencies:
  - name: postgresql
    version: 12.x.x
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: 18.x.x
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
