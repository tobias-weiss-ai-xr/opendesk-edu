{{- if .Values.stalwart.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stalwart.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  annotations:
    {{- range $key, $value := .Values.stalwart.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.stalwart.ingress.ingressClassName }}
  {{- if .Values.stalwart.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.stalwart.ingress.hostname }}
      secretName: {{ .Values.stalwart.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.stalwart.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stalwart.fullname" . }}
                port:
                  number: 8080
{{- end }}
