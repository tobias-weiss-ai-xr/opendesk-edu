apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stalwart.configmap" . }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
data:
  config.toml: |
    # Stalwart Mail Server Configuration
    # Generated by Helm - do not edit directly

    {{- range $name, $listener := .Values.stalwart.listeners }}
    [server.listener.{{ $name }}]
    bind = [{{ $listener.bind | quote }}]
    protocol = {{ $listener.protocol | quote }}
    {{- if $listener.tls }}
    {{- if $listener.tls.implicit }}
    tls.implicit = true
    {{- end }}
    {{- end }}
    {{- if and $.Values.stalwart.tls.enabled $.Values.stalwart.tls.certificate.certPath (or (eq $name "submissions") (eq $name "imaptls") (eq $name "pop3s")) }}
    tls.certificate = {{ $.Values.stalwart.tls.certificate.certPath | quote }}
    tls.private-key = {{ $.Values.stalwart.tls.certificate.keyPath | quote }}
    {{- end }}
    {{- end }}

    [storage.data]
    type = {{ .Values.stalwart.storage.type | quote }}
    path = {{ .Values.stalwart.storage.dataPath | quote }}

    {{- if .Values.stalwart.storage.blob.path }}
    [storage.blob]
    type = {{ .Values.stalwart.storage.blob.type | quote }}
    path = {{ .Values.stalwart.storage.blob.path | quote }}
    {{- end }}

    [directory.{{ .Values.stalwart.directory.type }}]
    type = {{ .Values.stalwart.directory.type | quote }}

    {{- if eq .Values.stalwart.directory.type "ldap" }}
    host = {{ .Values.stalwart.directory.ldap.host | quote }}
    port = {{ .Values.stalwart.directory.ldap.port }}
    base-dn = {{ .Values.stalwart.directory.ldap.baseDn | quote }}
    bind-dn = {{ .Values.stalwart.directory.ldap.bindDn | quote }}
    {{- if .Values.stalwart.directory.ldap.tls.enabled }}
    tls = true
    {{- end }}
    {{- end }}

    {{- if .Values.stalwart.auth.oidc.enabled }}
    [auth.oauth]
    enable = true
    issuer = {{ .Values.stalwart.auth.oidc.issuerUrl | quote }}
    client-id = {{ .Values.stalwart.auth.oidc.clientId | quote }}
    client-secret = {{ .Values.stalwart.auth.oidc.clientSecret | quote }}
    scope = {{ .Values.stalwart.auth.oidc.scope | quote }}
    {{- end }}

    [auth.fallback-admin]
    user = {{ .Values.stalwart.auth.fallbackAdmin.username | quote }}
    pass = {{ .Values.stalwart.auth.fallbackAdmin.passwordHash | quote }}
    {{- if .Values.stalwart.auth.fallbackAdmin.description }}
    description = {{ .Values.stalwart.auth.fallbackAdmin.description | quote }}
    {{- end }}

    [logging]
    type = {{ .Values.stalwart.logging.type | quote }}
    level = {{ .Values.stalwart.logging.level | quote }}
    path = {{ .Values.stalwart.logging.path | quote }}
    {{- if .Values.stalwart.logging.retentionDays }}
    retention = {{ .Values.stalwart.logging.retentionDays }}
    {{- end }}

    {{- if .Values.stalwart.rateLimit.enabled }}
    [rate-limit]
    max-messages-per-session = {{ .Values.stalwart.rateLimit.maxMessagesPerSession | quote }}
    max-recipients-per-message = {{ .Values.stalwart.rateLimit.maxRecipientsPerMessage | quote }}
    max-connections-per-ip = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | quote }}
    {{- end }}
