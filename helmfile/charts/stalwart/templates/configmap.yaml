apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stalwart.configmap" . }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
data:
  config.json: |
    {{ .Values.stalwart.configJson | default "{\"@type\":\"RocksDb\",\"path\":\"/var/lib/stalwart/data\"}" | nindent 4 }}
