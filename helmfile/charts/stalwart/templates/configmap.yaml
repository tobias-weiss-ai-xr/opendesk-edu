apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stalwart.configmap" . }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
data:
  config.toml: |
    # Stalwart Mail Server Configuration
    # Generated by Helm - do not edit directly
    
    [server]
    name = "{{ .Values.stalwart.serverName | default "opendesk-mail" }}"
    
    # SMTP listener (port 25)
    [server.listener.smtp]
    bind = "0.0.0.0:25"
    protocol = "smtp"
    
    # Submission listener (port 587)
    [server.listener.submission]
    bind = "0.0.0.0:587"
    protocol = "smtp"
    
    # Submissions listener (port 465, implicit TLS)
    [server.listener.submissions]
    bind = "0.0.0.0:465"
    protocol = "smtp"
    tls.implicit = true
    
    # IMAP listener (port 143)
    [server.listener.imap]
    bind = "0.0.0.0:143"
    protocol = "imap"
    
    # IMAPS listener (port 993, implicit TLS)
    [server.listener.imaptls]
    bind = "0.0.0.0:993"
    protocol = "imap"
    tls.implicit = true
    
    # POP3 listener (port 110)
    [server.listener.pop3]
    bind = "0.0.0.0:110"
    protocol = "pop3"
    
    # POP3S listener (port 995, implicit TLS)
    [server.listener.pop3s]
    bind = "0.0.0.0:995"
    protocol = "pop3"
    tls.implicit = true
    
    # ManageSieve listener (port 4190)
    [server.listener.sieve]
    bind = "0.0.0.0:4190"
    protocol = "managesieve"
    
    # HTTP admin API listener (port 8080)
    [server.listener.http]
    bind = "0.0.0.0:8080"
    protocol = "http"
    
    # Storage backends
    [storage]
    data = "{{ .Values.stalwart.storage.type | default "rocksdb" }}"
    fts = "{{ .Values.stalwart.storage.type | default "rocksdb" }}"
    blob = "{{ .Values.stalwart.storage.blob.type | default "rocksdb" }}"
    lookup = "{{ .Values.stalwart.storage.type | default "rocksdb" }}"
    directory = "internal"
    
    # RocksDB store configuration
    [store.rocksdb]
    type = "rocksdb"
    path = "{{ .Values.stalwart.storage.dataPath | default "/opt/stalwart-mail/data" }}"
    compression = "lz4"
    
    # Internal directory
    [directory.internal]
    type = "internal"
    store = "rocksdb"
    
    # OIDC authentication
    [auth.oauth2]
    enabled = true
    issuer = "{{ .Values.stalwart.auth.oidc.issuerUrl | default "https://id.opendesk.hrz.uni-marburg.de/realms/opendesk" }}"
    client-id = "{{ .Values.stalwart.auth.oidc.clientId | default "stalwart" }}"
    client-secret = "{{ .Values.stalwart.auth.oidc.clientSecret | default "" }}"
    client-auth-method = "client_secret_basic"
    scope = ["{{ .Values.stalwart.auth.oidc.scope | default "openid profile email" }}"]
    
    # Fallback admin account
    [auth.fallback-admin]
    user = "{{ .Values.stalwart.auth.fallbackAdmin.username | default "admin" }}"
    secret = "{{ .Values.stalwart.auth.fallbackAdmin.passwordHash | default "" }}"
    description = "Stalwart Mail Server Administrator"
    
    # Logging to file (daily rotation)
    [tracer.log]
    type = "log"
    level = "{{ .Values.stalwart.logging.level | default "info" }}"
    path = "{{ .Values.stalwart.logging.path | default "/opt/stalwart-mail/logs" }}"
    prefix = "stalwart.log"
    rotate = "daily"
    ansi = false
    enable = true
    
    # Logging to stdout (visible in kubectl logs)
    [tracer.stdout]
    type = "stdout"
    level = "{{ .Values.stalwart.logging.level | default "info" }}"
    enable = true
