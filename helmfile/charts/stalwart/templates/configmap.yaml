apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stalwart.configmap" . }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
data:
  config.toml: |
    # Stalwart Mail Server v0.11 Configuration
    # Generated by Helm - do not edit directly
    
    [server]
    name = "{{ .Values.stalwart.serverName | default "opendesk-mail" }}"
    
    [server.listener]
    {{- /* SMTP */}}
    "0.0.0.0:25" = { 
      protocol = "smtp"
      {{- if .Values.stalwart.listeners.smtp.requireAuthentication }}
      , require-authentication = true
      {{- end }}
      {{- if .Values.stalwart.rateLimit.enabled }}
      , max-connections = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 100 }}
      {{- end }}
    }
    {{- /* Submission (port 587) */}}
    "0.0.0.0:587" = { 
      protocol = "smtp"
      , require-authentication = true
      {{- if .Values.stalwart.rateLimit.enabled }}
      , max-connections = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 100 }}
      {{- end }}
    }
    {{- /* Submissions (port 465 - implicit TLS) */}}
    "0.0.0.0:465" = { 
      protocol = "smtp"
      , require-authentication = true
      , tls = { implicit = true }
      {{- if .Values.stalwart.tls.enabled }}
      , tls.certificate = "{{ .Values.stalwart.tls.certificate.certPath | default "/etc/ssl/certs/tls.crt" }}"
      , tls.private-key = "{{ .Values.stalwart.tls.certificate.keyPath | default "/etc/ssl/private/tls.key" }}"
      {{- end }}
      {{- if .Values.stalwart.rateLimit.enabled }}
      , max-connections = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 100 }}
      {{- end }}
    }
    {{- /* IMAP */}}
    "0.0.0.0:143" = { 
      protocol = "imap"
      {{- if .Values.stalwart.rateLimit.enabled }}
      , max-connections = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 100 }}
      {{- end }}
    }
    {{- /* IMAPS (port 993 - implicit TLS) */}}
    "0.0.0.0:993" = { 
      protocol = "imap"
      , tls = { implicit = true }
      {{- if .Values.stalwart.tls.enabled }}
      , tls.certificate = "{{ .Values.stalwart.tls.certificate.certPath | default "/etc/ssl/certs/tls.crt" }}"
      , tls.private-key = "{{ .Values.stalwart.tls.certificate.keyPath | default "/etc/ssl/private/tls.key" }}"
      {{- end }}
      {{- if .Values.stalwart.rateLimit.enabled }}
      , max-connections = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 100 }}
      {{- end }}
    }
    {{- /* POP3 */}}
    "0.0.0.0:110" = { 
      protocol = "pop3"
      {{- if .Values.stalwart.rateLimit.enabled }}
      , max-connections = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 100 }}
      {{- end }}
    }
    {{- /* POP3S (port 995 - implicit TLS) */}}
    "0.0.0.0:995" = { 
      protocol = "pop3"
      , tls = { implicit = true }
      {{- if .Values.stalwart.tls.enabled }}
      , tls.certificate = "{{ .Values.stalwart.tls.certificate.certPath | default "/etc/ssl/certs/tls.crt" }}"
      , tls.private-key = "{{ .Values.stalwart.tls.certificate.keyPath | default "/etc/ssl/private/tls.key" }}"
      {{- end }}
      {{- if .Values.stalwart.rateLimit.enabled }}
      , max-connections = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 100 }}
      {{- end }}
    }
    {{- /* ManageSieve (port 4190) */}}
    "0.0.0.0:4190" = { 
      protocol = "managesieve"
      {{- if .Values.stalwart.rateLimit.enabled }}
      , max-connections = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 100 }}
      {{- end }}
    }
    {{- /* HTTP Admin API (port 8080) */}}
    "0.0.0.0:8080" = { 
      protocol = "http"
      {{- if .Values.stalwart.rateLimit.enabled }}
      , max-connections = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 100 }}
      {{- end }}
    }
    
    # Storage configuration
    [storage.data]
    type = "{{ .Values.stalwart.storage.type | default "rocksdb" }}"
    path = "{{ .Values.stalwart.storage.dataPath | default "/opt/stalwart-mail/data" }}"
    
    {{- if eq .Values.stalwart.storage.blob.type "s3" }}
    [storage.blob]
    type = "s3"
    bucket = "{{ .Values.stalwart.storage.blob.s3.bucket }}"
    endpoint = "{{ .Values.stalwart.storage.blob.s3.endpoint }}"
    region = "{{ .Values.stalwart.storage.blob.s3.region }}"
    access-key = "{{ .Values.stalwart.storage.blob.s3.accessKey }}"
    secret-key = "{{ .Values.stalwart.storage.blob.s3.secretKey }}"
    {{- else }}
    [storage.blob]
    type = "{{ .Values.stalwart.storage.blob.type | default "rocksdb" }}"
    path = "{{ .Values.stalwart.storage.blob.path | default "/opt/stalwart-mail/data/blob" }}"
    {{- end }}
    
    [storage.lookup]
    type = "{{ .Values.stalwart.storage.type | default "rocksdb" }}"
    path = "{{ .Values.stalwart.storage.dataPath | default "/opt/stalwart-mail/data/lookup" }}"
    
    [storage.fts]
    type = "{{ .Values.stalwart.storage.type | default "rocksdb" }}"
    path = "{{ .Values.stalwart.storage.dataPath | default "/opt/stalwart-mail/data/fts" }}"
    
    [storage.directory]
    type = "filesystem"
    path = "{{ .Values.stalwart.storage.dataPath | default "/opt/stalwart-mail/data/directory" }}"
    
    # Directory configuration
    [directory]
    type = "{{ .Values.stalwart.directory.type | default "ldap" }}"
    
    {{- if eq (.Values.stalwart.directory.type | default "ldap") "ldap" }}
    [directory.ldap]
    host = "{{ .Values.stalwart.directory.ldap.host | default "ums-ldap.opendesk.svc.cluster.local" }}"
    port = {{ .Values.stalwart.directory.ldap.port | default 636 }}
    base-dn = "{{ .Values.stalwart.directory.ldap.baseDn | default "dc=uni-marburg,dc=de" }}"
    bind-dn = "{{ .Values.stalwart.directory.ldap.bindDn | default "cn=admin,dc=uni-marburg,dc=de" }}"
    bind-password = "{{ .Values.stalwart.directory.ldap.bindPassword | default "" }}"
    {{- if .Values.stalwart.directory.ldap.tls.enabled }}
    tls = true
    {{- if .Values.stalwart.directory.ldap.tls.skipVerify }}
    tls.skip-verify = true
    {{- end }}
    {{- else }}
    tls = false
    {{- end }}
    {{- end }}
    
    # Authentication configuration
    {{- if .Values.stalwart.auth.oidc.enabled }}
    [auth.oauth2]
    enabled = true
    issuer = "{{ .Values.stalwart.auth.oidc.issuerUrl | default "https://portal.opendesk.hrz.uni-marburg.de/realms/opendesk" }}"
    client-id = "{{ .Values.stalwart.auth.oidc.clientId | default "stalwart" }}"
    client-secret = "{{ .Values.stalwart.auth.oidc.clientSecret | default "" }}"
    client-auth-method = "client_secret_basic"
    scope = ["{{ .Values.stalwart.auth.oidc.scope | default "openid profile email" }}"]
    {{- end }}
    
    # Fallback admin account
    [auth.admin]
    user = "{{ .Values.stalwart.auth.fallbackAdmin.username | default "admin" }}"
    pass = "{{ .Values.stalwart.auth.fallbackAdmin.passwordHash | default "" }}"
    {{- if .Values.stalwart.auth.fallbackAdmin.description }}
    description = "{{ .Values.stalwart.auth.fallbackAdmin.description }}"
    {{- end }}
    
    # Logging configuration
    [logging]
    type = "{{ .Values.stalwart.logging.type | default "daily" }}"
    level = "{{ .Values.stalwart.logging.level | default "info" }}"
    path = "{{ .Values.stalwart.logging.path | default "/opt/stalwart-mail/logs/stalwart.log" }}"
    {{- if .Values.stalwart.logging.retentionDays }}
    retention = {{ .Values.stalwart.logging.retentionDays }}
    {{- end }}
    
    # Rate limiting configuration
    {{- if .Values.stalwart.rateLimit.enabled }}
    [rate-limit]
    max-messages-per-session = {{ .Values.stalwart.rateLimit.maxMessagesPerSession | default 100 }}
    max-recipients-per-message = {{ .Values.stalwart.rateLimit.maxRecipientsPerMessage | default 100 }}
    max-connections-per-ip = {{ .Values.stalwart.rateLimit.maxConnectionsPerIp | default 50 }}
    {{- end }}
