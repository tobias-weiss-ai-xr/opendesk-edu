{{- if and .Values.stalwart.persistence.enabled (not .Values.stalwart.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stalwart.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    backup-tier: "b"
    k8up/backup: "true"
spec:
  accessModes:
    - {{ .Values.stalwart.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.stalwart.persistence.size | default "20Gi" }}
  {{- if .Values.stalwart.persistence.storageClass }}
  storageClassName: {{ .Values.stalwart.persistence.storageClass }}
  {{- end }}
{{- end }}
