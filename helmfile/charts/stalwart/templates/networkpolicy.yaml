{{- if .Values.stalwart.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stalwart.fullname" . }}-network-policy
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stalwart.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # DNS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # Self-communication
    - to:
        - podSelector:
            matchLabels:
              {{- include "stalwart.selectorLabels" . | nindent 14 }}
    # Allow egress to any namespace in the cluster for outbound mail delivery
    - ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
  ingress:
    # Self-communication
    - from:
        - podSelector:
            matchLabels:
              {{- include "stalwart.selectorLabels" . | nindent 14 }}
    # Ingress from HAProxy ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-controller
          podSelector:
            matchLabels:
              app.kubernetes.io/name: haproxy-ingress
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
