{{- if or (not .Values.networkPolicy) .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slidev.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slidev.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slidev.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: haproxy
      ports:
        - port: 80
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "slidev.selectorLabels" . | nindent 14 }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              {{- include "slidev.selectorLabels" . | nindent 14 }}
{{- end }}
