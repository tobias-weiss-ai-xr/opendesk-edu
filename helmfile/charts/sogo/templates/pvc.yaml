{{- if .Values.sogo.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-sogo-data
  labels:
{{ include "sogo.labels" . | nindent 4 }}
    backup-tier: "b"
    k8up/backup: "true"
  annotations:
    # RWO PVC: exclude from k8up backup-live (multi-attach hang, AGENTS.md #7)
    k8up.io/exclude: "true"
spec:
  accessModes:
    - {{ .Values.sogo.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.sogo.persistence.size }}
  {{- if .Values.sogo.persistence.storageClass }}
  storageClassName: {{ .Values.sogo.persistence.storageClass }}
  {{- else }}
  storageClassName: ceph-rbd-ssd
  {{- end }}
{{- end }}
