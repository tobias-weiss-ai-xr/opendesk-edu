planka:
  image: ghcr.io/plankanban/planka
  tag: "latest@sha256:19b507ae3ab5cb1855c3f6984249e4a4881ed0b912febdfd492139c29bf10f39"
  port: 1337

  # Default admin user credentials (overridden by secretRef when set)
  defaultEmail: ""
  # defaultPassword: ""  # Auto-generated by template (randAlphaNum 32) if not set

  # Base URL for Planka
  baseUrl: ""

  # Secret key for encryption (overridden by secretRef when set)
  # secretKey: ""  # Auto-generated by template (randAlphaNum 64) if not set

  # OIDC configuration for Keycloak integration
  # Override these for your environment (eg via helm --set or helmfile values)
  oidc:
    clientId: "opendesk-planka"
    authEndpoint: ""
    tokenEndpoint: ""
    userinfoEndpoint: ""
    scope: "openid profile email"

  # Volume configuration
  volumes:
    data:
      size: 1Gi
      accessMode: ReadWriteMany
      # storageClass: ""

  # Database connection (overrides postgresql.auth.*)
  db:
    host: ""
    user: ""
    password: ""
    name: ""

  # Resource configuration
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # =========================================================================
  # MONITORING (ServiceMonitor for Prometheus)
  # =========================================================================
  monitoring:
    enabled: false
    interval: 30s
    path: /health
    port: http
    labels:
      release: kube-prometheus-stack

extraVolumes: []
extraVolumeMounts: []

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "haproxy"
  hosts:
    - host: planka.opendesk.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: planka-tls
      hosts:
        - planka.opendesk.example.com

# PostgreSQL is provided by the shared postgresql release.
# The service planka-postgresql is an ExternalName pointing to postgresql.opendesk.svc.cluster.local
postgresql:
  enabled: false
  auth:
    username: planka
    password: ""
    database: planka
