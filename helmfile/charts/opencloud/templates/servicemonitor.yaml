{{- if .Values.opencloud.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "opencloud.fullname" . }}-monitor
  labels:
{{ include "opencloud.labels" . | nindent 4 }}
    {{- if .Values.opencloud.monitoring.labels }}
{{ toYaml .Values.opencloud.monitoring.labels | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: {{ .Values.opencloud.monitoring.port | default "http" | quote }}
      interval: {{ .Values.opencloud.monitoring.interval | default "30s" }}
      path: {{ .Values.opencloud.monitoring.path | default "/health" | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opencloud.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
