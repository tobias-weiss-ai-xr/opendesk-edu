bookstack:
  image: linuxserver/bookstack
  tag: "latest@sha256:d945ea01e37d5fd800e506f80be98c9e650952c0e3b41f95f736b753778de7a8"
  port: 80

  # Database configuration
  db:
    host: "" # Will be set by mariadb chart if left empty
    port: 3306
    user: bookstack
    password: "" # Overridden by mariadb.auth.password if not empty
    name: bookstack

  # Persistence configuration
  volumes:
    uploads:
      size: 1Gi
      accessMode: ReadWriteMany
      # storageClass: ""

  # Resource configuration
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Replica count
  replicas: 1
  appKey: ""  # Deprecated: use appKeyExistingSecret instead
  appKeyExistingSecret: ""  # Name of existing secret with key 'app-key'. Generate with: docker run --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:latest appkey
  phpFpmPoolOverride:
    enabled: false

extraVolumes: []
extraVolumeMounts: []

sso:
  oidc:
    enabled: false
    clientId: ""
    clientSecret: ""
    issuerBaseUrl: ""

ingress:
  enabled: true
  annotations: {}
  hosts:
    - host: bookstack.opendesk.hrz.uni-marburg.de
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: bookstack-tls
      hosts:
        - bookstack.opendesk.hrz.uni-marburg.de

mariadb:
  enabled: true
  image:
    registry: docker.io
    repository: library/mariadb
    tag: "11.4"
  auth:
    username: bookstack
    password: ""
    database: bookstack
  primary:
    persistence:
      enabled: true
      size: 8Gi
      accessMode: ReadWriteOnce
      storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # =========================================================================
  # MONITORING (ServiceMonitor for Prometheus)
  # =========================================================================
  monitoring:
    enabled: false
    interval: 30s
    path: /health
    port: http
    labels:
      release: kube-prometheus-stack
