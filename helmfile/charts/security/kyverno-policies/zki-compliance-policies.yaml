# =============================================================================
# SECTION 6: APPLICATION SECURITY POLICIES
# BSI IT-Grundschutz: INF.14 (Web Applications), APP.2 (Web Servers)
# ZKI Priority: High
# =============================================================================

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: zki-require-security-headers
  annotations:
    policies.kyverno.io/title: Require Security Headers for Ingress
    policies.kyverno.io/category: Application Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Recommends that all Ingress resources have security headers configured.
      BSI IT-Grundschutz: INF.14 M 4.10 (Security Headers)
      ZKI Priority: P1 (High)
      Headers should be configured via ConfigMap or directly in Ingress.
    openDesk.zki/compliance: "BSI-INF.14-M4.10"
    openDesk.zki/priority: "P1"
    openDesk.zki/category: "Application Security"
spec:
  validationFailureAction: audit
  background: true
  rules:
    - name: check-security-headers
      match:
        any:
        - resources:
            kinds:
              - Ingress
      context:
        - name: requiredHeaders
          configMap:
            name: security-headers
            namespace: default
      validate:
        message: >-
          Ingress should have security headers configured.
          BSI Requirement: INF.14 M 4.10 - Web Application Firewall / Security Headers
          Recommended headers:
            - Strict-Transport-Security
            - X-Content-Type-Options
            - X-Frame-Options
            - X-XSS-Protection
            - Content-Security-Policy
            - Referrer-Policy
            - Permissions-Policy
          Use a ConfigMap with nginx.ingress.kubernetes.io/configuration-snippet annotation.
        pattern:
          metadata:
            annotations:
              nginx.ingress.kubernetes.io/configuration-snippet: "?*"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: zki-require-probe-timeouts
  annotations:
    policies.kyverno.io/title: Require Probe Timeouts
    policies.kyverno.io/category: Application Security
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Recommends that all containers have properly configured probe timeouts.
      BSI IT-Grundschutz: INF.2 M 1.92 (Secure Application Server Configuration)
      ZKI Priority: P2 (Medium)
      Prevents probes from causing service disruptions.
    openDesk.zki/compliance: "BSI-INF.2-M1.92"
    openDesk.zki/priority: "P2"
    openDesk.zki/category: "Application Security"
spec:
  validationFailureAction: audit
  background: true
  rules:
    - name: check-liveness-probe-timeout
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: >-
          Container {{ element.name }} liveness probe timeout should be less than the interval.
          Current: timeoutSeconds: {{ element.livenessProbe.timeoutSeconds }}, intervalSeconds: {{ element.livenessProbe.intervalSeconds }}
          Best practice: timeoutSeconds < intervalSeconds
        foreach:
        - list: "{{ request.object.spec.containers }}"
          when:
          - key: "{{ element.livenessProbe }}"
            operator: NotEquals
            value: null
          - key: "{{ element.livenessProbe.timeoutSeconds }}"
            operator: NotEquals
            value: null
          - key: "{{ element.livenessProbe.intervalSeconds }}"
            operator: NotEquals
            value: null
          pattern:
            livenessProbe:
              timeoutSeconds: < {{ element.livenessProbe.intervalSeconds }}
    - name: check-readiness-probe-timeout
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: >-
          Container {{ element.name }} readiness probe timeout should be less than the interval.
          Current: timeoutSeconds: {{ element.readinessProbe.timeoutSeconds }}, intervalSeconds: {{ element.readinessProbe.intervalSeconds }}
          Best practice: timeoutSeconds < intervalSeconds
        foreach:
        - list: "{{ request.object.spec.containers }}"
          when:
          - key: "{{ element.readinessProbe }}"
            operator: NotEquals
            value: null
          - key: "{{ element.readinessProbe.timeoutSeconds }}"
            operator: NotEquals
            value: null
          - key: "{{ element.readinessProbe.intervalSeconds }}"
            operator: NotEquals
            value: null
          pattern:
            readinessProbe:
              timeoutSeconds: < {{ element.readinessProbe.intervalSeconds }}

---
# =============================================================================
# SECTION 7: METADATA AND LABELING POLICIES
# BSI IT-Grundschutz: CON (Concepts and Strategies)
# ZKI Priority: Medium
# =============================================================================

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: zki-require-spdx-license
  annotations:
    policies.kyverno.io/title: Require SPDX License Header
    policies.kyverno.io/category: Compliance
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: ConfigMap, Secret
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Requires all ConfigMaps and Secrets to have SPDX license headers.
      This ensures REUSE compliance for openDesk.
      ZKI Priority: P2 (Medium)
    openDesk.zki/compliance: "REUSE"
    openDesk.zki/priority: "P2"
    openDesk.zki/category: "Compliance"
spec:
  validationFailureAction: audit
  background: true
  rules:
    - name: check-spdx-license
      match:
        any:
        - resources:
            kinds:
              - ConfigMap
              - Secret
      validate:
        message: >-
          Resource must have SPDX license header in data.
          All files in openDesk must have SPDX headers for REUSE compliance.
          Example: # SPDX-License-Identifier: AGPL-3.0
          Current data keys: {{ request.object.data | keys }}
        pattern:
          data:
            (X): "# SPDX-FileCopyrightText:*\n# SPDX-License-Identifier:*\n*"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: zki-require-owner-labels
  annotations:
    policies.kyverno.io/title: Require Owner Labels
    policies.kyverno.io/category: Compliance
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: All
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Requires all resources to have owner labels.
      BSI IT-Grundschutz: ISMS M 7.1.3 (Responsibilities)
      ZKI Priority: P2 (Medium)
    openDesk.zki/compliance: "BSI-ISMS-M7.1.3"
    openDesk.zki/priority: "P2"
    openDesk.zki/category: "Compliance"
spec:
  validationFailureAction: audit
  background: true
  rules:
    - name: check-owner-labels
      match:
        any:
        - resources:
            kinds:
              - Deployment
              - StatefulSet
              - DaemonSet
              - Job
              - CronJob
              - Service
              - Ingress
              - PersistentVolumeClaim
      validate:
        message: >-
          Resource must have owner labels.
          BSI Requirement: ISMS M 7.1.3 - Responsibilities
          Required labels:
            - owner: Team or individual responsible
            - team: Team name
          Current labels: {{ request.object.metadata.labels }}
        pattern:
          metadata:
            labels:
              owner: "?"
              team: "?"

