# =============================================================================
# SECTION 8: EXCEPTIONS AND WAIVERS
# BSI IT-Grundschutz: ISMS (Management)
# ZKI Priority: Low
# =============================================================================

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: zki-exception-handling
  annotations:
    policies.kyverno.io/title: Exception Handling Procedure
    policies.kyverno.io/category: Compliance
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: All
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Documents the procedure for handling policy exceptions.
      BSI IT-Grundschutz: ISMS M 7.1 (Information Security Management System)
      ZKI Priority: P3 (Low)
      Exceptions must be approved and documented.
    openDesk.zki/compliance: "BSI-ISMS-M7.1"
    openDesk.zki/priority: "P3"
    openDesk.zki/category: "Compliance"
spec:
  validationFailureAction: audit
  background: false
  rules:
    - name: exception-child-policies
      match:
        resources:
          kinds:
            - ""  # This is a documentation-only policy
      values:
        message: >-
          EXCEPTION HANDLING PROCEDURE
          ============================
          
          To request an exception to a ZKI Kyverno policy:
          
          1. ACCEPT RISK
             - Acknowledge that you understand the security risk
             - Accept responsibility for any incidents
          
          2. PROVIDE JUSTIFICATION
             - Explain why the exception is needed
             - Describe the business requirement
             - Document the impact of not granting the exception
          
          3. IMPLEMENT COMPENSATING CONTROLS
             - Identify alternative security measures
             - Implement additional monitoring or logging
             - Add extra access controls
          
          4. LIMIT SCOPE AND DURATION
             - Limit exception to specific resources
             - Set an expiration date
             - Plan for future compliance
          
          5. OBTAIN APPROVALS
             - Security Team review
             - CISO approval for P0/P1 policies
             - Document approval in exception register
          
          6. IMPLEMENT AND MONITOR
             - Apply exception via policy exception
             - Monitor for incidents
             - Review regularly
          
          Exception Register Location: https://github.com/opendesk-edu/security-docs/blob/main/exceptions.md
          Exception Template: Available in security-policies/templates/
          
          EXCEPTIONS TO THIS POLICY:
          - kube-system namespace (system components)
          - kyverno namespace (policy management)
          - logging namespace (central logging)
          - monitoring namespace (central monitoring)
