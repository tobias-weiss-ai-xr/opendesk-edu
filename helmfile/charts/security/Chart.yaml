apiVersion: v2
name: security
description: |-
  openDesk Security Helm Chart
  
  This chart deploys security components and policies for openDesk Edu,
  aligned with ZKI IT-Grundschutz-Profil and BSI IT-Grundschutz requirements.
  
  ## Components
  
  - **Kyverno Policies**: Cluster-wide security policies for:
    - Pod Security (PSA compliance)
    - Network Security (NetworkPolicies, Ingress)
    - Access Control (RBAC, service accounts)
    - Data Protection (encryption, classification)
    - Application Security (headers, probes)
    - Logging and Monitoring
    - Compliance (SPDX headers, owner labels)
    
  - **Security Headers**: ConfigMap with recommended HTTP security headers
  
  - **Audit Policies**: Kubernetes audit logging configuration
  
  ## Requirements
  
  - Kubernetes >= 1.25.0
  - Kyverno >= 1.10.0 (for policy enforcement)
  - Helm >= 3.10.0

type: application
version: 1.0.0
depends_on: []

