{{- if .Values.mariadb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mariadb.fullname" . }}
  labels:
{{ include "mariadb.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
{{ include "mariadb.selectorLabels" . | nindent 6 }}
{{- end }}
