apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mariadb.fullname" . }}
  labels:
{{ include "mariadb.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "mariadb.fullname" . }}
  selector:
    matchLabels:
{{ include "mariadb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "mariadb.labels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 999
      containers:
        - name: mariadb
          image: {{ include "mariadb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_USER
              value: {{ .Values.auth.username | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-database-credentials" (include "mariadb.fullname" .)) }}
                  key: {{ .Values.auth.existingSecretPasswordKey | default "password" }}
            - name: MARIADB_DATABASE
              value: {{ .Values.auth.database | quote }}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-database-credentials" (include "mariadb.fullname" .)) }}
                  key: {{ .Values.auth.existingSecretRootPasswordKey | default "root-password" }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -u
                - {{ .Values.auth.username | quote }}
                - -p$(MARIADB_PASSWORD)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -u
                - {{ .Values.auth.username | quote }}
                - -p$(MARIADB_PASSWORD)
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
