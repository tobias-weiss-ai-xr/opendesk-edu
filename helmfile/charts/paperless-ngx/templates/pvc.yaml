{{- if and .Values.persistence.enabled .Values.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "paperless-ngx.fullname" . }}-data
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.persistence.data.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.backup.enabled }}
    k8up.io/exclude: "false"
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size | quote }}
  storageClassName: {{ .Values.persistence.data.storageClass | quote }}
---
{{- end }}
{{- if and .Values.persistence.enabled .Values.persistence.consume.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "paperless-ngx.fullname" . }}-consume
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.persistence.consume.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.backup.enabled }}
    k8up.io/exclude: "false"
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.consume.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.consume.size | quote }}
  storageClassName: {{ .Values.persistence.consume.storageClass | quote }}
{{- end -}}
