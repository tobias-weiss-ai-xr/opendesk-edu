# Helm unittest tests for Paperless-ngx deployment

suite: test paperless-ngx deployment
values:
  - values.yaml

tests:
  - it: should render deployment with correct image
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].image
          content: ghcr.io/paperless-ngx/paperless-ngx:2.12.0
      - equal:
          path: spec.replicas
          value: 1

  - it: should have correct labels
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: metadata.labels.app.kubernetes.io/name
          content: paperless-ngx
      - contains:
          path: metadata.labels.app.kubernetes.io/instance
          content: RELEASE-NAME

  - it: should have OIDC environment variables when enabled
    template: templates/deployment.yaml
    set:
      paperless.oidc.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_OIDC_ISSUER
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_OIDC_CLIENT_ID

  - it: should have database environment variables
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_DBENGINE
            value: postgres
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_DBNAME
            value: paperless

  - it: should have Redis environment variables
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_REDIS
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_CACHE_BACKEND

  - it: should have security context
    template: templates/deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].securityContext.privileged
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: should have liveness probe
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].livenessProbe
          content:
            httpGet:
              path: /api/
              port: http

  - it: should have readiness probe
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].readinessProbe
          content:
            httpGet:
              path: /api/
              port: http

  - it: should have volume mounts for data
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /usr/src/paperless/data
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: consume
            mountPath: /usr/src/paperless/consume
