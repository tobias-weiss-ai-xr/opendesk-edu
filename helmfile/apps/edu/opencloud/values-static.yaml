# SPDX-License-Identifier: Apache-2.0
---
image:
  registry: docker.io
  repository: opencloudeu/opencloud
  tag: 4.0.3
  pullPolicy: "IfNotPresent"

ingress:
  enabled: true
  className: "haproxy"
  annotations:
    haproxy-ingress.github.io/ssl-redirect: "true"
    haproxy-ingress.github.io/proxy-body-size: "100M"
    haproxy-ingress.github.io/timeout-server: "600s"
    haproxy-ingress.github.io/timeout-client: "600s"
  hosts:
    - host: "files.opendesk.hrz.uni-marburg.de"
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: "opendesk-certificates-tls"
      hosts:
        - "files.opendesk.hrz.uni-marburg.de"

persistence:
  enabled: true
  size: 100Gi
  storageClass: "ceph-rbd-ssd"
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

replicaCount: 1

podSecurityContext:
  fsGroup: 33
  runAsUser: 33

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}

tolerations: []

affinity: {}

existingSecret: "opendesk-opencloud-secrets"

existingConfigmap: "opendesk-opencloud-config"

oidc:
  enabled: true
  issuer: "https://portal.opendesk.hrz.uni-marburg.de/realms/opendesk"
  clientId: "opendesk-opencloud"
  clientSecret: "changeme-replace-with-actual-client-secret"
  discoveryEndpoint: "https://portal.opendesk.hrz.uni-marburg.de/realms/opendesk/.well-known/openid-configuration"

php:
  memoryLimit: "512M"
  uploadMaxFilesize: "100M"
  postMaxSize: "100M"
  maxExecutionTime: 600
  opcache:
    enabled: true
    memoryConsumption: "128"
