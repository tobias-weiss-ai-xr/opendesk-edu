# SOPS config for manually-applied opendesk secrets (not ArgoCD-synced).
# These are decrypted with `sops -d <file> | kubectl apply -f -`.
# Encrypted with the same age key as helmfile environments (ADR-001).
creation_rules:
  - path_regex: .*secret.*\.yaml$
    age: age15437xk7432fpwtrd2gpwcmh7xyzacvp2sy6qr5sq2n3zqah5u9tqw5s539
    encrypted_regex: "^(db-password|admin-password|password|secret|apiKey|token|privateKey|root-password|mariadb-root-password|mysql-root-password|keycloak|opencloud|sogo|sogo6|synapse)$"
