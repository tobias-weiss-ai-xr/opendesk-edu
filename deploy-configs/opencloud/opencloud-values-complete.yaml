# OpenCloud values for production (complete configuration)
image:
  registry: docker.io
  repository: opencloudeu/opencloud
  tag: "4.0.3"
  pullVersion: IfNotPresent

replicaCount: 1

config:
  enabled: false  # Disable IDM setup init container

podSecurityContext:
  fsGroup: 0
  runAsUser: 0
  runAsGroup: 0

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

ingress:
  enabled: true
  className: "haproxy"
  annotations:
    haproxy-ingress.github.io/ssl-redirect: "true"
    haproxy-ingress.github.io/proxy-body-size: "100M"
    haproxy-ingress.github.io/timeout-server: "600s"
    haproxy-ingress.github.io/timeout-client: "600s"
  hosts:
    - host: "files.opendesk.hrz.uni-marburg.de"
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: "opendesk-certificates-tls"
      hosts:
        - "files.opendesk.hrz.uni-marburg.de"

persistence:
  enabled: true
  size: 100Gi
  storageClass: "ceph-cephfs-hdd-ec"
  accessModes:
    - ReadWriteMany

oidc:
  enabled: true
  issuer: "https://portal.opendesk.hrz.uni-marburg.de/realms/opendesk"
  internalIssuer: "https://portal.opendesk.hrz.uni-marburg.de/realms/opendesk"
  clientId: "opendesk-opencloud"
  clientSecret: "changeme-opencloud-oidc"
  autoProvisionAccounts: "true"
  roleAssignmentDriver: "oidc"
  rewriteWellknown: "true"
  userOidcClaim: "sub"
  userCs3Claim: "sub"
  autoProvisionClaimUsername: "preferred_username"
  adminUserId: ""
  defaultAssignments: "false"
  assignDefaultUserRole: "false"
  usernameMatch: "none"
  excludeRunServices: "idp,idm,auth-basic"
  accountEditLink: "https://portal.opendesk.hrz.uni-marburg.de/realms/opendesk/account"

logLevel: info

# System configuration
systemUserId: "admin"
serviceAccountId: "dc3eee3e-7831-45e4-b986-8e470f37ac23"
storageUsersMountId: "ca65db73-407e-43ca-b393-9b141f43aa8f"
graphApplicationId: "fdfc30d2-5cc5-40a4-8beb-ce6801bbca41"

# Secrets
jwtSecret: "changeme-jwt-secret-00000000-0000-0000-0000-000000000000"
transferSecret: "changeme-transfer-secret-00000000-0000-0000-0000-000000000000"
machineAuthApiKey: "changeme-machine-auth-key"
systemUserApiKey: "changeme-system-user-api-key"
urlSigningSecret: "changeme-url-signing-secret"

php:
  memoryLimit: "512M"
  uploadMaxFilesize: "100M"
  postMaxSize: "100M"
  maxExecutionTime: 600
