# DMARC/DKIM/SPF Override für Stalwart im opendesk-edu Helm-Chart
#
# Datei: helmfile/apps/edu/stalwart/values.yaml.gotmpl (Ergänzung)
# Anwendung: Bei Stalwart v0.17+ (config.toml-basiert)
# Für v0.16.x: Über Web-Admin-UI (mail.home.opendesk-edu.org/admin/)
#
# Credentials: admin / ${STALWART_ADMIN_PASSWORD}

# =============================================================================
# ERGÄNZUNG ZU helmfile/apps/edu/stalwart/values.yaml.gotmpl
# =============================================================================

stalwart:
  # ... bestehende Konfiguration ...

  # --- DMARC/DKIM/SPF Konfiguration ---
  config:
    # Ausgehende DKIM-Signatur
    session.smtp.mail.sign: true
    session.smtp.mail.key: "s2"
    session.smtp.mail.domain: "opendesk-edu.org"

    session.smtp.mail.dkim.canonicalization: "relaxed/simple"
    session.smtp.mail.dkim.headers: ["From", "Reply-To", "Subject", "Date", "To", "Cc", "Message-ID"]
    session.smtp.mail.dkim.signature-expiry: "7d"

    # Eingehende Prüfung (Phase 1: Monitoring)
    session.smtp.rcpt.reject-spf: false
    session.smtp.rcpt.reject-dkim: false
    session.smtp.rcpt.reject-dmarc: false

    # DMARC-Reporting
    session.smtp.rcpt.dmarc.report: true
    session.smtp.rcpt.dmarc.report-interval: 86400
    session.smtp.rcpt.dmarc.report-rua: "mailto:dmarc-report@home.opendesk-edu.org"
    session.smtp.rcpt.dmarc.report-fo: "1"

    session.smtp.rcpt.spf.reject: false
    session.smtp.rcpt.dkim.reject: false
    session.smtp.rcpt.dkim.verify: true

    # ARC (für DFN-AAI-Weiterleitungen)
    session.smtp.arc.add-seal: true
    session.smtp.arc.add-timestamp: true
    session.smtp.arc.verify: true

    # Reporting
    report.dmarc.enable: true
    report.dmarc.rua: "mailto:dmarc-report@home.opendesk-edu.org"
    report.dmarc.interval: 86400

    report.tls.enable: true
    report.tls.rua: "mailto:tls-report@home.opendesk-edu.org"

  # DKIM-Keys via extraConfigMap mounten
  extraVolumes:
    - name: dkim-keys
      secret:
        secretName: stalwart-dkim-keys

  extraVolumeMounts:
    - name: dkim-keys
      mountPath: /opt/stalwart/etc/keys
      readOnly: true

# =============================================================================
# NOTWENDIGE DNS-EINTRÄGE (in der Zonenverwaltung eintragen)
# =============================================================================
#
# 1. SPF: Cluster-IPs in SPF aufnehmen
#    opendesk-edu.org.  TXT  "v=spf1 include:_spf.opendesk-edu.org include:_spf.plan.io
#                            ip4:192.168.3.110/24 ~all"
#
# 2. DKIM: Selector s2 für Stalwart
#    s2._domainkey.opendesk-edu.org.  TXT  "v=DKIM1; k=rsa; p=<PUBLIC_KEY>"
#
# 3. DMARC: Bestehenden Record optimieren
#    _dmarc.opendesk-edu.org.  TXT  "v=DMARC1; p=quarantine; sp=quarantine;
#                                  rua=mailto:dmarc-report@home.opendesk-edu.org;
#                                  ruf=mailto:dmarc-ruf@home.opendesk-edu.org;
#                                  fo=1; ri=3600"
#
# 4. TLS-RPT (optional)
#    _smtp._tls.opendesk-edu.org.  TXT  "v=TLSRPTv1; rua=mailto:tls-report@home.opendesk-edu.org"

# =============================================================================
# SCHRITTWEISE AKTIVIERUNG
# =============================================================================
#
# Phase 1 (Sofort):   reject-* = false, report = true → Status quo
# Phase 2 (2 Wochen): reject-dmarc = true
# Phase 3 (1 Monat):  reject-spf = true, reject-dkim = true
#
# Jeweils `reject-*` von false auf true setzen.
