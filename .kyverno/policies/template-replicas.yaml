---
apiVersion: "kyverno.io/v1"
kind: "ClusterPolicy"
metadata:
  name: "template-replicas"
  annotations:
    policies.kyverno.io/title: "Validate openDesk Pod replicas templating"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: >-
      This policy verifies that `.Values.replicas.<app>` variables are templated.
spec:
  background: true
  rules:
    - match:
        resources:
          kinds:
            - "Deployment"
            - "StatefulSet"
      name: "template-replicas"
      validate:
        message: "Verifies that replica count can be customized by `.Values.replicas.<app>` variable."
        anyPattern:
          # Exception: The Nubus LDAP primary is pinned to 2 in `_overwrite.yaml`
          # because it does not scale beyond 2, every other scaling is done through
          # the LDAP secondary (read-only) Pods.
          - metadata:
              name: "*ldap-server-primary*"
            spec:
              replicas: 2
          # Exception: Jitsi's jicofo, prosody and jigasi are singletons by design. The
          # upstream jitsi-meet chart hardcodes `replicas: 1` in their templates and never
          # reads `replicaCount`, so the value cannot be templated.
          - metadata:
              name: "*jicofo*"
            spec:
              replicas: 1
          - metadata:
              name: "*prosody*"
            spec:
              replicas: 1
          - metadata:
              name: "*jigasi*"
            spec:
              replicas: 1
          - spec:
              replicas: 42

  validationFailureAction: "audit"
...
