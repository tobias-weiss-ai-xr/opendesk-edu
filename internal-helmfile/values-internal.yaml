# Internal environment values for OpenDesk EDU
# Domain: opendesk.internal
# All services use self-signed certificates

global:
  domain: opendesk.internal
  hosts:
    opencloud: files
    stalwart: mail
    sogo: contacts
    keycloak: id
  
  # Internal cluster settings
  forceHttps: false  # Allow HTTP for development
  tlsEnabled: true   # But still use TLS with self-signed certs

# Secret values - for development only
# In production, use proper secret management
secrets:
  postgresql:
    password: "DevPass123!"
    sogoPassword: "SogoPass123!"
    stalwartPassword: "StalwartPass123!"
  
  keycloak:
    adminPassword: "AdminPass123!"
    dbPassword: "KeycloakDB123!"
  
  opencloud:
    jwtSecret: "abcdefghijklmnopqrstuvwxyz012345"
    transferSecret: "transfer-secret-12345"
    machineAuthApiKey: "machine-auth-key-12345"
    systemUserApiKey: "system-user-key-12345"
    systemUserId: "admin"
    urlSigningSecret: "url-signing-secret-12345"

# Platform settings
platform:
  realm: opendesk

# App-specific configuration
apps:
  keycloak:
    host: id.opendesk.internal
    enabled: true
  
  opencloud:
    enabled: true
    host: files.opendesk.internal
  
  stalwart:
    enabled: true
    host: mail.opendesk.internal
    # Internal smtp configuration
    smtpRelay: stalwart
  
  sogo:
    enabled: true
    host: contacts.opendesk.internal
    imapServer: imaps://stalwart:993
    smtpServer: smtp://stalwart:587
    sieveServer: sieve://stalwart:4190
    mailDomain: opendesk.internal
    oidc:
      enabled: true
      configUrl: "http://keycloak.educ.svc.cluster.local:8080/realms/opendesk/.well-known/openid-configuration"
      clientId: sogo
      scope: "openid profile email"
    memcachedHost: memcached:11211
    opencloud:
      enabled: true
      url: https://files.opendesk.internal
      webdavPath: /remote.php/dav/files/{uid}/

# Database configuration
databases:
  sogo:
    host: postgresql
    port: 5432
    username: sogo
    password: "SogoPass123!"
    name: sogo
  
  keycloak:
    host: postgresql
    port: 5432
    username: keycloak
    password: "KeycloakDB123!"
    name: keycloak

# LDAP configuration
ldap:
  host: "openldap.edu.svc.cluster.local"
  port: 389
  baseDN: "ou=users,dc=opendesk,dc=edu"
  sogoBindDN: "uid=sogo,ou=services,dc=opendesk,dc=edu"
  sogoBindPassword: "SogoLDAP123!"

# Ingress configuration
ingress:
  className: haproxy
  enabled: true
  tls:
    enabled: true
    autoGenerated: false  # We'll use cert-manager for certs

# Storage classes
storage:
  cephRbdSsd: ceph-rbd-ssd
  cephCephfsHddEc: ceph-cephfs-hdd-ec

# Resource limits
resources:
  opencloud:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  
  stalwart:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  
  sogo:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

# Affinity settings for SCS cluster
# These ensure pods run on appropriate nodes
affinity:
  nodeSelector:
    # For compute nodes
    kubernetes.io/hostname: clrz14-07
    # For manager node
    # kubernetes.io/hostname: clrz14-06
