apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: demo-opendesk-edu
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        log
        debug
        hosts {
            10.244.0.10 opendesk-edu-demo.local
            fallthrough
        }
        forward . 10.96.0.10
        cache 30
        loop
        reload
        loadbalance
    }